# Python 风格约定（只管 engine/ 与 tools/ 下的 .py）
#
# 为什么需要这个文件：仓库没有 CI，风格只能靠"一份配置 + 一条校验命令"落地。在它之前
# 每个编辑器各按自己的默认格式化器改文件，同一份代码在不同机器上反复漂移——有一轮提交里
# 混进了 500 行纯格式改动，就是这么来的。
#
# 约定只有两条：
#   1. **格式化器是唯一权威**：`ruff format` 说了算，人不与之争论；
#   2. **lint 只开能抓真 bug 的一组**，风格的事全部交给格式化器。
#
# 校验（与 compare_baseline / check_artifact 同一层，改完 .py 就跑）：
#   python -m ruff format --check . && python -m ruff check .

[tool.ruff]
# 与既有代码的**事实行长**一致。E501 实测（ruff check --select E501）：
# 79 列 653 处、100 列 102 处、128 列 4 处。
line-length = 128
target-version = "py311"

# **只认 .py**。默认还会去格式化 Markdown 里嵌入的 Python 代码块，而本仓 .md 里的那些块是
# 示意图与「最初设计」的历史记录（比如 `def fn_mean(vals, **kw):  ...` 这种占位省略号、
# 已经不存在的 `__GUARDS__` / `__TOPICS__` 占位符），重排它们只是把文档改花，
# 还会让文档与它记录的当时形态对不上。发现过程：`ruff format .` 把 CLAUDE.md 的
# 「执行链路」一节整段重排了。
include = ["*.py"]

[tool.ruff.lint]
# 刻意**不开**这些（不是遗漏，是设计决定，改之前先读这段）：
#   UP031  printf 风格 → f-string：本仓 .py 一律用 %-格式化，107 处，改了没有任何收益
#   BLE001 盲 except：引擎与校准工具里"取不到就退化成 None / 记一条 skip"是有意为之，
#           正是这个项目要的行为（不崩、留痕），不是疏漏
#   S102   exec：compute 表达式求值的设计本身（白名单 AST + 空 __builtins__），
#           换成别的写法就丢掉那道沙箱
#   TRY / SIM / C4 / FURB / I / RUF：纯偏好，收益不抵一次 1200+ 行的改动
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# engine/ 下的文件是**拼接片段**，不是独立模块：build-knowledge.mjs 把
#   operators.py → providers/api.py → providers/*.py → rule_engine.py → report_data.py
# 按顺序拼成一份脚本再执行（浏览器里也一样，只是改用 String.raw 内联）。
# 所以单文件看必然出现"未定义"的跨文件名字：__FAULTS__/__RULES__/__FACTS__、
# OPERATORS、SIGNATURES、open_log、ulog_bytes、provider、run_all、FORMATS。
# 这些名字的权威清单见 engine/README.md 的「拼接顺序」一节。
#
# F821 只对 engine/ 关掉——tools/ 下的脚本是独立可执行的，F821 在那里必须保持生效
# （它已经抓到过 download_px4_logs.py 里 ulog_path 未定义这类真 bug）。
"engine/rule_engine.py" = ["F821"]
"engine/report_data.py" = ["F821"]
"engine/providers/px4.py" = ["F821"]

[tool.ruff.format]
# 与 web/ 侧的 TypeScript 保持一致（那边 prettier 用双引号）。
quote-style = "double"
