# ⚠️ 本文件下的 3 条尚未接线进构建产物（见 PENDING.md 第 1 条）。
#
# 电池（BAT / CURR）：最低电压 vs 失效保护阈值、负载压降、突发跌落。
# 上游实现：ardupilot-mcp 的 checks/power.py。
#
# 降级的地方只有一处，先摆在这里：
# 上游的最低电压判据优先用参数 BATT_LOW_VOLT / BATT_CRT_VOLT，而本仓库的 APM provider
# 取不到任何参数（见 PENDING.md 的 C2）。上游有一条回退路径——按峰值电压估电芯数
# （4.2 V/节满电）再乘 3.5/3.3 V/节——本文件走的就是这条回退路径。
# 拿到参数后应当优先用参数（阈值回填见 PENDING.md 第五节第 5 条）。
#
# BAT / CURR 两个 topic 名是固件代际差异（Copter 4.x 用 BAT，3.x 用 CURR，字段同名），
# 一律用 `BAT || CURR` + ref 候选组成对处理。

id: apm-battery-low
name: 电池最低电压
group: battery
order: 1

conditions:
    topics:
        - "BAT || CURR"

compute:
    - volts = ref("BAT.Volt", "CURR.Volt")
    - vmin = min(volts)
    - vmax = max(volts)
    # 上游 meta.estimate_cells：cells = round(vmax / 4.2)（LiPo 满电 4.2 V/节），
    # 再要求折算每节电压落在 3.3~4.4 V，否则认定"没有电池监控 / 量纲异常"、不给结论。
    # 引擎没有 round 算子：+0.5 后截断即 round half up（与 Python round 的
    # banker's rounding 只在恰好 .5 处可能差 1，无实质影响）。
    # vmax 的量程闸门（4~70 V）也在这里一并卡掉，所以 trigger 里不必再判。
    - cells_raw = to_int(add(div(vmax, 4.2), 0.5))
    - per_cell = div(vmax, cells_raw)
    - >-
        cells = value_if(both(gt(vmax, 4.0), both(gt(70.0, vmax),
        both(gt(per_cell, 3.3), gt(4.4, per_cell)))), cells_raw)
    # 上游的 per-cell 阈值：LiPo 约 3.5 V/节告警、3.3 V/节临界
    - crit_v = scale(cells, 3.3)
    - low_v = scale(cells, 3.5)

outputs:
    tag: apm_battery_low_voltage

triggers:
    # 闸门已在 cells 里（峰值电压不在 4~70 V、或折算每节电压不在 3.3~4.4 V 时 cells 为 None，
    # crit_v / low_v 随之缺失、比较抛错被视作未命中）；这里再写一次是给读数的人看的。
    - when: "vmin <= crit_v and vmax <= 70.0"
      severity: critical
      threshold: 3.3
      value: f"{vmin:.2f}"
      unit: V
      field: "BAT/CURR.Volt(最低)"
      title: "电池电压触及临界线，最低 {vmin:.2f} V"
      suggestion: "已到临界电压动作点（估算 {cells:.0f}S × 3.3 V = {crit_v:.2f} V）。应就地降落/回收，继续飞有空中断电风险。"
    - when: "vmin <= low_v and vmax <= 70.0"
      severity: warning
      threshold: 3.5
      value: f"{vmin:.2f}"
      unit: V
      field: "BAT/CURR.Volt(最低)"
      title: "电池电压触及低电压告警线，最低 {vmin:.2f} V"
      suggestion: "已到低电压告警点（估算 {cells:.0f}S × 3.5 V = {low_v:.2f} V）。缩短航时或更早返航，并核对电池健康度。"

---
# 负载压降：只在高电流（>=20 A）的样本里看电压跨度。
# 上游用 max-min；引擎没有标量减法算子，但 range_of 就是极差，等价。
id: apm-battery-sag
name: 电池负载压降
group: battery
order: 2

conditions:
    topics:
        - "BAT || CURR"

compute:
    - volts = ref("BAT.Volt", "CURR.Volt")
    - curr = ref("BAT.Curr", "CURR.Curr")
    - peak_curr = max(curr)
    # 只保留电流 >= 20 A 的时刻（greater 是严格大于，与该阈值差一个等号，无实质影响）
    - sag = range_of(apply_mask(volts, greater(curr, 20.0)))

outputs:
    tag: apm_battery_sag

triggers:
    - when: "sag >= 1.0"
      severity: info
      threshold: 1.0
      value: f"{sag:.2f}"
      unit: V
      field: "BAT/CURR.Volt(>=20A 段极差)"
      title: "大电流下压降 {sag:.2f} V（峰值电流 {peak_curr:.1f} A）"
      suggestion: "带载压降一部分是正常的，但跨度偏大通常意味着电池老化、内阻升高，值得关注。"

---
# 突发跌落：上游 DROP_WARN_V=2.0 / DROP_CRIT_V=4.0 / DROP_MAX_DT_S=0.5，
# 且**必须排除"跌一拍就弹回"的毛刺**——跌后 1 s 内回升到跌幅一半以上就不算数。
# 这两条判据（间隔上限 + 恢复判据）封在 step_drop_events 里，经验文件只负责阈值与文案。
id: apm-battery-sudden-drop
name: 电池电压突降
group: battery
order: 3

conditions:
    topics:
        - "BAT || CURR"

compute:
    - volts = ref("BAT.Volt", "CURR.Volt")
    - vts = ref("BAT.timestamp", "CURR.timestamp")
    # 上游的量程闸门：电压中位数不在 4~70 V 之间说明没有电池监控或量纲异常，整条不分析
    - vmed = median(volts)
    - drops = value_if(both(gt(vmed, 4.0), gt(70.0, vmed)), step_drop_events(volts, vts, T0_US))

foreach: { var: drops, keys: [drop, dt_s, start_s, end_s, recovered] }

outputs:
    tag: apm_battery_sudden_drop

triggers:
    - when: "not recovered and drop > 4.0"
      severity: critical
      threshold: 4.0
      value: f"{drop:.2f}"
      unit: V
      field: "BAT/CURR.Volt(快速跌落)"
      title: "电池电压在 {dt_s:.3f} s 内跌落 {drop:.2f} V（t={start_s:.2f}s）"
      suggestion: "跌完没有回升，指向电池插头虚接、单节失效或瞬时掉电。检查电池插头与线缆、电池健康度；掉电会复位外设甚至飞控。"
    - when: "not recovered"
      severity: warning
      threshold: 2.0
      value: f"{drop:.2f}"
      unit: V
      field: "BAT/CURR.Volt(快速跌落)"
      title: "电池电压在 {dt_s:.3f} s 内跌落 {drop:.2f} V（t={start_s:.2f}s）"
      suggestion: "这么快的跌落不是正常放电（正常放电不会一步掉这么多），指向插头虚接、单节失效或瞬时掉电。检查电池插头与线缆、电池健康度。"
