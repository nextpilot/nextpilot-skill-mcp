# ⚠️ 本文件下的 3 条尚未接线进构建产物（见 PENDING.md 第 1 条）。
#
# 电池（BAT / CURR）：最低电压 vs 失效保护阈值、负载压降、突发跌落。
# 上游实现：ardupilot-mcp 的 checks/power.py。
#
# **这一组是整批规则里降级最狠的一组**，原因先摆在这里：
# 上游的最低电压判据用的是参数 BATT_LOW_VOLT / BATT_CRT_VOLT，而本仓库的 APM provider
# 取不到任何参数（见 PENDING.md 的 C2）。上游有一条回退路径——按峰值电压估电芯数
# （4.2 V/节满电）再乘 3.5/3.3 V/节——这条能迁，但要绕开一个算子缺口，见下面 apm-battery-low 的注释。
#
# BAT / CURR 两个 topic 名是固件代际差异（Copter 4.x 用 BAT，3.x 用 CURR，字段同名），
# 一律用 `BAT || CURR` + ref 候选组成对处理。

id: apm-battery-low
name: 电池最低电压
group: battery
order: 1

conditions:
    topics:
        - "BAT || CURR"

compute:
    - volts = ref("BAT.Volt", "CURR.Volt")
    - vmin = min(volts)
    - vmax = max(volts)
    # round(vmax / 4.2) 的分段实现 —— 引擎**没有标量加法算子**，做不了 x+0.5 再截断；
    # 而直接用 to_int 截断会把 6S（峰值约 24.5 V，24.5/4.2=5.83）估成 5S，
    # 阈值凭空低 3.3 V 从而漏报。所以按 .5 边界逐档判，覆盖 2S~12S。
    - r = div(vmax, 4.2)
    - >-
        cells = coalesce(value_if(gt(r, 11.5), 12.0), value_if(gt(r, 10.5), 11.0),
        value_if(gt(r, 9.5), 10.0), value_if(gt(r, 8.5), 9.0), value_if(gt(r, 7.5), 8.0),
        value_if(gt(r, 6.5), 7.0), value_if(gt(r, 5.5), 6.0), value_if(gt(r, 4.5), 5.0),
        value_if(gt(r, 3.5), 4.0), value_if(gt(r, 2.5), 3.0), value_if(gt(r, 1.5), 2.0))
    # 上游的 per-cell 阈值：LiPo 约 3.5 V/节告警、3.3 V/节临界
    - crit_v = scale(cells, 3.3)
    - low_v = scale(cells, 3.5)

outputs:
    tag: apm_battery_low_voltage

triggers:
    # vmax <= 70.0 是上游的量程合理性闸门（超过 70 V 多半是没有电池监控或量纲异常）
    - when: "vmin <= crit_v and vmax <= 70.0"
      severity: critical
      threshold: 3.3
      value: f"{vmin:.2f}"
      unit: V
      field: "BAT/CURR.Volt(最低)"
      title: "电池电压触及临界线，最低 {vmin:.2f} V"
      suggestion: "已到临界电压动作点（估算 {cells:.0f}S × 3.3 V = {crit_v:.2f} V）。应就地降落/回收，继续飞有空中断电风险。"
    - when: "vmin <= low_v and vmax <= 70.0"
      severity: warning
      threshold: 3.5
      value: f"{vmin:.2f}"
      unit: V
      field: "BAT/CURR.Volt(最低)"
      title: "电池电压触及低电压告警线，最低 {vmin:.2f} V"
      suggestion: "已到低电压告警点（估算 {cells:.0f}S × 3.5 V = {low_v:.2f} V）。缩短航时或更早返航，并核对电池健康度。"

---
# 负载压降：只在高电流（>=20 A）的样本里看电压跨度。
# 上游用 max-min；引擎没有标量减法算子，但 range_of 就是极差，等价。
id: apm-battery-sag
name: 电池负载压降
group: battery
order: 2

conditions:
    topics:
        - "BAT || CURR"

compute:
    - volts = ref("BAT.Volt", "CURR.Volt")
    - curr = ref("BAT.Curr", "CURR.Curr")
    - peak_curr = max(curr)
    # 只保留电流 >= 20 A 的时刻（greater 是严格大于，与该阈值差一个等号，无实质影响）
    - sag = range_of(apply_mask(volts, greater(curr, 20.0)))

outputs:
    tag: apm_battery_sag

triggers:
    - when: "sag >= 1.0"
      severity: info
      threshold: 1.0
      value: f"{sag:.2f}"
      unit: V
      field: "BAT/CURR.Volt(>=20A 段极差)"
      title: "大电流下压降 {sag:.2f} V（峰值电流 {peak_curr:.1f} A）"
      suggestion: "带载压降一部分是正常的，但跨度偏大通常意味着电池老化、内阻升高，值得关注。"

---
# 占位：真正的实现要算**相邻差分的最大跌幅**，并用"跌后 1 s 内是否恢复"来排除单帧噪声
# （上游 DROP_WARN_V=2.0 / DROP_CRIT_V=4.0 / DROP_MAX_DT_S=0.5）。
# 引擎当前既没有差分算子（diff），也没有持续时长/run-length 算子，前一条勉强能用
# abs_diff + greater 拼出来，后一条没有干净写法——与其给一个会误报的实现，不如留占位：
# precheck 是字符串字面量，构建期剥引号放行、运行期恒真，报告里会显示一条可见的 skipped。
id: apm-battery-sudden-drop
name: 电池电压突降（占位）
group: battery
order: 3

conditions:
    topics:
        - "BAT || CURR"
    precheck:
        - "'待补算子：需要相邻差分与跌后持续时长判据，引擎当前缺 diff 与 run-length 算子，暂未实现'"

compute:
    - volts = ref("BAT.Volt", "CURR.Volt")

outputs:
    tag: apm_battery_sudden_drop

triggers:
    - when: "False"
      severity: warning
      threshold: 2.0
      unit: V
      field: "BAT/CURR.Volt(相邻差分)"
      title: "电池电压突降（占位，未实现）"
      suggestion: "待补算子后实现：快速大幅跌落指向插头虚接、单节失效或瞬时掉电。"
