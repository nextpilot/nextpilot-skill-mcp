---
# MAG.Health 是每样本的 0/1 标志，不需要参数，本轮可实现。
# ratio_equal(values, value) = 取值为 value 的样本占比（分母是全部样本），正是要的量。
id: apm-sensor-compass-health
name: 罗盘健康标志
group: sensor_health
order: 3

conditions:
    topics:
        - MAG

compute:
    - health = ref("MAG.Health")
    - unhealthy_ratio = ratio_equal(health, 0.0)

outputs:
    tag: compass_unhealthy

triggers:
    - when: "unhealthy_ratio > 0.20"
      severity: warning
      threshold: 0.20
      value: f"{unhealthy_ratio:.2f}"
      unit: ""
      field: "MAG.Health(=0 的样本占比)"
      title: "罗盘不健康样本占比 {unhealthy_ratio:.0%}"
      suggestion: "健康罗盘的 Health 标志几乎恒为 1。占比这么高说明磁罗盘在失效或掉线，航向会受影响；查接线、供电与干扰，必要时换罗盘。"
