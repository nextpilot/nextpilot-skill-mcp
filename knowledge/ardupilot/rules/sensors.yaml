# ⚠️ 本文件下的 3 条尚未接线进构建产物（见 PENDING.md 第 1 条）。
#
# 传感器存在性与健康：上游 ardupilot-mcp 的 checks/sensors.py 做"配置与数据对不上"的
# 交叉检查——参数里声明了某传感器（*_TYPE > 0），日志里却一条它的消息都没有，
# 这通常是接线/端口/驱动探测的问题。三类：
#   · 测距仪：RNGFND_TYPE / RNGFND1_TYPE > 0，但日志里既无 RFND（新）也无 RNGFND（旧）→ WARN
#   · GPS：GPS_TYPE > 0，但日志里完全没有 GPS 消息 → WARN
#   · 罗盘健康：MAG 消息自带每样本的 Health 标志（1 健康 / 0 不健康），
#     不健康样本占比 > 20% 说明罗盘在失效或掉线 → WARN
#
# 前两条 100% 依赖参数（*_TYPE），provider 取不到参数（PENDING.md 的 C2），占位。
# 第三条只看 MAG.Health 这个数值字段，**能跑**，已实现。
# 上游这一组刻意保守（只报"配置与数据明显矛盾"的），本轮沿用。

id: apm-sensor-rangefinder
name: 测距仪配置但无数据（占位）
group: sensor_health
order: 1

conditions:
    precheck:
        - "'待补能力：RNGFND_TYPE / RNGFND1_TYPE 是参数，provider 取不到参数（PENDING 的 C2），暂未实现'"

compute:
    - placeholder = ref("PARM.Name")

outputs:
    tag: sensor_configured_but_silent

triggers:
    - when: "False"
      severity: warning
      threshold: 0
      unit: ""
      field: "RNGFND_TYPE(>0) 但无 RFND/RNGFND 消息"
      title: "测距仪已配置但日志无数据（占位，未实现）"
      suggestion: "待补能力后实现：声明了测距仪却一条数据都没有，通常是接线松动、插错口或驱动没探测到。"

