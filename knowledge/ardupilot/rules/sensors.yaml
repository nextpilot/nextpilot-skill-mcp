# 传感器存在性与健康：上游 ardupilot-mcp 的 checks/sensors.py 做"配置与数据对不上"的
# 交叉检查——参数里声明了某传感器（*_TYPE > 0），日志里却一条它的消息都没有，
# 这通常是接线/端口/驱动探测的问题。三类：
#   · 测距仪：RNGFND_TYPE / RNGFND1_TYPE > 0，但日志里既无 RFND（新）也无 RNGFND（旧）→ WARN
#   · GPS：GPS_TYPE > 0，但日志里完全没有 GPS 消息 → WARN
#   · 罗盘健康：MAG 消息自带每样本的 Health 标志（1 健康 / 0 不健康），
#     不健康样本占比 > 20% 说明罗盘在失效或掉线 → WARN
#
# 前两条读 `*_TYPE` 参数（`_cfg('NAME', 0.0)`：没这个参数按"没配该传感器"处理，
# 于是不会误报），再用 `has_topic()` 判消息在不在——这正是"配置与数据对不上"这个口径。
# 第三条只看 MAG.Health 这个数值字段。
# 上游这一组刻意保守（只报"配置与数据明显矛盾"的），本轮沿用。

# 来源：ardupilot-mcp（U5，PyPI 0.1.2）的 checks/sensors.py；官方文档链接见 facts.yaml 组级 doc（finding 的 docUrl 由它派生）。
# 与上游差异：判据照上游；「配置但无数据」实现为 _cfg 有值但消息缺失。
id: apm-sensor-rangefinder
name: 测距仪配置但无数据
group: sensor_health
order: 1
tag: apm_sensor_configured_but_silent

condition:
  message:
    - PARM

compute:
  - rng_type = _cfg("RNGFND_TYPE", 0.0)
  - rng1_type = _cfg("RNGFND1_TYPE", 0.0)

trigger:
  - when: "(rng_type > 0 or rng1_type > 0) and not has_topic('RFND') and not has_topic('RNGFND')"
    severity: warning
    suggestion: "参数声明了测距仪（RNGFND_TYPE/RNGFND1_TYPE > 0）却一条数据都没有：通常是接线松动、插错串口，或驱动没探测到设备。先确认日志里有 RFND（新）/ RNGFND（旧）消息。"
    description: 测距仪已配置但日志无数据
    evidence:
      source: RNGFND_TYPE(>0) 但无 RFND/RNGFND 消息
      threshold: 0
      unit: ""

---
id: apm-sensor-gps
name: GPS 配置但无数据
group: sensor_health
order: 2
tag: apm_sensor_configured_but_silent

condition:
  message:
    - PARM

compute:
  - gps_type = _cfg("GPS_TYPE", 0.0)

trigger:
  - when: "gps_type > 0 and not has_topic('GPS')"
    severity: warning
    suggestion: "参数声明了 GPS 接收机（GPS_TYPE > 0）却完全没有 GPS 消息：查接线、串口与驱动探测；没有 GPS 就无法定位与返航。"
    description: GPS 已配置但日志无数据
    evidence:
      source: GPS_TYPE(>0) 但无 GPS 消息
      threshold: 0
      unit: ""

---
# MAG.Health 是每样本的 0/1 标志，不需要参数，本轮可实现。
# np.mean(health == 0.0)：值为 0 的样本占比，即"不健康"占比。

id: apm-sensor-compass-health
name: 罗盘健康标志
group: sensor_health
order: 3
tag: apm_compass_unhealthy

condition:
  message:
    - MAG

compute:
  - unhealthy_ratio = np.mean(MAG.Health == 0.0)

trigger:
  - when: "unhealthy_ratio > 0.20"
    severity: warning
    suggestion: "健康罗盘的 Health 标志几乎恒为 1。占比这么高说明磁罗盘在失效或掉线，航向会受影响；查接线、供电与干扰，必要时换罗盘。"
    description: 罗盘不健康样本占比 {unhealthy_ratio:.0%}
    evidence:
      source: MAG.Health(=0 的样本占比)
      value: f"{unhealthy_ratio:.2f}"
      threshold: 0.2
      unit: ""
