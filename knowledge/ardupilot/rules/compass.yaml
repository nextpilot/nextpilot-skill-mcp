# ⚠️ 本条尚未接线进构建产物（见 PENDING.md 第 1 条）。
#
# 罗盘（MAG）：磁场强度稳定性。上游 ardupilot-mcp 的 checks/compass.py。
# 思路：健康磁罗盘测到的**总场强**基本恒定（地球磁场占主导），与油门/航向无关。
# 当电机走线或电流串进罗盘，场强就会随油门摆动——这就是典型的罗盘干扰，会污染 EKF
# 航向估计（马桶圈/飞丢）。
#
# 量化方式：mag = sqrt(MagX²+MagY²+MagZ²) 的变异系数 CV（std/mean）与极差比
# (max-min)/mean。上游两条判据各有一档阈值：CV 0.30 警告 / 0.60 严重，极差比 0.60 警告。
#
# **本轮只迁了极差比那一条**：引擎没有 std / cv 算子（见 PENDING.md 的算子缺口），
# CV 算不出来，于是 0.60 那档 critical 也无从触发——本条**只会出 warning**。
# 没有为了凑出 critical 档去编一个"极差比 > 1.2"之类的阈值：那不是上游的数。
# 等补了 std 算子，把 CV 那条补回来（阈值现成，就在上面）。
# 另：上游还检查 COMPASS_OFS_* 硬铁偏移，那个依赖参数，本仓库取不到参数（C2），不迁。

id: apm-compass-interference
name: 罗盘场强稳定性
group: compass
order: 1

conditions:
    topics:
        - MAG

compute:
    - mx = ref("MAG.MagX")
    - my = ref("MAG.MagY")
    - mz = ref("MAG.MagZ")
    - mag = hypot(hypot(mx, my), mz)
    - mean_mag = mean(mag)
    # 极差比：(max-min)/mean。mean<=0（全零/无场）时 div 返回 None，本条自然不出结论
    - range_ratio = div(range_of(mag), mean_mag)
    # 上游的 MIN_SAMPLES=10（样本太少统计量没意义）。**必须在这里算**——trigger 的
    # when 走 _eval_expr 白名单，只允许 has_topic('...') 这类调用，调不了算子。
    - n_mag = length_of(mag)

outputs:
    tag: compass_interference

triggers:
    # n_mag >= 10 对应上游的 MIN_SAMPLES：样本太少统计量没有意义
    - when: "range_ratio > 0.60 and n_mag >= 10"
      severity: warning
      threshold: 0.60
      value: f"{range_ratio:.2f}"
      unit: ""
      field: "MAG.MagX/Y/Z 合成场强(极差/均值)"
      title: "罗盘场强摆动偏大，极差比 {range_ratio:.2f}（均值 {mean_mag:.0f} mGauss）"
      suggestion: "场强随油门摆动通常意味着电机/电流干扰串进了罗盘。检查罗盘与供电线走线的距离，做 COMPASS_MOT 补偿，或改用外置罗盘。"
