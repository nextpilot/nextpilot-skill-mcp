# 罗盘（MAG）：磁场强度稳定性。上游 ardupilot-mcp 的 checks/compass.py。
# 思路：健康磁罗盘测到的**总场强**基本恒定（地球磁场占主导），与油门/航向无关。
# 当电机走线或电流串进罗盘，场强就会随油门摆动——这就是典型的罗盘干扰，会污染 EKF
# 航向估计（马桶圈/飞丢）。
#
# 量化方式：mag = sqrt(MagX²+MagY²+MagZ²) 的变异系数 CV（std/mean）与极差比
# (max-min)/mean。上游两条判据各有一档阈值：CV 0.30 警告 / 0.60 严重，极差比 0.60 警告。
#
# 上游**两条判据各有一档**：CV > 0.60 直接 critical，否则 CV > 0.30 或极差比 > 0.60 为 warning；
# 两条都不过线才不出结论。2026-09 补上 std / cv 算子后 critical 那档才落地——
# 在那之前本条只会出 warning，且没有为了凑出 critical 去编一个"极差比 > 1.2"之类的阈值。
# 另：上游还检查 COMPASS_OFS_* 硬铁偏移，那个依赖参数。当初因为读不到参数（C2）没迁，
# 2026-09 有 param() 之后障碍只剩"要算三轴偏移的模长"——还没做，不是不能做。

id: apm-compass-interference
name: 罗盘场强稳定性
group: compass
order: 1

conditions:
    topics:
        - MAG

compute:
    - mx = ref("MAG.MagX")
    - my = ref("MAG.MagY")
    - mz = ref("MAG.MagZ")
    - mag = hypot(hypot(mx, my), mz)
    - mean_mag = mean(mag)
    # 变异系数 std/mean（上游的核心判据）。变量名不取 cv，免得把同名算子遮蔽掉
    - cv_mag = cv(mag)
    # 极差比：(max-min)/mean。mean<=0（全零/无场）时 div 返回 None，本条自然不出结论
    - range_ratio = div(range_of(mag), mean_mag)
    # 上游的 MIN_SAMPLES=10（样本太少统计量没意义）。**必须在这里算**——trigger 的
    # when 走 _eval_expr 白名单，只允许 has_topic('...') 这类调用，调不了算子。
    - n_mag = length_of(mag)

outputs:
    tag: apm_compass_interference

triggers:
    # 上游：CV > 0.60 是"场强极不稳定"，直接 critical
    - when: "cv_mag > 0.60 and n_mag >= 10"
      severity: critical
      threshold: 0.60
      value: f"{cv_mag:.2f}"
      unit: ""
      field: "MAG.MagX/Y/Z 合成场强(变异系数)"
      title: "罗盘场强极不稳定，变异系数 {cv_mag:.2f}（{mean_mag:.0f} mGauss 均值上摆动）"
      suggestion: "场强波动这么大，几乎必然是电机/电流干扰耦合进了罗盘，会污染 EKF 航向估计（马桶圈、飞丢）。把罗盘挪开供电线与电调、重新校准，开启 COMPASS_MOT 电流补偿，或改用外置罗盘。"
    # 上游：CV > 0.30 或极差比 > 0.60，任一过线即 warning
    - when: "(cv_mag > 0.30 or range_ratio > 0.60) and n_mag >= 10"
      severity: warning
      threshold: 0.30
      value: f"{cv_mag:.2f}"
      unit: ""
      field: "MAG.MagX/Y/Z 合成场强(变异系数 / 极差比)"
      title: "罗盘场强摆动偏大，变异系数 {cv_mag:.2f}、极差比 {range_ratio:.2f}（均值 {mean_mag:.0f} mGauss）"
      suggestion: "场强随油门摆动通常意味着电机/电流干扰串进了罗盘。检查罗盘与供电线走线的距离，做 COMPASS_MOT 补偿，或改用外置罗盘。"
