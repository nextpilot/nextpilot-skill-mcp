# ⚠️ 本文件下的 3 条都是占位，尚未接线进构建产物（见 PENDING.md 第 1 条）。
#
# 配置安全（参数快照）：上游 ardupilot-mcp 的 checks/config.py 看三个参数——
#   ARMING_CHECK == 0  禁用**全部**预解锁检查（坏传感器/未校准/无 GPS 都挡不住解锁）→ WARN
#   BATT_MONITOR == 0  根本没有电池监控（无电压电流采样，也就没有低电压失效保护）→ INFO
#   FS_THR_ENABLE == 0 禁用油门失效保护（Copter/Heli；Plane 用的是 THR_FAILSAFE）→ INFO
# 注意是**精确等于 0** 才报：非零值（包括 -9 这类负位掩码）表示检查是开着的，不能报。
#
# **为什么全是占位**：这三条 100% 依赖参数，而本仓库的 APM provider 取不到任何参数
# （PENDING.md 的 C2 —— provider 契约里的 BUILTIN_VARIABLES 没有任何参数类变量，
# 参数也不在规则能引用的内置变量里）。上游读的是 log.params（DataFlash 里的 PARM 快照），
# 本仓库那份数据在 PARM 消息的 **Name/Value 文本列**里，而 provider 的 get_series()
# 会把文本列的 float 转换失败吞成 None（C1）。两个约束叠在一起，本轮无解。
#
# 计划里写的是 5 条，实际上游只有 3 项参数检查，按实际写——不为了凑数编两个参数进去。
# 将来 provider 支持参数后，这三条的阈值与文案都是现成的，直接照抄上游即可。

id: apm-config-arming-check
name: 预解锁检查被禁用（占位）
group: config_safety
order: 1

conditions:
    precheck:
        - "'待补能力：ARMING_CHECK 是参数，provider 取不到参数（PENDING 的 C2），暂未实现'"

compute:
    - placeholder = ref("PARM.Name")

outputs:
    tag: apm_config_arming_check_disabled

triggers:
    - when: "False"
      severity: warning
      threshold: 0
      unit: ""
      field: "ARMING_CHECK(=0)"
      title: "预解锁检查被整体禁用（占位，未实现）"
      suggestion: "待补能力后实现：ARMING_CHECK=0 会关掉所有预解锁检查，坏传感器与未校准都不再阻止解锁。"

