# 配置安全（参数快照）：上游 ardupilot-mcp 的 checks/config.py 看三个参数——
#   ARMING_CHECK == 0  禁用**全部**预解锁检查（坏传感器/未校准/无 GPS 都挡不住解锁）→ WARN
#   BATT_MONITOR == 0  根本没有电池监控（无电压电流采样，也就没有低电压失效保护）→ INFO
#   FS_THR_ENABLE == 0 禁用油门失效保护（Copter/Heli；Plane 用的是 THR_FAILSAFE）→ INFO
# 注意是**精确等于 0** 才报：非零值（包括 -9 这类负位掩码）表示检查是开着的，不能报。
#
# 参数怎么读：provider 把 PARM 消息的最后一次值放进内置变量 CFG，规则里全大写裸名
# 自动走 `_cfg()` 取单个值。**参数缺失返回 None**，于是 `x == 0` 不成立 → 不发射，
# 这正是"没有这条参数就不该下结论"要的效果。
#
# `conditions.topics: [PARM]` 是有意的：日志没录参数表时，这三条要在报告里显示成
# **skipped（缺 PARM）**，而不是"跑了、没发现问题"——后者会让读者以为检查过了。

# 与上游差异：判据照上游；原实现 100% 卡在读不到参数，加 PARAMS 变量 + _cfg() 后转真。
# 来源：ardupilot-mcp（U5，PyPI 0.1.2）的 checks/config.py；官方文档链接见 facts.yaml 组级 doc（finding 的 docUrl 由它派生）。
id: apm-config-arming-check
name: 预解锁检查被禁用
group: config_safety
order: 1
tag: apm_config_arming_check_disabled

condition:
  message:
    - PARM

compute:
  - arming_check = ARMING_CHECK

trigger:
  - when: "arming_check == 0"
    severity: warning
    suggestion: "ARMING_CHECK=0 会关掉所有预解锁检查：坏传感器、未校准、无 GPS 都不再阻止解锁，地面看一切正常、起飞后才暴露。除非在台架上调试，否则把该开的位重新打开。"
    description: 预解锁检查被整体禁用（ARMING_CHECK=0）
    evidence:
      source: ARMING_CHECK(=0)
      value: arming_check
      threshold: 0
      unit: ""

---
id: apm-config-batt-monitor
name: 未配置电池监控
group: config_safety
order: 2
tag: apm_config_no_battery_monitor

condition:
  message:
    - PARM

compute:
  - batt_monitor = BATT_MONITOR

trigger:
  - when: "batt_monitor == 0"
    severity: info
    suggestion: "BATT_MONITOR=0 意味着没有电压电流采样：低电压/低电量失效保护无从谈起，报告里的电量曲线也是空的。接上电流计或启用模拟电压采样后再飞。"
    description: 未配置电池监控（BATT_MONITOR=0）
    evidence:
      source: BATT_MONITOR(=0)
      value: batt_monitor
      threshold: 0
      unit: ""

---
# FS_THR_ENABLE 是 Copter/Heli 的参数，Plane 对应的是 THR_FAILSAFE。
# 这里**不加 vehicle 约束**：上游没加，而本仓库的 FRAME_CLASS→机型映射与上游有冲突
# （PENDING.md 的 C3），加了反而可能把该跑的日志 skip 掉。机型归属写在文案里说明。

id: apm-config-fs-thr
name: 油门失效保护被禁用
group: config_safety
order: 3
tag: apm_config_thr_failsafe_disabled

condition:
  message:
    - PARM

compute:
  - fs_thr_enable = FS_THR_ENABLE

trigger:
  - when: "fs_thr_enable == 0"
    severity: info
    suggestion: "FS_THR_ENABLE=0（Copter/Heli；Plane 对应 THR_FAILSAFE）会让飞控在遥控失联时不动作——不返航、不降落，直到电量耗尽。设成 1（RTL）或 2（降落）再飞。"
    description: 油门失效保护被禁用（FS_THR_ENABLE=0）
    evidence:
      source: FS_THR_ENABLE(=0)
      value: fs_thr_enable
      threshold: 0
      unit: ""
