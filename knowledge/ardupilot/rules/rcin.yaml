# 遥控输入（RCIN）：上游 ardupilot-mcp 的 checks/rcin.py。
# 最清晰的失效特征是**丢链路**：接收机掉线或把所有通道同时保持在异常低值（~900-1000 us）。
# 正常飞行时各杆量是独立的——横滚/俯仰/航向在中位（~1500）附近，只有油门偏低——
# 所以"四个主通道同时偏低"在正常飞行中不会发生，出现即意味着链路出了问题。
# （这正是经典的"RC 卡在 990us、失效保护没触发"的坠机现场。）
#
# 判据实现：四个主通道同时 < 1000 us（-x > -1000 等价于 x < 1000），
# 再用 excursion_events 判持续时长（>=2s 或到日志末尾 → critical，否则 warning）。

id: apm-rcin-link-loss
name: 遥控输入链路
group: rc_input
order: 1
tag: apm_rc_link_loss

condition:
  message:
    - RCIN

compute:
  - low1 = -RCIN.C1 > -1000
  - low2 = -RCIN.C2 > -1000
  - low3 = -RCIN.C3 > -1000
  - low4 = -RCIN.C4 > -1000
  - all_low = low1 & low2 & low3 & low4
  - lost_samples = sum(all_low)
  - ts = RCIN.timestamp
  - runs = excursion_events(all_low, ts, T0_US, min_duration_s=1.0)

foreach: { var: runs, keys: [ duration_s, start_s, end_s ] }

trigger:
  - when: "duration_s >= 2.0 or end_s >= DURATION_S - 1.0"
    severity: critical
    suggestion: "四个主通道持续低于 1000us 达 {duration_s:.1f}s，说明遥控链路确实断开且未恢复。检查接收机供电、天线接触、失效保护设置（FS_THR_ENABLE）。"
    description: 四个主通道持续低于 1000us，持续 {duration_s:.1f}s（t={start_s:.1f}s 起）
    evidence:
      source: RCIN.C1..C4(持续低于 1000us)
      value: f"{duration_s:.1f}s"
      threshold: 1000
      unit: us
  - when: "True"
    severity: warning
    suggestion: "正常飞行中四杆不会同时处于低位，这通常意味着遥控链路掉线或接收机保持失效值。"
    description: 四个主通道同时低于 1000us，持续 {duration_s:.1f}s（t={start_s:.1f}s 起，共 {lost_samples} 个样本）
    evidence:
      source: RCIN.C1..C4(同时低于 1000us 的样本数)
      value: f"{lost_samples}样本/{duration_s:.1f}s"
      threshold: 1000
      unit: us
