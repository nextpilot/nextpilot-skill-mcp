# 遥控输入（RCIN）：上游 ardupilot-mcp 的 checks/rcin.py。
# 最清晰的失效特征是**丢链路**：接收机掉线或把所有通道同时保持在异常低值（~900-1000 us）。
# 正常飞行时各杆量是独立的——横滚/俯仰/航向在中位（~1500）附近，只有油门偏低——
# 所以"四个主通道同时偏低"在正常飞行中不会发生，出现即意味着链路出了问题。
# （这正是经典的"RC 卡在 990us、失效保护没触发"的坠机现场。）
#
# 判据实现：四个主通道同时 < 1000 us（-x > -1000 等价于 x < 1000）。
#
# **降级**：上游的 severity 判据是"持续到日志末尾"或"持续 >= 2s"→ critical，否则 warning。
# 两档都要持续时长，引擎缺 run-length 算子，所以本轮**只出 warning**，并且
# 没有编一个占比阈值去近似。证据给的是"命中的样本数"，读者可自行判断严重程度。

id: apm-rcin-link-loss
name: 遥控输入链路
group: rc_input
order: 1

conditions:
  message:
    - RCIN

compute:
  - low1 = -RCIN.C1 > -1000
  - low2 = -RCIN.C2 > -1000
  - low3 = -RCIN.C3 > -1000
  - low4 = -RCIN.C4 > -1000
  - all_low = low1 & low2 & low3 & low4
  - lost_samples = sum(all_low)

triggers:
  - when: "lost_samples > 0"
    severity: warning
    suggestion: "正常飞行中四杆不会同时处于低位，这通常意味着遥控链路掉线或接收机保持失效值。本条未判持续时长（缺算子）——若同时出现失控、RTL 或坠机，应按 RC 失联处理，并检查接收机供电、天线与失效保护设置。"
    description: 四个主通道曾同时低于 1000us，共 {lost_samples} 个样本
    evidence:
      source: RCIN.C1..C4(同时低于 1000us 的样本数)
      value: lost_samples
      threshold: 1000
      unit: 样本
tag: apm_rc_link_loss
