# ⚠️ 本条尚未接线进构建产物（见 PENDING.md 第 1 条）。
#
# 遥控输入（RCIN）：上游 ardupilot-mcp 的 checks/rcin.py。
# 最清晰的失效特征是**丢链路**：接收机掉线或把所有通道同时保持在异常低值（~900-1000 us）。
# 正常飞行时各杆量是独立的——横滚/俯仰/航向在中位（~1500）附近，只有油门偏低——
# 所以"四个主通道同时偏低"在正常飞行中不会发生，出现即意味着链路出了问题。
# （这正是经典的"RC 卡在 990us、失效保护没触发"的坠机现场。）
#
# 判据实现：四个主通道同时 < 1000 us。
#   greater 只支持"逐样本 a > b"，所以判 c < 1000 写成 greater(-c, -1000)
#   （scale_series 取负）。没有取反/取模算子，这是唯一干净的写法。
#
# **降级**：上游的 severity 判据是"持续到日志末尾"或"持续 >= 2s"→ critical，否则 warning。
# 两档都要持续时长，引擎缺 run-length 算子，所以本轮**只出 warning**，并且
# 没有编一个占比阈值去近似。证据给的是"命中的样本数"，读者可自行判断严重程度。

id: apm-rcin-link-loss
name: 遥控输入链路
group: rc_input
order: 1

conditions:
    topics:
        - RCIN

compute:
    - c1 = ref("RCIN.C1")
    - c2 = ref("RCIN.C2")
    - c3 = ref("RCIN.C3")
    - c4 = ref("RCIN.C4")
    # 各通道 < 1000 us 的掩码（greater 只认 a > b，故取负后比较）
    - low1 = greater(scale_series(c1, -1.0), -1000.0)
    - low2 = greater(scale_series(c2, -1.0), -1000.0)
    - low3 = greater(scale_series(c3, -1.0), -1000.0)
    - low4 = greater(scale_series(c4, -1.0), -1000.0)
    - all_low = mask_and(mask_and(low1, low2), mask_and(low3, low4))
    - lost_samples = count_true(all_low)

outputs:
    tag: rc_link_loss

triggers:
    - when: "lost_samples > 0"
      severity: warning
      threshold: 1000.0
      value: lost_samples
      unit: 样本
      field: "RCIN.C1..C4(同时低于 1000us 的样本数)"
      title: "四个主通道曾同时低于 1000us，共 {lost_samples} 个样本"
      suggestion: "正常飞行中四杆不会同时处于低位，这通常意味着遥控链路掉线或接收机保持失效值。本条未判持续时长（缺算子）——若同时出现失控、RTL 或坠机，应按 RC 失联处理，并检查接收机供电、天线与失效保护设置。"
