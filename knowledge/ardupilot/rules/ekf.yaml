id: apm-ekf-position
name: EKF 位置检验比
group: ekf_variance
order: 2

conditions:
    topics:
        - "XKF4 || NKF4"

compute:
    - sp_max = max(ref("XKF4.SP", "NKF4.SP"))

outputs:
    tag: apm_ekf_variance_high

triggers:
    - when: "sp_max > 1.0"
      severity: critical
      threshold: 1.0
      value: f"{sp_max:.2f}"
      unit: ""
      field: "XKF4/NKF4.SP(峰值)"
      title: "EKF 位置检验比超拒绝线，峰值 {sp_max:.2f}"
      suggestion: "超过 1.0 说明 EKF 在拒绝位置数据，是定点漂移的直接前兆。优先查 GPS（搜星/HDOP/跳变）。"
    - when: "sp_max > 0.8"
      severity: warning
      threshold: 0.8
      value: f"{sp_max:.2f}"
      unit: ""
      field: "XKF4/NKF4.SP(峰值)"
      title: "EKF 位置检验比偏高，峰值 {sp_max:.2f}"
      suggestion: "逼近 1.0 的拒绝边界。若复现需检查 GPS 与罗盘。"

