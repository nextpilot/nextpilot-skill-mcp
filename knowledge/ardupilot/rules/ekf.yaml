id: apm-ekf-magnetometer
name: EKF 磁罗盘检验比
group: ekf_variance
order: 4

conditions:
    topics:
        - "XKF4 || NKF4"

compute:
    - sm_max = max(ref("XKF4.SM", "NKF4.SM"))

outputs:
    tag: apm_ekf_variance_high

triggers:
    - when: "sm_max > 1.0"
      severity: critical
      threshold: 1.0
      value: f"{sm_max:.2f}"
      unit: ""
      field: "XKF4/NKF4.SM(峰值)"
      title: "EKF 磁罗盘检验比超拒绝线，峰值 {sm_max:.2f}"
      suggestion: "超过 1.0 说明 EKF 在拒绝磁罗盘数据，航向会漂。查罗盘干扰（供电线走线、GPS/罗盘支架高度）与校准。"
    - when: "sm_max > 0.8"
      severity: warning
      threshold: 0.8
      value: f"{sm_max:.2f}"
      unit: ""
      field: "XKF4/NKF4.SM(峰值)"
      title: "EKF 磁罗盘检验比偏高，峰值 {sm_max:.2f}"
      suggestion: "逼近 1.0 的拒绝边界。若复现需重新校准罗盘并检查干扰源。"
