# 振动（VIBE）：三轴振动幅值 + 三个加速度计的削波累计计数。
# 阈值 [来源] ArduPilot 官方振动测量页：持续 <30 m/s^2 一般可接受，30~60 可能出问题，
# >60 几乎必然劣化定高/定点；削波理想为 0，少量（<100）可能无碍（硬着陆附近常见），
# 但持续上升说明 IMU 饱和。
# https://ardupilot.org/copter/docs/common-measuring-vibration.html
# 上游实现：ardupilot-mcp 的 checks/vibration.py（WARN_MS2=30 / CRIT_MS2=60 /
# SUSTAINED_FRACTION=0.10 / clip>=100 转 critical）。
#
# 为什么拆成 6 条而不是 1 条带 6 个 trigger：引擎的 triggers 是**自上而下第一条命中
# 即中止**，一条规则最多出一条 finding。上游"每轴一条 finding"的语义只能靠拆规则复现。
#
# 为什么不写 outputs.stats：三轴峰值与三个削波数都由 facts.yaml 的 metrics 就地现算
# （同一口径、同一处维护），规则再产一份只会让"同一个数字两处算"将来分叉。

id: apm-vibration-x
name: X 轴振动
group: vibration
order: 1

conditions:
    topics:
        - VIBE

compute:
    - vx = ref("VIBE.VibeX")
    - vx_max = max(vx)
    # 超阈值的样本占比：上游用 10% 把"偶尔冒尖"和"持续超标"分开
    - frac_warn = div(count_above(vx, gt=30.0), length_of(vx))
    - frac_crit = div(count_above(vx, gt=60.0), length_of(vx))

outputs:
    tag: apm_high_vibration

triggers:
    - when: "vx_max > 60.0 or frac_crit > 0.0"
      severity: critical
      threshold: 60.0
      value: f"{vx_max:.1f}"
      unit: m/s^2
      field: "VIBE.VibeX(峰值)"
      title: "X 轴振动严重超标，峰值 {vx_max:.0f} m/s^2"
      suggestion: "超过 60 m/s^2 会让加速度计数据失真并可能触发 EKF 失效。改善飞控减震与桨/电机动平衡后再飞。"
    - when: "frac_warn >= 0.10"
      severity: warning
      threshold: 30.0
      value: f"{vx_max:.1f}"
      unit: m/s^2
      field: "VIBE.VibeX(峰值)"
      title: "X 轴振动持续偏大，峰值 {vx_max:.0f} m/s^2"
      suggestion: "全程有 10% 以上样本超过 30 m/s^2。检查安装与动平衡，考虑启用谐波陷波滤波器。"
    - when: "vx_max > 30.0"
      severity: info
      threshold: 30.0
      value: f"{vx_max:.1f}"
      unit: m/s^2
      field: "VIBE.VibeX(峰值)"
      title: "X 轴振动偶有冒尖，峰值 {vx_max:.0f} m/s^2"
      suggestion: "仅个别时刻超过 30 m/s^2，整体可接受；若伴随定位漂移再排查。"

