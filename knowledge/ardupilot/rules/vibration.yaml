---
# 削波：Clip0/1/2 是**单调递增的累计计数器**，所以总次数 = 末值 - 初值 = np.ptp。
# 任何非零都值得报（上游 warns on any clipping），>=100 升 critical。

id: apm-clip-0
name: 加速度计削波（IMU0）
group: vibration
order: 4
tag: apm_accel_clipping

condition:
  message:
    - VIBE

compute:
  - clip0_total = np.ptp(VIBE.Clip0)

trigger:
  - when: "clip0_total >= 100.0"
    severity: critical
    suggestion: "削波期间该 IMU 数据完全不可用。必须从源头降振动：桨动平衡、飞控软安装、检查机架共振。"
    description: IMU0 削波 {clip0_total:.0f} 次
    evidence:
      source: VIBE.Clip0(累计)
      value: f"{clip0_total:.0f}"
      threshold: 100
      unit: 次
  - when: "clip0_total > 0.0"
    severity: warning
    suggestion: "少量削波在硬着陆附近常见；若计数持续上升则说明 IMU 在饱和，需降振动。"
    description: IMU0 削波 {clip0_total:.0f} 次
    evidence:
      source: VIBE.Clip0(累计)
      value: f"{clip0_total:.0f}"
      threshold: 0
      unit: 次

