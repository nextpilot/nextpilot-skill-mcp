# ─────────────────────────────────────────────────────────────────────────────
# FRAME_CLASS（Copter，核过 apm.pdef.xml）。name 后面的数是升力电机数，
# null = 不是简单多旋翼（直升机类）。
frame_classes:
    {
        1: { name: Quad, lift_motors: 4 },
        2: { name: Hexa, lift_motors: 6 },
        3: { name: Octo, lift_motors: 8 },
        4: { name: OctoQuad, lift_motors: 8 },
        5: { name: Y6, lift_motors: 6 },
        6: { name: Heli, lift_motors: null },
        7: { name: Tri, lift_motors: 3 },
        8: { name: Single, lift_motors: 1 },
        9: { name: Coax, lift_motors: 2 },
        10: { name: BiCopter, lift_motors: 2 },
        11: { name: Heli_Dual, lift_motors: null },
        12: { name: DodecaHexa, lift_motors: 12 },
        13: { name: HeliQuad, lift_motors: null },
        14: { name: Deca, lift_motors: 10 },
    }

# 传统直升机（单/双/四旋翼直升机）。上游审计修正过：14=Deca 是**多旋翼**不是直升机，
# 早期版本把 14 也算进来是错的。
heli_frame_classes: [6, 11, 13]

# FRAME_TYPE：机架几何布局。
frame_types:
    {
        0: Plus,
        1: X,
        2: V,
        3: H,
        4: V-Tail,
        5: A-Tail,
        10: Y6B,
        11: Y6F,
        12: BetaFlightX,
        13: DJIX,
        14: ClockwiseX,
        15: I,
        18: BetaFlightXReversed,
        19: Y4,
    }

# 固件横幅前缀 → 规范车型名。覆盖新式（"ArduCopter V4.5.7"）与老式（"APM:Copter V3.4.3"）。
# 本轮仅作文档，provider 不读它。
vehicle_prefix_map:
    {
        ArduCopter: ArduCopter,
        "APM:Copter": ArduCopter,
        ArduPlane: ArduPlane,
        "APM:Plane": ArduPlane,
        ArduRover: Rover,
        "APM:Rover": Rover,
        Rover: Rover,
        ArduSub: ArduSub,
        "APM:Sub": ArduSub,
        Blimp: Blimp,
        AntennaTracker: AntennaTracker,
        "APM:Tracker": AntennaTracker,
    }

# ─────────────────────────────────────────────────────────────────────────────
# 消息 → 字段 → 单位。**本表是人工维护的**，上游没有集中映射——它的 parser 把
# FMTU/UNIT/MULT 直接丢了，单位只散落在各 check 的 docstring 里。
#
# 用途边界（重要）：当前**不参与运行期换算**。
#   · 引擎的单位换算走 _ref(..., unit=)，源单位从 meta/<tag>.json 查；
#     APM 侧没有 meta/ 目录，所以规则里**不要写 unit=**（查不到只会告警，不换算）。
#   · 展示用的单位由规则自己在 triggers[].unit 里写死，照抄本表即可。
# 等 APM 也有 meta/ 之后，本表应迁过去并启用 unit=。见 PENDING.md。
field_units:
    VIBE: { VibeX: m/s^2, VibeY: m/s^2, VibeZ: m/s^2, Clip0: 次, Clip1: 次, Clip2: 次 }
    MAG: { MagX: mGauss, MagY: mGauss, MagZ: mGauss, Health: 0/1 }
    ATT:
        { DesRoll: deg, Roll: deg, DesPitch: deg, Pitch: deg, DesYaw: deg, Yaw: deg, ErrRP: deg, ErrYaw: deg }
    BAT: { Volt: V, Curr: A, CurrTot: mAh, EnrgTot: Wh, Temp: degC, Res: ohm }
    CURR: { Volt: V, Curr: A, CurrTot: mAh }
    GPS: { Status: 枚举, NSats: 颗, HDop: "" }
    RCOU: { C1: us, C2: us, C3: us, C4: us, C5: us, C6: us, C7: us, C8: us }
    RCIN: { C1: us, C2: us, C3: us, C4: us }
    PM: { NLon: 次, NLoop: 次, MaxT: us }
    # 归一化检验比，无量纲；1.0 是传感器拒绝边界
    XKF4: { SV: "", SP: "", SH: "", SM: "" }
    NKF4: { SV: "", SP: "", SH: "", SM: "" }
    ERR: { Subsys: 枚举, ECode: 枚举 }
    EV: { Id: 枚举 }

# ─────────────────────────────────────────────────────────────────────────────
# 官方文档链接（上游 ardupilot_docs.py 的 DOC_URLS，20 条，URL 逐个核过 ardupilot.org）。
# rule_meta.by_group.doc 的取值必须来自这里（引擎的 docUrl 是单值，只取最具体的一条）。
# 两处要一起改——当前没有自动校验，记在 PENDING.md。
doc_urls:
    log_diagnosis_general: "https://ardupilot.org/copter/docs/common-diagnosing-problems-using-logs.html"
    vibration: "https://ardupilot.org/copter/docs/common-measuring-vibration.html"
    vibration_damping: "https://ardupilot.org/copter/docs/common-vibration-damping.html"
    ekf_failsafe: "https://ardupilot.org/copter/docs/ekf-inav-failsafe.html"
    ekf_overview: "https://ardupilot.org/copter/docs/common-apm-navigation-extended-kalman-filter-overview.html"
    gps_failsafe: "https://ardupilot.org/copter/docs/gps-failsafe-glitch-protection.html"
    compass_calibration: "https://ardupilot.org/copter/docs/common-compass-calibration-in-mission-planner.html"
    compass_interference: "https://ardupilot.org/copter/docs/common-compass-setup-advanced.html"
    battery_failsafe: "https://ardupilot.org/copter/docs/failsafe-battery.html"
    power_monitor: "https://ardupilot.org/copter/docs/common-powermodule-landingpage.html"
    radio_failsafe: "https://ardupilot.org/copter/docs/radio-failsafe.html"
    tuning: "https://ardupilot.org/copter/docs/common-tuning.html"
    tuning_process: "https://ardupilot.org/copter/docs/tuning-process-instructions.html"
    autotune: "https://ardupilot.org/copter/docs/autotune.html"
    harmonic_notch: "https://ardupilot.org/copter/docs/common-imu-notch-filtering.html"
    prearm_checks: "https://ardupilot.org/copter/docs/common-prearm-safety-checks.html"
    esc_calibration: "https://ardupilot.org/copter/docs/esc-calibration.html"
    thrust_loss: "https://ardupilot.org/copter/docs/thrust_loss_yaw_imbalance.html"
    motor_order: "https://ardupilot.org/copter/docs/connect-escs-and-motors.html"
    parameters_reference: "https://ardupilot.org/copter/docs/parameters.html"

# ─────────────────────────────────────────────────────────────────────────────
# 概览指标。两种写法，与 px4/facts.yaml 的约定一致：
#   · 带 topic/field/op —— 规则没产出时就地现算（兜底）。op 必须是已注册算子。
#   · 只写 key/label/unit —— 只占展示位，取数交给规则；规则没跑这一项就不显示。
#
# APM 日志现在的"关键数据"区是全空的，这张表能让它至少有数。
#
# 三个坑，写新条目时照着避开：
#   1. field: [a, b, c] 的语义是**候选字段名取第一个存在的**（给同一字段在不同固件里
#      换过名的情况用），不是"多列一起算"。多列归约必须走规则：规则里能用
#      larger() 逐样本取大、再 max() 收成标量，metrics 这条路径做不到。
#   2. 没有跨 topic 的兜底机制（不会 BAT 取不到就自动去 CURR 拿）。所以老固件
#      兼容只能靠"两条不同 key 并列"，label 必须写清来源，否则概览区出现两个
#      同名"最低电压"反而误导。
#   3. 没有标量加法算子，跨 IMU 求和（Clip0+1+2）做不了 → 三个 IMU 各报一条，不汇总。
#      同理三轴振动也各报一条：振动问题本来就要看是哪一轴冒尖，一个"最大振动"汇总
#      反而把信息压没了。
metrics:
    # ── 就地现算：单列可算的都放这里 ──
    - { key: vibrationMaxX, label: 最大振动(X), unit: m/s^2, topic: VIBE, field: VibeX, op: max, round: 2 }
    - { key: vibrationMaxY, label: 最大振动(Y), unit: m/s^2, topic: VIBE, field: VibeY, op: max, round: 2 }
    - { key: vibrationMaxZ, label: 最大振动(Z), unit: m/s^2, topic: VIBE, field: VibeZ, op: max, round: 2 }
    # Clip 是单调递增的累计计数器，range_of 等价于 last - first，即削波总数
    - { key: accelClip0, label: 削波累计(IMU0), unit: 次, topic: VIBE, field: Clip0, op: range_of, round: 0 }
    - { key: accelClip1, label: 削波累计(IMU1), unit: 次, topic: VIBE, field: Clip1, op: range_of, round: 0 }
    - { key: accelClip2, label: 削波累计(IMU2), unit: 次, topic: VIBE, field: Clip2, op: range_of, round: 0 }
    - { key: batteryVoltageMin, label: 最低电压(BAT), unit: V, topic: BAT, field: Volt, op: min, round: 2 }
    - { key: batteryVoltageMinLegacy, label: 最低电压(CURR), unit: V, topic: CURR, field: Volt, op: min, round: 2 }
    - { key: currentMax, label: 最大电流, unit: A, topic: BAT, field: Curr, op: max, round: 2 }
    - { key: gpsSatellitesMin, label: 最少搜星, unit: 颗, topic: GPS, field: NSats, op: min, round: 0 }
    - { key: gpsHdopMax, label: 最大 HDOP, unit: "", topic: GPS, field: HDop, op: max, round: 2 }
