        31: AUTOTUNE_OFF,
        33: AUTOTUNE_SUCCESS,
        34: AUTOTUNE_FAILED,
        41: FENCE_ENABLE,
        42: FENCE_DISABLE,
        49: PARACHUTE_DISABLED,
        51: PARACHUTE_RELEASED,
        54: MOTORS_EMERGENCY_STOPPED,
        58: ROTOR_RUNUP_COMPLETE,
