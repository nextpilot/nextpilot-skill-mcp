# ArduPilot（.bin / DataFlash）的数据文件 —— 码表、展示口径、规则元数据。
#
# 与 knowledge/px4/facts.yaml 同构，但**键不全对齐**：照抄 PX4 那 9 个必填键会变成编造
# （APM 没有 nav_state 数值轴、没有键值信息消息、格式自描述因而没有固定消息码表），
# 所以下面每一节都写了"为什么它在这、为什么不照抄 PX4"。
#
# 判据沿用 px4/facts.yaml 顶部的那条：**同一个节里没有分支/回退/异常 → 留这里；
# 有 → 进 provider**。从日志的哪儿取、取不到怎么回退，全在
# knowledge/engine/providers/ardupilot.py（那是本项目唯一认识 APM 的地方）。
#
# 数据来源：上游 ardupilot-mcp（MIT）的 ardupilot_meta.py 与 ardupilot_docs.py，
# 逐条核实过 ArduPilot 官方 LogStructure / apm.pdef.xml。署名与偏差见 ATTRIBUTION.md。
#
# ✅ 2026-09 已接线：构建脚本按固件族扫描（`knowledge/<族>/` 配 `providers/<族>.py`），
# 本文件与 rules/ 一起进产物，引擎按 `log_type` 取这一套。
# 仍然成立的一条：下面的值**没有一条经过真实 .bin 日志验证**（仓库里还没有真实样本，
# 端到端证据来自 tools/dev/apm_make_sample.py 的合成日志）——见 PENDING.md。

# ─────────────────────────────────────────────────────────────────────────────
# 规则执行顺序：引擎按这个列表逐个 group 跑，顺序即报告里 finding 编号（F01、F02…）
# 的生成顺序。约定与 PX4 一致：**guards_early 必须排第一、guards 排最后**。
#
# 本轮 16 项检查 → 16 个 group。两个 guard group 是空占位（本轮不写 APM guard 规则，
# 空 group 允许，引擎对没有规则的 group 就是空跑）——保留位置是为了将来
# insufficient_data 能排到第一。
group_order:
    [
        guards_early,
        integrity,
        events,
        ekf_variance,
        vibration,
        battery,
        gps_health,
        compass,
        attitude_tracking,
        motor_balance,
        rc_input,
        timing,
        config_safety,
        calibration,
        sensor_health,
        prearm_messages,
        param_audit,
        guards,
    ]

# ─────────────────────────────────────────────────────────────────────────────
# 规则元数据：避免 25 条经验各自重复写 category / 官方链接 / 许可。
# 构建期用它给每条规则派生字段，**每个 group 必须在这里登记**，否则构建直接失败。
# 同一个 group 下的多条规则派生的 category 与 doc 必须一致。
#
# status: draft 不是谦虚——本轮这批阈值没有一条经过真实 .bin 日志验证
# （连"能不能取到数"都还没验，见 PENDING.md）。验完再改 stable。
# license 是上游的 MIT，**不要**沿用 PX4 那份的 CC-BY-4.0：那是 PX4 侧的身份默认值，
# 抄过来等于伪造许可。
rule_meta:
    defaults:
        version: "0.1.0"
        status: draft
        license: MIT
        author:
            name: "NextPilot 内置（源自 ardupilot-mcp，见 ATTRIBUTION.md）"
    by_group:
        integrity:
            category: integrity
            doc: "https://ardupilot.org/copter/docs/common-diagnosing-problems-using-logs.html"
        events:
            category: events
            doc: "https://ardupilot.org/copter/docs/common-diagnosing-problems-using-logs.html"
        ekf_variance:
            category: ekf
            doc: "https://ardupilot.org/copter/docs/ekf-inav-failsafe.html"
        vibration:
            category: vibration
            doc: "https://ardupilot.org/copter/docs/common-measuring-vibration.html"
        battery:
            category: power
            doc: "https://ardupilot.org/copter/docs/failsafe-battery.html"
        gps_health:
            category: gps
            doc: "https://ardupilot.org/copter/docs/gps-failsafe-glitch-protection.html"
        compass:
            category: compass
            doc: "https://ardupilot.org/copter/docs/common-compass-setup-advanced.html"
        attitude_tracking:
            category: attitude
            doc: "https://ardupilot.org/copter/docs/common-tuning.html"
        motor_balance:
            category: motor
            doc: "https://ardupilot.org/copter/docs/thrust_loss_yaw_imbalance.html"
        rc_input:
            category: rc
            doc: "https://ardupilot.org/copter/docs/radio-failsafe.html"
        timing:
            category: system
            doc: "https://ardupilot.org/copter/docs/common-diagnosing-problems-using-logs.html"
        config_safety:
            category: config
            doc: "https://ardupilot.org/copter/docs/common-prearm-safety-checks.html"
        calibration:
            category: calibration
            doc: "https://ardupilot.org/copter/docs/common-compass-calibration-in-mission-planner.html"
        sensor_health:
            category: sensors
            doc: "https://ardupilot.org/copter/docs/common-prearm-safety-checks.html"
        prearm_messages:
            category: config
            doc: "https://ardupilot.org/copter/docs/common-prearm-safety-checks.html"
        param_audit:
            category: config
            doc: "https://ardupilot.org/copter/docs/parameters.html"
        guards_early:
            category: guard
        guards:
            category: guard

# ─────────────────────────────────────────────────────────────────────────────
# 日志级别：APM 与 PX4 共用同一套数字语义（3=ERROR 4=WARNING 6=INFO）。
# 与 providers/ardupilot.py 的 _LEVEL_NAMES 同源，**本表只是码值文档**：
# 运行期 MESSAGES 条目已自带 level_name，不走这张表。
log_levels: { 3: ERROR, 4: WARNING, 6: INFO }

# ─────────────────────────────────────────────────────────────────────────────
# 机型：**规则 conditions.vehicle 的词表**，值域 = 引擎认识的机型名。
#
# FRAME_CLASS → 精确机型按上游权威源码（AP_Motors/AP_Parameters）。
# Plane / Rover 没有 FRAME_CLASS，由 provider 按固件名（ArduPlane / ArduRover）识别。
# 规则可写精确名，也可写类别简写（copter / plane / rover），引擎 _match_vehicle 展开。
vehicle_types: [copter, plane, rover, quad, hexa, octa, tri, coax, y6, heli, heli_dual, octa_quad, single, dodeca, deca, undefined, unknown]

# ─────────────────────────────────────────────────────────────────────────────
# 飞行模式：上游 COPTER_MODES（Copter 4.5.7 的 mode.h Number enum）。
# 缺 8/10/12 —— 那三个号在 ArduCopter 里没有对应模式，不是漏抄。
#
# 与 PX4 的 nav_state_names **不是一回事**：APM 的 MODE 消息里模式名本身就是字符串
# （provider 直接给原文），ModeNum 是可选数值字段。这张表的运行期用途是
# "当 ModeNum 存在时把码值翻译成名字"。
flight_modes:
    {
        0: STABILIZE,
        1: ACRO,
        2: ALT_HOLD,
        3: AUTO,
        4: GUIDED,
        5: LOITER,
        6: RTL,
        7: CIRCLE,
        9: LAND,
        11: DRIFT,
        13: SPORT,
        14: FLIP,
        15: AUTOTUNE,
        16: POSHOLD,
        17: BRAKE,
        18: THROW,
        19: AVOID_ADSB,
        20: GUIDED_NOGPS,
        21: SMART_RTL,
        22: FLOWHOLD,
        23: FOLLOW,
        24: ZIGZAG,
        25: SYSTEMID,
        26: AUTOROTATE,
        27: AUTO_RTL,
    }

# ─────────────────────────────────────────────────────────────────────────────
# 飞行阶段：把 MODE 模式名归到阶段（providers/ardupilot.py 推 facts.phases 用），
# 与 PX4 的 nav_state_groups 同构——映射是知识放这里，provider 只执行。
# 口径：armed 段内出现过的模式才计（地面待命不算飞行阶段）；模式名 lower() 后
# 精确匹配，名单同时收 mode.h 全名与部分日志/合成样本的缩写写法（stab/auto）。
# 阶段词表与 PX4 对齐但没有 takeoff/fw_cruise 两个：APM 没有独立的起飞模式
# （Auto 起飞是航点动作，MODE 消息看不见），多旋翼 AUTO 也判不出"固定翼巡航"。
# [暂定]：LOITER 在 Plane 里是盘旋巡航、这里归 hover（多旋翼语义优先）；
# GUIDED/AUTOTUNE/CIRCLE 这类混合语义的归组未过真实 .bin 校准，见 PENDING.md。
mode_phase_groups:
    - { phase: maneuver, modes: [stabilize, stab, acro, manual, training, sport, drift, flip] }
    - { phase: hover, modes: [althold, alt_hold, loiter, poshold, pos_hold, position, brake, flowhold, flow_hold, throw, guided, guided_nogps, smart_rtl, smartrtl, follow, zigzag] }
    - { phase: cruise, modes: [auto, auto_rtl, autotune, auto_tune, circle, systemid, avoid_adsb, autorotate, cruise, fbwa, fbwb, rtl] }
    - { phase: landing, modes: [land, landing] }

# ─────────────────────────────────────────────────────────────────────────────
