        8: FAILSAFE_GCS,
        9: FAILSAFE_FENCE,
        10: FLIGHT_MODE,
        11: GPS,
        12: CRASH_CHECK,
        13: FLIP,
        14: AUTOTUNE,
        15: PARACHUTE,
        16: EKFCHECK,
        17: FAILSAFE_EKFINAV,
        18: BARO,
        19: CPU,
        20: FAILSAFE_ADSB,
        21: TERRAIN,
        22: NAVIGATION,
        23: FAILSAFE_TERRAIN,
