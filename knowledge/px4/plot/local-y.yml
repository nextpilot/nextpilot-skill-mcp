id: local-y
title: Local Position Y
description: 局部位置 Y 轴估计值与 setpoint。
order: 10
conditions:
  message: [vehicle_local_position]
outputs:
  - container: axes
    title: Local Position Y
    ylabel: "[m]"
    children:
      - mode: TimeSeries
        ydata:
          - vehicle_local_position.y
        label: ["Y Estimated"]
      - mode: TimeSeries
        ydata:
          - vehicle_local_position_setpoint.y
        label: ["Y Setpoint"]