id: distance
title: Distance Sensor
description: 距离传感器读数（current_distance / variance / dist_bottom）。
order: 31
conditions:
  topics: [distance_sensor]
outputs:
  - container: axes
    title: Distance Sensor
    ylabel: "[m]"
    children:
      - mode: TimeSeries
        ydata:
          - ref("distance_sensor[0].current_distance")
          - ref("distance_sensor[0].variance")
        label: ["Distance", "Variance"]
      - mode: TimeSeries
        ydata:
          - ref("vehicle_local_position[0].dist_bottom")
          - ref("vehicle_local_position[0].dist_bottom_valid")
        label: ["Estimated Distance Bottom [m]", "Dist Bottom Valid"]