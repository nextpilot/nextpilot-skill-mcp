id: tecs
title: TECS
description: TECS 高度变化率与 setpoint（固定翼/VTOL）。
order: 19
conditions:
  message: [tecs_status]
outputs:
  - container: axes
    title: TECS
    ylabel: "[m/s]"
    children:
      - mode: TimeSeries
        ydata:
          - tecs_status.height_rate
          - tecs_status.height_rate_setpoint
        label: ["Height Rate", "Height Rate Setpoint"]