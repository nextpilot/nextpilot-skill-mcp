id: rates
title: 角速度
description: 三轴角速度（rad/s）：原始陀螺 + 滤波后估计值，两面板共享时间轴。
order: 10
conditions:
  topics: ["sensor_gyro || vehicle_angular_velocity"]
outputs:
  - container: axes
    title: 原始角速度（陀螺）
    ylabel: rad/s
    children:
      - mode: TimeSeries
        ydata:
          - ref("sensor_gyro[0].x")
          - ref("sensor_gyro[0].y")
          - ref("sensor_gyro[0].z")
        label: [X, Y, Z]
  - container: axes
    title: 滤波后角速度
    ylabel: rad/s
    children:
      - mode: TimeSeries
        ydata:
          - ref("vehicle_angular_velocity[0].xyz[0]")
          - ref("vehicle_angular_velocity[0].xyz[1]")
          - ref("vehicle_angular_velocity[0].xyz[2]")
        label: [X, Y, Z]