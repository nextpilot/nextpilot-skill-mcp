# 摇杆四通道与开关状态，对照失控/误操作时刻的输入。
# 来源：Flight Review（PX4/flight_review，plot/configured_plots.py）的 C3「Manual Control Inputs」+ C4「Raw Radio Control Inputs」；字段语义按 PX4 uORB 消息定义（github.com/PX4/PX4-Autopilot/tree/main/msg）。
# 与上游差异：上游两张图（新/老固件回退分支）合并为本仓一个文件的候选组。

id: rc
title: Manual Control Inputs
description: 手动控制输入（遥控器/手柄）：Roll/Pitch/Yaw/Throttle + Aux + Flight Mode + Kill Switch。
order: 20
condition:
  message: [manual_control_setpoint]
output:
  - container: axes
    title: Manual Control Inputs (Radio or Joystick)
    ylabel: "[-1, 1]"
    children:
      - mode: TimeSeries
        ydata:
          - manual_control_setpoint.roll
          - manual_control_setpoint.pitch
          - manual_control_setpoint.yaw
          - manual_control_setpoint.throttle
          - manual_control_setpoint.aux1
          - manual_control_setpoint.aux2
        label: ["Y / Roll", "X / Pitch", "Yaw", "Throttle [-1, 1]", "Aux1", "Aux2"]
      - mode: TimeSeries
        ydata:
          - _ref("manual_control_switches.mode_slot", "manual_control_setpoint.mode_slot")
          - _ref("manual_control_switches.kill_switch", "manual_control_setpoint.kill_switch")
        label: ["Flight Mode", "Kill Switch"]