id: pitch-rate
title: Pitch Angular Rate
description: Pitch 角速度估计值与 setpoint、积分。
order: 6
condition:
  message: [vehicle_attitude]
output:
  - container: axes
    title: Pitch Angular Rate
    ylabel: deg/s
    children:
      - mode: TimeSeries
        ydata:
          - _ref("vehicle_angular_velocity.xyz[1]", "vehicle_attitude.pitchspeed")
        label: ["Pitch Rate Estimated"]
      - mode: TimeSeries
        ydata:
          - vehicle_rates_setpoint.pitch
        label: ["Pitch Rate Setpoint"]
      - mode: TimeSeries
        ydata:
          - rate_ctrl_status.pitchspeed_integ
        label: ["Pitch Rate Integral"]