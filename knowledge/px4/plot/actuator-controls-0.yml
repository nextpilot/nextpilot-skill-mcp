# 姿态与推力的控制指令曲线（扭矩三轴 + 推力通道），看混控前的期望输出与饱和。
# 来源：Flight Review（PX4/flight_review，plot/configured_plots.py）的 C5「Actuator Controls 0」构造点；字段语义按 PX4 uORB 消息定义（github.com/PX4/PX4-Autopilot/tree/main/msg）。
# 与上游差异：字段与口径照抄上游。

id: actuator-controls-0
title: Actuator Controls
description: Actuator Controls 0：扭矩轴（Roll/Pitch/Yaw）+ 推力。
order: 21
condition:
  message: ["vehicle_torque_setpoint || actuator_controls_0"]
output:
  - container: axes
    title: Actuator Controls
    ylabel: "normalized"
    children:
      - mode: TimeSeries
        ydata:
          - _ref("vehicle_torque_setpoint.xyz[0]", "actuator_controls_0.control[0]")
          - _ref("vehicle_torque_setpoint.xyz[1]", "actuator_controls_0.control[1]")
          - _ref("vehicle_torque_setpoint.xyz[2]", "actuator_controls_0.control[2]")
        label: ["Roll", "Pitch", "Yaw"]