# VIO 角速率对照。
# 来源：Flight Review（PX4/flight_review，plot/configured_plots.py）的 P18「Visual Odometry Attitude Rate」（VIO 五项之一）；字段语义按 PX4 uORB 消息定义（github.com/PX4/PX4-Autopilot/tree/main/msg）。
# 与上游差异：字段与口径照抄上游。

id: visual-odom-rate
title: Visual Odometry Attitude Rate
description: 视觉里程计角速率（仅当 topic 存在时显示）。
order: 16
condition:
  message: [vehicle_visual_odometry]
output:
  - container: axes
    title: Visual Odometry Attitude Rate
    ylabel: "[deg]"
    children:
      - mode: TimeSeries
        ydata:
          - vehicle_visual_odometry.rollspeed
          - vehicle_visual_odometry.pitchspeed
          - vehicle_visual_odometry.yawspeed
        label: ["Roll Rate", "Pitch Rate", "Yaw Rate"]