# 三轴原始磁场强度时序，看磁力计饱和/干扰/硬铁偏移突变。
# 来源：Flight Review（PX4/flight_review，plot/configured_plots.py）的传感器项「Raw Magnetic Field Strength」构造点；字段语义按 PX4 uORB 消息定义（github.com/PX4/PX4-Autopilot/tree/main/msg）。
# 与上游差异：字段与口径照抄上游。

id: mag
title: Raw Magnetic Field Strength
description: 传感器原始磁场强度（magnetometer_ga），兼容 vehicle_magnetometer / sensor_combined。
order: 30
condition:
  message: ["vehicle_magnetometer || sensor_combined"]
output:
  - container: axes
    title: Raw Magnetic Field Strength
    ylabel: "[gauss]"
    children:
      - mode: TimeSeries
        ydata:
          - _ref("vehicle_magnetometer.magnetometer_ga[0]", "sensor_combined.magnetometer_ga[0]")
          - _ref("vehicle_magnetometer.magnetometer_ga[1]", "sensor_combined.magnetometer_ga[1]")
          - _ref("vehicle_magnetometer.magnetometer_ga[2]", "sensor_combined.magnetometer_ga[2]")
        label: ["X", "Y", "Z"]