# IMU 原始角速率 FIFO 高频数据（未降采样）。
# 来源：Flight Review（PX4/flight_review，plot/configured_plots.py）的「Raw Gyroscope (FIFO)」构造点（写在其 for 循环内）；字段语义按 PX4 uORB 消息定义（github.com/PX4/PX4-Autopilot/tree/main/msg）。
# 与上游差异：同 fifo-accel：上游循环展开多张，本仓 split_by_instance 合并。

id: fifo-gyro
title: Raw Gyro (FIFO)
description: FIFO 陀螺仪原始数据（每 IMU 一张），仅当 sensor_gyro_fifo 存在时显示。
order: 29
condition:
  message: [sensor_gyro_fifo]
output:
  - container: axes
    title: "Raw Gyro (FIFO, IMU{instance})"
    ylabel: "[deg/s]"
    split_by_instance: true
    children:
      - mode: TimeSeries
        ydata:
          - sensor_gyro_fifo[:].x
          - sensor_gyro_fifo[:].y
          - sensor_gyro_fifo[:].z
        label: ["X", "Y", "Z"]