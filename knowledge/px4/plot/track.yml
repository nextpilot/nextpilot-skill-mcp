id: track
title: 轨迹
description: 地图上的飞行轨迹（原始 GNSS），多条轨道叠画、可点选隐藏。
order: 41
conditions:
  topics: ["sensor_gps || vehicle_gps_position"]
# 地图容器的声明方式与曲线**完全一样**，只是 container 不同、children 画的是轨道。
# 取数走 ref 的候选组 + unit=：sensor_gps 优先（1.16+），老固件退回 vehicle_gps_position，
# 且要写成 `[N]` 指明实例——同一条轨道的时间戳与 fix_type 必须来自同一个 topic 的同一个实例。
outputs:
  - container: map
    title: 轨迹
    legend: true
    children:
      - mode: track
        label: gps
        max_points: 1500
        lat: >-
          ref("sensor_gps[0].latitude_deg", "vehicle_gps_position[0].latitude_deg",
          "vehicle_gps_position[0].lat", unit="deg")
        lon: >-
          ref("sensor_gps[0].longitude_deg", "vehicle_gps_position[0].longitude_deg",
          "vehicle_gps_position[0].lon", unit="deg")
        alt: >-
          ref("sensor_gps[0].altitude_msl_m", "vehicle_gps_position[0].altitude_msl_m",
          "vehicle_gps_position[0].alt", unit="m")