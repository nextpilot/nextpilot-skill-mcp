# 地理轨迹地图（按飞行模式着色），整段飞行的地理概览。
# 来源：Flight Review（PX4/flight_review，plot/configured_plots.py）的 P2「Leaflet Map」；字段语义按 PX4 uORB 消息定义（github.com/PX4/PX4-Autopilot/tree/main/msg）。
# 与上游差异：本仓用 map 容器复刻；瓦片源与配色是本仓实现。

id: track
title: 轨迹
description: 地图上的飞行轨迹（原始 GNSS），多条轨道叠画、可点选隐藏。
order: 41
condition:
  message: ["sensor_gps || vehicle_gps_position"]
# 地图容器的声明方式与曲线**完全一样**，只是 container 不同、children 画的是轨道。
# 取数走 ref 的候选组 + unit=：sensor_gps 优先（1.16+），老固件退回 vehicle_gps_position，
# 且要写成 `[N]` 指明实例——同一条轨道的时间戳与 fix_type 必须来自同一个 topic 的同一个实例。
output:
  - container: map
    title: 轨迹
    legend: true
    children:
      - mode: track
        label: gps
        max_points: 1500
        lat: >-
          _ref("sensor_gps.latitude_deg", "vehicle_gps_position.latitude_deg", "vehicle_gps_position.lat", unit="deg")
        lon: >-
          _ref("sensor_gps.longitude_deg", "vehicle_gps_position.longitude_deg", "vehicle_gps_position.lon", unit="deg")
        alt: >-
          _ref("sensor_gps.altitude_msl_m", "vehicle_gps_position.altitude_msl_m", "vehicle_gps_position.alt", unit="m")