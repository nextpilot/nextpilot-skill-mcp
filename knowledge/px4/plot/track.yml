# 地图轨迹的**取数声明** —— 只声明"读哪个 topic 的哪几列、各按什么量纲换算"，不含解析逻辑。
#
# 为什么放在 plot/ 而不是 facts.yaml：它与同目录的曲线预设是同一类东西——"要画什么、
# 从哪几列画"。区别在消费者：曲线预设进前端（→ plots.generated.ts，前端据此搭面板），
# 这份要进 **Python**——轨迹是在引擎侧取数、换算、抽稀的（provider 的 track()），前端只管画。
# 所以构建期把下面这个 track 块并进 __FACTS__（见 build-knowledge.mjs），由 provider 从 cfg 读。
#
# **逻辑不在这里**：「按顺序取第一个存在的候选字段」「剔掉未定位的采样（GPS 没定位时 PX4 记
# lat=lon=0）」「等距抽样」都是分支逻辑，留在 engine/providers/px4.py 的 track() 里。
# 把分支搬进 YAML 只能再造一门小语言——本项目已经删掉两门了。
#
# 字段名与量纲随固件改过（1.15 起 lat/lon/alt → latitude_deg/longitude_deg/altitude_msl_m，
# 且 degE7→deg、mm→m），所以每个字段给**候选**，按顺序试、各按自己的 scale 换算。
track:
  topic: vehicle_gps_position
  instance: 0
  max_points: 1500
  lat:
    - {field: latitude_deg, scale: 1}        # 1.15+：直接是度
    - {field: lat,          scale: 1.0e-7}   # 旧固件：degE7
  lon:
    - {field: longitude_deg, scale: 1}
    - {field: lon,           scale: 1.0e-7}
  alt:
    - {field: altitude_msl_m, scale: 1}      # 1.15+：米
    - {field: alt,            scale: 0.001}  # 旧固件：毫米
