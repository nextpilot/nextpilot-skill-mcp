id: spectrum-gyro
title: Gyro Spectrum (X)
description: sensor_combined 陀螺 X 轴的单边幅度谱（字段无关频谱算子；采样率由该话题 timestamp 自推）。
order: 42
condition:
  message: [sensor_combined]
compute:
  # 不写 sample_rate：引擎从命中话题的 timestamp 自推采样率（写死解析式有版本/机架差异）
  - gx = sensor_combined.gyro_rad[0]
  - f, px = spectrum(gx, norm="amplitude")
output:
  - container: spectrogram
    title: Gyro X 幅度谱
    ylabel: "幅度 [rad/s]"
    xlabel: Hz
    children:
      - mode: spectrum
        ydata:
          - px
        label: ["Gyro X"]
