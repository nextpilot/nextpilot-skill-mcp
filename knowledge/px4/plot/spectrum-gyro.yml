# 陀螺 X 轴单边幅度谱（W5 频谱样板图）。
# 来源：Flight Review（PX4/flight_review，plot/configured_plots.py） 频谱分析口径；字段语义按 PX4 uORB 消息定义（github.com/PX4/PX4-Autopilot/tree/main/msg）。
# 与上游差异：上游无单一对应图，本仓按其 FFT 口径实现（W5 样板，后续谱图沿用）。

id: spectrum-gyro
title: Gyro Spectrum (X)
description: sensor_combined 陀螺 X 轴的单边幅度谱（字段无关频谱算子；采样率由该话题 timestamp 自推）。
order: 42
condition:
  message: [sensor_combined]
compute:
  # 不写 sample_rate：引擎从命中话题的 timestamp 自推采样率（写死解析式有版本/机架差异）
  - gx = sensor_combined.gyro_rad[0]
  - f, px = spectrum(gx, norm="amplitude")
output:
  - container: spectrum
    title: Gyro X 幅度谱
    ylabel: "幅度 [rad/s]"
    xlabel: Hz
    children:
      - mode: spectrum
        ydata:
          - px
        label: ["Gyro X"]
