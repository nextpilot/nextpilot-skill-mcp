# 局部位置 Z 轴（高度）估计值 vs 设定值。
# 来源：Flight Review（PX4/flight_review，plot/configured_plots.py）的 P10「Local Position Z」；字段语义按 PX4 uORB 消息定义（github.com/PX4/PX4-Autopilot/tree/main/msg）。
# 与上游差异：同 local-x：真值并入候选组。

id: local-z
title: Local Position Z
description: 局部位置 Z 轴估计值与 setpoint（向上为正）。
order: 11
condition:
  message: [vehicle_local_position]
output:
  - container: axes
    title: Local Position Z
    ylabel: "[m]"
    children:
      - mode: TimeSeries
        ydata:
          - vehicle_local_position.z
        label: ["Z Estimated"]
      - mode: TimeSeries
        ydata:
          - vehicle_local_position_setpoint.z
        label: ["Z Setpoint"]