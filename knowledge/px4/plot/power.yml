id: power
title: 电源
description: 电压 / 电流 / 剩余电量，多面板共享时间轴。
order: 3
conditions:
  topics: [battery_status]
outputs:
  - container: axes
    title: 电压
    ylabel: V
    children:
      - mode: TimeSeries
        ydata:
          - ref("battery_status[0].voltage_v")
          - ref("battery_status[0].voltage_filtered_v")
  - container: axes
    title: 电流
    ylabel: A
    children:
      - mode: TimeSeries
        ydata:
          - ref("battery_status[0].current_a")
  - container: axes
    title: 剩余电量
    ylabel: "%"
    children:
      - mode: TimeSeries
        ydata:
          - ref("battery_status[0].remaining")