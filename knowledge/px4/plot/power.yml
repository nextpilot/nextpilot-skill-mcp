# 电池电压/电流/剩余电量时序，配合电池类规则定位压降与容量问题。
# 来源：Flight Review（PX4/flight_review，plot/configured_plots.py）的传感器项「Power」构造点；字段语义按 PX4 uORB 消息定义（github.com/PX4/PX4-Autopilot/tree/main/msg）。
# 与上游差异：字段与口径照抄上游。

id: power
title: Power
description: 电池电压 / 电流 / 放电量 / 剩余电量 / OCV / 内阻 / 5V / 3.3V。
order: 35
condition:
  message: [battery_status]
output:
  - container: axes
    title: Power
    ylabel: "mixed"
    children:
      - mode: TimeSeries
        ydata:
          - battery_status.voltage_v
          - battery_status.current_a
          - battery_status.discharged_mah
          - battery_status.remaining
        label:
          ["Battery Voltage [V]", "Battery Current [A]",
           "Discharged Amount [mAh / 100]", "Battery remaining [0=empty, 10=full]"]
      - mode: TimeSeries
        ydata:
          - battery_status.ocv_estimate
          - battery_status.internal_resistance_estimate
        label: ["OCV Estimate [V]", "Internal Resistance Estimate [mOhm]"]
      - mode: TimeSeries
        ydata:
          - system_power.voltage5v_v
          - system_power.sensors3v3[0]
        label: ["5 V", "3.3 V"]