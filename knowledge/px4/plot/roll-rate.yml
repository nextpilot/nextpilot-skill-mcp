id: roll-rate
title: Roll Angular Rate
description: Roll 角速度估计值与 setpoint、积分。
order: 4
condition:
  message: [vehicle_attitude]
output:
  - container: axes
    title: Roll Angular Rate
    ylabel: deg/s
    children:
      - mode: TimeSeries
        ydata:
          - _ref("vehicle_angular_velocity.xyz[0]", "vehicle_attitude.rollspeed")
        label: ["Roll Rate Estimated"]
      - mode: TimeSeries
        ydata:
          - vehicle_rates_setpoint.roll
        label: ["Roll Rate Setpoint"]
      - mode: TimeSeries
        ydata:
          - rate_ctrl_status.rollspeed_integ
        label: ["Roll Rate Integral"]