# 横滚角速率：实测 vs 设定值与积分项。
# 来源：Flight Review（PX4/flight_review，plot/configured_plots.py）的 P7「Roll Angular Rate」；字段语义按 PX4 uORB 消息定义（github.com/PX4/PX4-Autopilot/tree/main/msg）。
# 与上游差异：字段与口径照抄上游。

id: roll-rate
title: Roll Angular Rate
description: Roll 角速度估计值与 setpoint、积分。
order: 4
condition:
  message: [vehicle_attitude]
output:
  - container: axes
    title: Roll Angular Rate
    ylabel: deg/s
    children:
      - mode: TimeSeries
        ydata:
          - _ref("vehicle_angular_velocity.xyz[0]", "vehicle_attitude.rollspeed")
        label: ["Roll Rate Estimated"]
      - mode: TimeSeries
        ydata:
          - vehicle_rates_setpoint.roll
        label: ["Roll Rate Setpoint"]
      - mode: TimeSeries
        ydata:
          - rate_ctrl_status.rollspeed_integ
        label: ["Roll Rate Integral"]