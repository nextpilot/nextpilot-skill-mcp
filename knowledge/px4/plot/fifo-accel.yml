id: fifo-accel
title: Raw Acceleration (FIFO)
description: FIFO 加速度计原始数据（每 IMU 一张），仅当 sensor_accel_fifo 存在时显示。
order: 28
conditions:
  topics: [sensor_accel_fifo]
outputs:
  - container: axes
    title: "Raw Acceleration (FIFO, IMU{instance})"
    ylabel: "[m/s^2]"
    split_by_instance: true
    children:
      - mode: TimeSeries
        ydata:
          - ref("sensor_accel_fifo[:].x")
          - ref("sensor_accel_fifo[:].y")
          - ref("sensor_accel_fifo[:].z")
        label: ["X", "Y", "Z"]