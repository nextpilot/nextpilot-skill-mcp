# 视觉里程计（VIO）姿态四元数对照。
# 来源：Flight Review（PX4/flight_review，plot/configured_plots.py）的 P17「Visual Odometry Attitude」（VIO 五项之一）；字段语义按 PX4 uORB 消息定义（github.com/PX4/PX4-Autopilot/tree/main/msg）。
# 与上游差异：字段与口径照抄上游。

id: visual-odom-att
title: Visual Odometry Attitude
description: 视觉里程计姿态角（仅当 topic 存在时显示）。
order: 15
condition:
  message: [vehicle_visual_odometry]
output:
  - container: axes
    title: Visual Odometry Attitude
    ylabel: "[deg]"
    children:
      - mode: TimeSeries
        ydata:
          - vehicle_visual_odometry.roll
          - vehicle_visual_odometry.pitch
          - vehicle_visual_odometry.yaw
        label: ["Roll", "Pitch", "Yaw"]