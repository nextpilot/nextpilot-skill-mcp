id: visual-odom-att
title: Visual Odometry Attitude
description: 视觉里程计姿态角（仅当 topic 存在时显示）。
order: 15
conditions:
  message: [vehicle_visual_odometry]
outputs:
  - container: axes
    title: Visual Odometry Attitude
    ylabel: "[deg]"
    children:
      - mode: TimeSeries
        ydata:
          - ref("vehicle_visual_odometry[0].roll")
          - ref("vehicle_visual_odometry[0].pitch")
          - ref("vehicle_visual_odometry[0].yaw")
        label: ["Roll", "Pitch", "Yaw"]