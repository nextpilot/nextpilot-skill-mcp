id: local-position
title: 本地位置
description: 本地 NED 坐标系下的位置与速度估计（m / m/s）。
order: 7
conditions:
  topics: [vehicle_local_position]
outputs:
  - container: axes
    title: 位置 (NED)
    ylabel: m
    children:
      - mode: TimeSeries
        ydata:
          - ref("vehicle_local_position[0].x")
          - ref("vehicle_local_position[0].y")
          - ref("vehicle_local_position[0].z")
        label: [X (北), Y (东), Z (下)]
  - container: axes
    title: 速度 (NED)
    ylabel: m/s
    children:
      - mode: TimeSeries
        ydata:
          - ref("vehicle_local_position[0].vx")
          - ref("vehicle_local_position[0].vy")
          - ref("vehicle_local_position[0].vz")
        label: [VX (北), VY (东), VZ (下)]