id: yaw-rate
title: Yaw Angular Rate
description: Yaw 角速度估计值与 setpoint、积分。
order: 8
conditions:
  topics: [vehicle_attitude]
outputs:
  - container: axes
    title: Yaw Angular Rate
    ylabel: deg/s
    children:
      - mode: TimeSeries
        ydata:
          - ref("vehicle_angular_velocity[0].xyz[2]", "vehicle_attitude[0].yawspeed")
        label: ["Yaw Rate Estimated"]
      - mode: TimeSeries
        ydata:
          - ref("vehicle_rates_setpoint[0].yaw")
        label: ["Yaw Rate Setpoint"]
      - mode: TimeSeries
        ydata:
          - ref("rate_ctrl_status[0].yawspeed_integ")
        label: ["Yaw Rate Integral"]