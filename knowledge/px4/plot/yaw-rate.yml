# 偏航角速率：实测 vs 设定值与积分项。
# 来源：Flight Review（PX4/flight_review，plot/configured_plots.py）的 P9「Yaw Angular Rate」；字段语义按 PX4 uORB 消息定义（github.com/PX4/PX4-Autopilot/tree/main/msg）。
# 与上游差异：字段与口径照抄上游。

id: yaw-rate
title: Yaw Angular Rate
description: Yaw 角速度估计值与 setpoint、积分。
order: 8
condition:
  message: [vehicle_attitude]
output:
  - container: axes
    title: Yaw Angular Rate
    ylabel: deg/s
    children:
      - mode: TimeSeries
        ydata:
          - _ref("vehicle_angular_velocity.xyz[2]", "vehicle_attitude.yawspeed")
        label: ["Yaw Rate Estimated"]
      - mode: TimeSeries
        ydata:
          - vehicle_rates_setpoint.yaw
        label: ["Yaw Rate Setpoint"]
      - mode: TimeSeries
        ydata:
          - rate_ctrl_status.yawspeed_integ
        label: ["Yaw Rate Integral"]