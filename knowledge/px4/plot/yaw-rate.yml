id: yaw-rate
title: Yaw Angular Rate
description: Yaw 角速度估计值与 setpoint、积分。
order: 8
conditions:
  message: [vehicle_attitude]
outputs:
  - container: axes
    title: Yaw Angular Rate
    ylabel: deg/s
    children:
      - mode: TimeSeries
        ydata:
          - _ref("vehicle_angular_velocity.xyz[2]", "vehicle_attitude.yawspeed")
        label: ["Yaw Rate Estimated"]
      - mode: TimeSeries
        ydata:
          - vehicle_rates_setpoint.yaw
        label: ["Yaw Rate Setpoint"]
      - mode: TimeSeries
        ydata:
          - rate_ctrl_status.yawspeed_integ
        label: ["Yaw Rate Integral"]