# 降采样后的原始角速率（sensor_combined），看高频抖动。
# 来源：Flight Review（PX4/flight_review，plot/configured_plots.py）的振动项「Raw Angular Speed (Gyroscope)」构造点；字段语义按 PX4 uORB 消息定义（github.com/PX4/PX4-Autopilot/tree/main/msg）。
# 与上游差异：字段与口径照抄上游。

id: raw-gyro
title: Raw Angular Speed (Gyroscope)
description: 传感器原始角速度（sensor_combined.gyro_rad）。
order: 27
condition:
  message: [sensor_combined]
output:
  - container: axes
    title: Raw Angular Speed (Gyroscope)
    ylabel: "[rad/s]"
    children:
      - mode: TimeSeries
        ydata:
          - sensor_combined.gyro_rad[0]
          - sensor_combined.gyro_rad[1]
          - sensor_combined.gyro_rad[2]
        label: ["X", "Y", "Z"]