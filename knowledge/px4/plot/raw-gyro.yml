id: raw-gyro
title: Raw Angular Speed (Gyroscope)
description: 传感器原始角速度（sensor_combined.gyro_rad）。
order: 27
condition:
  message: [sensor_combined]
output:
  - container: axes
    title: Raw Angular Speed (Gyroscope)
    ylabel: "[rad/s]"
    children:
      - mode: TimeSeries
        ydata:
          - sensor_combined.gyro_rad[0]
          - sensor_combined.gyro_rad[1]
          - sensor_combined.gyro_rad[2]
        label: ["X", "Y", "Z"]