id: gps
title: GPS
description: 卫星数与定位精度（HDOP/EPH/EPV）。
order: 6
conditions:
  topics: ["vehicle_gps_position || sensor_gps"]
outputs:
  - container: axes
    title: 卫星数
    ylabel: count
    children:
      - mode: TimeSeries
        # 话题改名（1.16 起叫 sensor_gps）：候选组放在**后面**，老名字优先——
        # 与今天画的是同一份数据（vehicle_gps_position 采样更密），换了会平白改图。
        ydata:
          - ref("vehicle_gps_position[0].satellites_used", "sensor_gps[0].satellites_used")
          - ref("vehicle_gps_position[0].satellites_visible", "sensor_gps[0].satellites_visible")
  - container: axes
    title: 定位精度
    ylabel: m
    children:
      - mode: TimeSeries
        # hdop 无量纲、eph/epv 是米：它们本来就不共享单位，所以都不写 unit=（不换算），
        # 与改造前一样画在一张图上。真要较真就拆成两张图。
        ydata:
          - ref("vehicle_gps_position[0].eph", "sensor_gps[0].eph")
          - ref("vehicle_gps_position[0].epv", "sensor_gps[0].epv")
          - ref("vehicle_gps_position[0].hdop", "sensor_gps[0].hdop")
