# VIO 速度估计对照。
# 来源：Flight Review（PX4/flight_review，plot/configured_plots.py）的 P16「Visual Odometry Velocity」（VIO 五项之一）；字段语义按 PX4 uORB 消息定义（github.com/PX4/PX4-Autopilot/tree/main/msg）。
# 与上游差异：字段与口径照抄上游。

id: visual-odom-vel
title: Visual Odometry Velocity
description: 视觉里程计速度（仅当 topic 存在时显示）。
order: 14
condition:
  message: [vehicle_visual_odometry]
output:
  - container: axes
    title: Visual Odometry Velocity
    ylabel: "[m]"
    children:
      - mode: TimeSeries
        ydata:
          - vehicle_visual_odometry.vx
          - vehicle_visual_odometry.vy
          - vehicle_visual_odometry.vz
        label: ["X", "Y", "Z"]