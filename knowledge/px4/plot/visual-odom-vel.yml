id: visual-odom-vel
title: Visual Odometry Velocity
description: 视觉里程计速度（仅当 topic 存在时显示）。
order: 14
conditions:
  message: [vehicle_visual_odometry]
outputs:
  - container: axes
    title: Visual Odometry Velocity
    ylabel: "[m]"
    children:
      - mode: TimeSeries
        ydata:
          - ref("vehicle_visual_odometry[0].vx")
          - ref("vehicle_visual_odometry[0].vy")
          - ref("vehicle_visual_odometry[0].vz")
        label: ["X", "Y", "Z"]