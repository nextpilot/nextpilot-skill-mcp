id: imu-accel
title: IMU 原始加速度
description: 三轴加速度（m/s²）。旧固件可能未记录该话题。
order: 12
conditions:
  topics: ["sensor_combined || sensor_accel"]
outputs:
  - container: axes
    title: IMU 加速度
    ylabel: m/s²
    children:
      - mode: TimeSeries
        # 话题也跟着固件改过名：新固件是 sensor_combined，老固件是 sensor_accel。
        # 候选组按存在性挑 —— 与规则里"字段换代"的写法是同一件事。
        ydata:
          - ref("sensor_combined[0].accelerometer_m_s2[0]", "sensor_accel[0].accelerometer_m_s2[0]") # X
          - ref("sensor_combined[0].accelerometer_m_s2[1]", "sensor_accel[0].accelerometer_m_s2[1]") # Y
          - ref("sensor_combined[0].accelerometer_m_s2[2]", "sensor_accel[0].accelerometer_m_s2[2]") # Z