# VIO 延迟（传输/处理时延），延迟过大会导致融合发散。
# 来源：Flight Review（PX4/flight_review，plot/configured_plots.py）的 P19「Visual Odometry Latency」（VIO 五项之一）；字段语义按 PX4 uORB 消息定义（github.com/PX4/PX4-Autopilot/tree/main/msg）。
# 与上游差异：字段与口径照抄上游。

id: visual-odom-latency
title: Visual Odometry Latency
description: 视觉里程计延迟（仅当 topic 存在时显示）。
order: 17
condition:
  message: [vehicle_visual_odometry]
output:
  - container: axes
    title: Visual Odometry Latency
    ylabel: "[ms]"
    children:
      - mode: TimeSeries
        ydata:
          - vehicle_visual_odometry.latency
        label: ["VIO Latency"]