id: ekf
title: EKF 创新检验
description: 创新值与检验门限之比（≥1 表示该路观测被 EKF 拒绝），参考线 1.0。
order: 4
conditions:
  topics: [estimator_status]
outputs:
  - container: axes
    title: "estimator_status #{instance}"
    ylabel: ratio
    hlines:
      - {value: 1.0, level: critical, label: "1.0（拒绝）"}
    children:
      - mode: TimeSeries
        # 这里用"每路一条线"的平铺写法：字段在日志里不存在的那条会取到 null，
        # 前端自动不画 —— 所以老固件少了 hdg_test_ratio 只是少一条线，不必另写回退规则。
        ydata: >-
          ref("estimator_status[0].vel_test_ratio"), ref("estimator_status[0].pos_test_ratio"),
          ref("estimator_status[0].hgt_test_ratio"), ref("estimator_status[0].hdg_test_ratio"),
          ref("estimator_status[0].mag_test_ratio"), ref("estimator_status[0].tas_test_ratio"),
          ref("estimator_status[0].hagl_test_ratio"), ref("estimator_status[0].beta_test_ratio")
        label: 速度, 水平位置, 垂直高度, 航向, 磁罗盘, 空速, 离地高度, 侧滑
