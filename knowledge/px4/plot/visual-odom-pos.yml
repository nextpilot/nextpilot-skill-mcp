id: visual-odom-pos
title: Visual Odometry Position
description: 视觉里程计位置（仅当 topic 存在时显示）。
order: 13
conditions:
  message: [vehicle_visual_odometry]
outputs:
  - container: axes
    title: Visual Odometry Position
    ylabel: "[m]"
    children:
      - mode: TimeSeries
        ydata:
          - vehicle_visual_odometry.x
          - vehicle_visual_odometry.y
          - vehicle_visual_odometry.z
        label: ["X", "Y", "Z"]