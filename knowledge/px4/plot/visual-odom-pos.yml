# VIO 位置估计三轴对照。
# 来源：Flight Review（PX4/flight_review，plot/configured_plots.py）的 P15「Visual Odometry Position」（VIO 五项之一）；字段语义按 PX4 uORB 消息定义（github.com/PX4/PX4-Autopilot/tree/main/msg）。
# 与上游差异：字段与口径照抄上游。

id: visual-odom-pos
title: Visual Odometry Position
description: 视觉里程计位置（仅当 topic 存在时显示）。
order: 13
condition:
  message: [vehicle_visual_odometry]
output:
  - container: axes
    title: Visual Odometry Position
    ylabel: "[m]"
    children:
      - mode: TimeSeries
        ydata:
          - vehicle_visual_odometry.x
          - vehicle_visual_odometry.y
          - vehicle_visual_odometry.z
        label: ["X", "Y", "Z"]