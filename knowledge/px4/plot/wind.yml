id: wind
title: 风速估计
description: 估计器输出的北向/东向风速分量（m/s）。旧固件用 wind_estimate，1.15+ 用 estimator_wind。
order: 16
conditions:
  topics: ["estimator_wind || wind_estimate"]
outputs:
  - container: axes
    title: 风速
    ylabel: m/s
    children:
      - mode: TimeSeries
        ydata:
          - ref("estimator_wind[0].windspeed_north")
          - ref("estimator_wind[0].windspeed_east")
        label: [北向风速, 东向风速]