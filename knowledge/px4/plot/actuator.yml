id: actuator
title: 执行机构
description: 归一化控制量（-1..1）与 PWM 输出；控制量来自混控器，输出量是最终发给电调/舵机的信号。
order: 1
conditions:
  topics: ["actuator_controls_0 || actuator_motors || actuator_outputs"]
outputs:
  - container: axes
    title: 控制量
    ylabel: "归一化 [-1,1]"
    children:
      - mode: TimeSeries
        ydata:
          - ref("actuator_controls_0[0].control[0]")
          - ref("actuator_controls_0[0].control[1]")
          - ref("actuator_controls_0[0].control[2]")
          - ref("actuator_controls_0[0].control[3]")
        label: [Roll, Pitch, Yaw, Thrust]
  - container: axes
    title: PWM 输出
    ylabel: us
    children:
      - mode: TimeSeries
        ydata:
          - ref("actuator_outputs[0].output[0]")
          - ref("actuator_outputs[0].output[1]")
          - ref("actuator_outputs[0].output[2]")
          - ref("actuator_outputs[0].output[3]")
        label: [输出1, 输出2, 输出3, 输出4]