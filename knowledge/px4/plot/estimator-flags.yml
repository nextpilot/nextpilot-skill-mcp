# 估计器标志位时序（EKF 故障/超时/拒绝 GPS 等位图），快速定位估计器异常时段。
# 来源：Flight Review（PX4/flight_review，plot/configured_plots.py）的传感器项「Estimator Flags」构造点；字段语义按 PX4 uORB 消息定义（github.com/PX4/PX4-Autopilot/tree/main/msg）。
# 与上游差异：字段与口径照抄上游。

id: estimator-flags
title: Estimator Flags
description: EKF 健康/超时/创新检验标志位。
order: 37
condition:
  message: [estimator_status]
output:
  - container: axes
    title: Estimator Flags
    ylabel: "flag / ratio"
    children:
      - mode: TimeSeries
        ydata:
          - estimator_status.health_flags
          - estimator_status.timeout_flags
        label: ["Health Flags (vel, pos, hgt)", "Timeout Flags (vel, pos, hgt)"]
      - mode: TimeSeries
        ydata:
          - estimator_status.vel_test_ratio
          - estimator_status.pos_test_ratio
          - estimator_status.hgt_test_ratio
          - estimator_status.hdg_test_ratio
          - estimator_status.mag_test_ratio
          - estimator_status.tas_test_ratio
          - estimator_status.hagl_test_ratio
          - estimator_status.beta_test_ratio
        label:
          ["Velocity Test Ratio", "Position Test Ratio", "Height Test Ratio",
           "Heading Test Ratio", "Mag Test Ratio", "TAS Test Ratio",
           "HAGL Test Ratio", "Beta Test Ratio"]