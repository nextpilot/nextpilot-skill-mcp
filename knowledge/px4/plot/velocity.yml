# 三轴速度估计值 vs 设定值。
# 来源：Flight Review（PX4/flight_review，plot/configured_plots.py）的 P13「Velocity」；字段语义按 PX4 uORB 消息定义（github.com/PX4/PX4-Autopilot/tree/main/msg）。
# 与上游差异：字段与口径照抄上游。

id: velocity
title: Velocity
description: 三轴速度估计值与 setpoint（vx/vy/vz）。
order: 12
condition:
  message: [vehicle_local_position]
output:
  - container: axes
    title: Velocity
    ylabel: "[m/s]"
    children:
      - mode: TimeSeries
        ydata:
          - vehicle_local_position.vx
          - vehicle_local_position.vy
          - vehicle_local_position.vz
        label: ["X", "Y", "Z"]
      - mode: TimeSeries
        ydata:
          - vehicle_local_position_setpoint.vx
          - vehicle_local_position_setpoint.vy
          - vehicle_local_position_setpoint.vz
        label: ["X Setpoint", "Y Setpoint", "Z Setpoint"]