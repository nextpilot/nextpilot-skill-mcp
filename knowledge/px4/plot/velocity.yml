id: velocity
title: Velocity
description: 三轴速度估计值与 setpoint（vx/vy/vz）。
order: 12
conditions:
  message: [vehicle_local_position]
outputs:
  - container: axes
    title: Velocity
    ylabel: "[m/s]"
    children:
      - mode: TimeSeries
        ydata:
          - ref("vehicle_local_position[0].vx")
          - ref("vehicle_local_position[0].vy")
          - ref("vehicle_local_position[0].vz")
        label: ["X", "Y", "Z"]
      - mode: TimeSeries
        ydata:
          - ref("vehicle_local_position_setpoint[0].vx")
          - ref("vehicle_local_position_setpoint[0].vy")
          - ref("vehicle_local_position_setpoint[0].vz")
        label: ["X Setpoint", "Y Setpoint", "Z Setpoint"]