id: local-x
title: Local Position X
description: 局部位置 X 轴估计值与 setpoint。
order: 9
conditions:
  message: [vehicle_local_position]
outputs:
  - container: axes
    title: Local Position X
    ylabel: "[m]"
    children:
      - mode: TimeSeries
        ydata:
          - vehicle_local_position.x
        label: ["X Estimated"]
      - mode: TimeSeries
        ydata:
          - vehicle_local_position_setpoint.x
        label: ["X Setpoint"]