# IMU/气压计/电池温度时序，看温漂背景（IMU 零偏漂移常按温度解释）。
# 来源：Flight Review（PX4/flight_review，plot/configured_plots.py）的传感器项「Temperature」构造点；字段语义按 PX4 uORB 消息定义（github.com/PX4/PX4-Autopilot/tree/main/msg）。
# 与上游差异：字段与口径照抄上游。

id: temperature
title: Temperature
description: 传感器温度：Baro / Accel / Airspeed / Battery / ESC。
order: 36
condition:
  message: [sensor_baro]
output:
  - container: axes
    title: Temperature
    ylabel: "[C]"
    children:
      - mode: TimeSeries
        ydata:
          - sensor_baro.temperature
          - sensor_accel.temperature
        label: ["Baro temperature", "Accel temperature"]
      - mode: TimeSeries
        ydata:
          - airspeed.air_temperature_celsius
        label: ["Airspeed temperature"]
      - mode: TimeSeries
        ydata:
          - battery_status.temperature
        label: ["Battery temperature"]