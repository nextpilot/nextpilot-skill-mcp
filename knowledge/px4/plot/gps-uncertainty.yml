# GPS 精度指标（eph/epv/卫星数/PDOP），看定位质量随时间的变化。
# 来源：Flight Review（PX4/flight_review，plot/configured_plots.py）的传感器项「GPS Uncertainty」构造点；字段语义按 PX4 uORB 消息定义（github.com/PX4/PX4-Autopilot/tree/main/msg）。
# 与上游差异：字段与口径照抄上游。

id: gps-uncertainty
title: GPS Uncertainty
description: GPS 不确定度：eph / epv / hdop / vdop / s_variance_m_s / satellites_used / fix_type。
order: 32
condition:
  message: ["vehicle_gps_position || sensor_gps"]
output:
  - container: axes
    title: GPS Uncertainty
    ylabel: "value"
    children:
      - mode: TimeSeries
        ydata:
          - _ref("vehicle_gps_position.eph", "sensor_gps.eph")
          - _ref("vehicle_gps_position.epv", "sensor_gps.epv")
          - _ref("vehicle_gps_position.hdop", "sensor_gps.hdop")
          - _ref("vehicle_gps_position.vdop", "sensor_gps.vdop")
          - _ref("vehicle_gps_position.s_variance_m_s", "sensor_gps.s_variance_m_s")
          - _ref("vehicle_gps_position.satellites_used", "sensor_gps.satellites_used")
          - _ref("vehicle_gps_position.fix_type", "sensor_gps.fix_type")
        label:
          ["Horizontal position accuracy [m]", "Vertical position accuracy [m]",
           "Horizontal dilution of precision [m]", "Vertical dilution of precision [m]",
           "Speed accuracy [m/s]", "Num Satellites used", "GPS Fix"]