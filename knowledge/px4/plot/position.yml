id: position
title: Position
description: 2D 位置轨迹（vehicle_local_position y vs x），及 setpoint、GPS setpoint。
order: 1
condition:
  message: 
  - vehicle_local_position
  - vehicle_local_position_setpoint
  # - vehicle_local_position_groundtruth
output:
  - container: axes
    title: 位置 2D 轨迹
    ylabel: "[m]"
    xlabel: "[m]"
    children:
      - mode: xyplot
        ydata:
          - vehicle_local_position.y
        xdata: vehicle_local_position.x
        label:
          - Estimated
      - mode: xyplot
        ydata:
          - vehicle_local_position_setpoint.y
        xdata: vehicle_local_position_setpoint.x
        label:
          - Setpoint