id: airspeed
title: Airspeed
description: 地速 / 真空速 / 指示空速与 GPS 地速、空速 setpoint。
order: 18
conditions:
  message: ["airspeed || airspeed_validated || vehicle_global_position"]
outputs:
  - container: axes
    title: Airspeed
    ylabel: "[m/s]"
    children:
      - mode: TimeSeries
        ydata:
          - _ref("airspeed_validated.true_airspeed_m_s", "airspeed.indicated_airspeed_m_s")
          - airspeed.indicated_airspeed_m_s
        label: ["True Airspeed", "Indicated Airspeed"]
      - mode: TimeSeries
        ydata:
          - _ref("vehicle_gps_position.vel_m_m_s", "vehicle_gps_position.vel_m_s")
        label: ["Ground Speed (from GPS)"]