id: pitch-angle
title: Pitch Angle
description: Pitch 欧拉角估计值与 setpoint、groundtruth。
order: 5
condition:
  message: [vehicle_attitude]
compute:
  - roll, pitch, yaw = quat_to_euler(vehicle_attitude.q)
output:
  - container: axes
    title: Pitch Angle
    ylabel: deg
    children:
      - mode: TimeSeries
        ydata:
          - pitch
        label: ["Pitch Estimated"]
      - mode: TimeSeries
        ydata:
          - vehicle_attitude_setpoint.pitch_d
        label: ["Pitch Setpoint"]