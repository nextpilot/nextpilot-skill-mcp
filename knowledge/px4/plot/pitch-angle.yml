id: pitch-angle
title: Pitch Angle
description: Pitch 欧拉角估计值与 setpoint、groundtruth。
order: 5
conditions:
  topics: [vehicle_attitude]
compute:
  - roll, pitch, yaw = quat_to_euler(vehicle_attitude.q)
outputs:
  - container: axes
    title: Pitch Angle
    ylabel: deg
    children:
      - mode: TimeSeries
        ydata:
          - pitch
        label: ["Pitch Estimated"]
      - mode: TimeSeries
        ydata:
          - ref("vehicle_attitude_setpoint[0].pitch_d")
        label: ["Pitch Setpoint"]