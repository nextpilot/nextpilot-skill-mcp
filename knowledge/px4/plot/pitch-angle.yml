# 俯仰角估计值 vs 设定值（四元数解算）。
# 来源：Flight Review（PX4/flight_review，plot/configured_plots.py）的 P5「Pitch Angle」；字段语义按 PX4 uORB 消息定义（github.com/PX4/PX4-Autopilot/tree/main/msg）。
# 与上游差异：字段与口径照抄上游（真值并入候选组）。

id: pitch-angle
title: Pitch Angle
description: Pitch 欧拉角估计值与 setpoint、groundtruth。
order: 5
condition:
  message: [vehicle_attitude]
compute:
  - roll, pitch, yaw = quat_to_euler(vehicle_attitude.q)
output:
  - container: axes
    title: Pitch Angle
    ylabel: deg
    children:
      - mode: TimeSeries
        ydata:
          - pitch
        label: ["Pitch Estimated"]
      - mode: TimeSeries
        ydata:
          - vehicle_attitude_setpoint.pitch_d
        label: ["Pitch Setpoint"]