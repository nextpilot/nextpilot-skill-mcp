# 偏航角估计 vs 设定值（含前馈 yaw_sp_move_rate）。
# 来源：Flight Review（PX4/flight_review，plot/configured_plots.py）的 P6「Yaw Angle」；字段语义按 PX4 uORB 消息定义（github.com/PX4/PX4-Autopilot/tree/main/msg）。
# 与上游差异：字段与口径照抄上游。

id: yaw-angle
title: Yaw Angle
description: Yaw 欧拉角估计值与 setpoint、FF。
order: 7
condition:
  message: [vehicle_attitude]
compute:
  - roll, pitch, yaw = quat_to_euler(vehicle_attitude.q)
output:
  - container: axes
    title: Yaw Angle
    ylabel: deg
    children:
      - mode: TimeSeries
        ydata:
          - yaw
        label: ["Yaw Estimated"]
      - mode: TimeSeries
        ydata:
          - vehicle_attitude_setpoint.yaw_d
        label: ["Yaw Setpoint"]
      - mode: TimeSeries
        ydata:
          - vehicle_attitude_setpoint.yaw_sp_move_rate
        label: ["Yaw FF Setpoint [deg/s]"]