# GPS 噪声与干扰指标（jamming/noise per ms），排查 GPS 被干扰或天线问题。
# 来源：Flight Review（PX4/flight_review，plot/configured_plots.py）的传感器项「GPS Noise & Jamming」构造点；字段语义按 PX4 uORB 消息定义（github.com/PX4/PX4-Autopilot/tree/main/msg）。
# 与上游差异：字段与口径照抄上游。

id: gps-noise
title: GPS Noise & Jamming
description: GPS 噪声与干扰指示器。
order: 33
condition:
  message: ["vehicle_gps_position || sensor_gps"]
output:
  - container: axes
    title: GPS Noise & Jamming
    ylabel: "value"
    children:
      - mode: TimeSeries
        ydata:
          - _ref("vehicle_gps_position.noise_per_ms", "sensor_gps.noise_per_ms")
          - _ref("vehicle_gps_position.jamming_indicator", "sensor_gps.jamming_indicator")
        label: ["Noise per ms", "Jamming Indicator"]