# 降采样后的原始加速度（sensor_combined），看振动量级与碰撞冲击。
# 来源：Flight Review（PX4/flight_review，plot/configured_plots.py）的振动项「Raw Acceleration」构造点；字段语义按 PX4 uORB 消息定义（github.com/PX4/PX4-Autopilot/tree/main/msg）。
# 与上游差异：字段与口径照抄上游。

id: raw-accel
title: Raw Acceleration
description: 传感器原始加速度（sensor_combined.accelerometer_m_s2）。
order: 25
condition:
  message: [sensor_combined]
output:
  - container: axes
    title: Raw Acceleration
    ylabel: "[m/s^2]"
    children:
      - mode: TimeSeries
        ydata:
          - sensor_combined.accelerometer_m_s2[0]
          - sensor_combined.accelerometer_m_s2[1]
          - sensor_combined.accelerometer_m_s2[2]
        label: ["X", "Y", "Z"]