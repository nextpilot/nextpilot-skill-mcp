# 角速度幅度谱（FFT 线图）。
# 来源：Flight Review（PX4/flight_review，plot/configured_plots.py）的 V13 姊妹口径（频谱分析族）；字段语义按 PX4 uORB 消息定义（github.com/PX4/PX4-Autopilot/tree/main/msg）。
# 与上游差异：本仓 spectrum 实现；IMU_GYRO_CUTOFF / IMU_GYRO_NF_FREQ 参数标线（解不出则消失）。

id: spectrum-angular-velocity
title: Angular Velocity FFT
description: >
  角速度三轴的幅度谱（上游 DataPlotFFT 口径：无窗、2/N 归一、fs<100Hz 不画）。
  对照 IMU_GYRO_CUTOFF / IMU_GYRO_NF_FREQ 参数线看陀螺滤波器与陷波器实际落点。
order: 44
condition:
  message: [vehicle_angular_velocity]
compute:
  - wx = vehicle_angular_velocity.xyz[0]
  - wy = vehicle_angular_velocity.xyz[1]
  - wz = vehicle_angular_velocity.xyz[2]
  - f, px = spectrum(wx, norm="amplitude", window="none", min_fs=100)
  - f, py = spectrum(wy, norm="amplitude", window="none", min_fs=100)
  - f, pz = spectrum(wz, norm="amplitude", window="none", min_fs=100)
output:
  - container: spectrum
    title: Angular Velocity FFT
    ylabel: Amplitude
    xlabel: Hz
    ymax: 0.01
    vlines:
      - param: IMU_GYRO_CUTOFF
        label: IMU_GYRO_CUTOFF
      - param: IMU_GYRO_NF_FREQ
        label: IMU_GYRO_NF_FREQ
    children:
      - mode: spectrum
        ydata: [px, py, pz]
        label: ["Rollspeed", "Pitchspeed", "Yawspeed"]
