# 姿态跟踪超调 / 振荡（F006）：只统计 armed 且非悬停的机动段，避免把悬停微调当作超调。
# 跟踪误差阈值按机型区分：固定翼在手动/机动段天然误差更大，用更宽门限。
# 阈值 [暂定]：旋翼 15/30、固定翼 25/40、振荡 4 Hz、最少 50 样本。
# 说明：原实现一次最多发两条 finding（超调 + 振荡），因此拆成两条经验、同 group 顺序执行。
# 对齐/掩码/统计全在 att_tracking_stats 一个复合算子里（原先是 30 个节点串起来）。
# 边界：姿态或指令字段缺失时本经验静默不适用（原实现会留一条 skip；该路径未被基线覆盖）。

id: px4-attitude-overshoot
name: 姿态跟踪超调
group: attitude_tracking
order: 1
version: 1.1.0

# 原外层条件：两个 topic 齐备且存在 armed 段，否则静默（skip 已退役，见 ../CLAUDE.md）
tag: attitude_overshoot

condition:
  message:
    - vehicle_attitude
    - vehicle_attitude_setpoint
# 原实现把 ran() 放在“机动段样本足够”之后
ran_when: "seg_ok"

compute:
  # 复合算子：姿态/指令对齐 → armed 且非悬停掩码 → 跟踪误差 p99 与过零频率
  - >-
    p99, osc_hz, seg_n = _try(att_tracking_stats(
      att_q=vehicle_attitude.q,
      # 指令源：两路都给，**有 q_d 就用 q_d**（新版只记它），没有才回退 roll/pitch_body。
      # 顺序由算子定，规则不用管版本——按存在性挑，不按版本号挑。
      sp_q=vehicle_attitude_setpoint.q_d,
      sp_roll=vehicle_attitude_setpoint.roll_body,
      sp_pitch=vehicle_attitude_setpoint.pitch_body,
      att_ts=vehicle_attitude.timestamp,
      sp_ts=vehicle_attitude_setpoint.timestamp,
      intervals=ARMED_INTERVALS,
      tilt_min_deg=10.0, min_samples=50, sample_rate=50))
  # 样本不足（<= 50）或核心数据缺失（seg_n 为 None）都不出结论：统计量与 finding
  # 都由这个开关把住；ran_when 也引用它（所以必须是个具名变量，不能写成内联条件）
  - seg_ok = seg_n > 50 if seg_n else False
  - p99_stat = p99 if seg_ok else None
  - osc_stat = osc_hz if seg_ok else None

output:
  - name: attitudeErrDegP99
    value: p99_stat
    round: 1
  - name: attitudeOscHz
    value: osc_stat
    round: 2

trigger:
  - when: "p99_stat >= 40.0 and VEHICLE == 'fixed_wing'"
    label: attitude_overshoot
    severity: critical
    suggestion: "结合故障库 F006：检查姿态环增益、机架共振；避免直接大幅降 PID。"
    description: 姿态跟踪误差过大（p99 {p99_stat:.1f}°）
    evidence:
      source: vehicle_attitude vs vehicle_attitude_setpoint（机动段）
      value: f"{p99_stat:.1f}"
      threshold: 25
      unit: °
  - when: "p99_stat >= 25.0 and VEHICLE == 'fixed_wing'"
    label: attitude_overshoot
    severity: warning
    suggestion: "结合故障库 F006 排查；大风环境下优先归因环境扰动。"
    description: 姿态跟踪误差偏大（p99 {p99_stat:.1f}°）
    evidence:
      source: vehicle_attitude vs vehicle_attitude_setpoint（机动段）
      value: f"{p99_stat:.1f}"
      threshold: 25
      unit: °
  - when: "p99_stat >= 30.0 and not VEHICLE == 'fixed_wing'"
    label: attitude_overshoot
    severity: critical
    suggestion: "结合故障库 F006：检查姿态环增益、机架共振；避免直接大幅降 PID。"
    description: 姿态跟踪误差过大（p99 {p99_stat:.1f}°）
    evidence:
      source: vehicle_attitude vs vehicle_attitude_setpoint（机动段）
      value: f"{p99_stat:.1f}"
      threshold: 15
      unit: °
  - when: "p99_stat >= 15.0 and not VEHICLE == 'fixed_wing'"
    label: attitude_overshoot
    severity: warning
    suggestion: "结合故障库 F006 排查；大风环境下优先归因环境扰动。"
    description: 姿态跟踪误差偏大（p99 {p99_stat:.1f}°）
    evidence:
      source: vehicle_attitude vs vehicle_attitude_setpoint（机动段）
      value: f"{p99_stat:.1f}"
      threshold: 15
      unit: °
