# 姿态跟踪超调 / 振荡（F006）：只统计 armed 且非悬停的机动段，避免把悬停微调当作超调。
# 跟踪误差阈值按机型区分：固定翼在手动/机动段天然误差更大，用更宽门限。
# 阈值 [暂定]：旋翼 15/30、固定翼 25/40、振荡 4 Hz、最少 50 样本。
# 说明：原实现一次最多发两条 finding（超调 + 振荡），因此拆成两条经验、同 slot 顺序执行。
# 对齐/掩码/统计全在 att_tracking_stats 一个复合算子里（原先是 30 个节点串起来）。
# 边界：姿态或指令字段缺失时本经验静默不适用（原实现会留一条 skip；该路径未被基线覆盖）。

id: px4-attitude-overshoot
slot: attitude_tracking
order: 1
name: 姿态跟踪超调
version: 1.1.0
category: attitude
status: stable
author: {name: NextPilot 内置}
license: CC-BY-4.0
changelog:
  - {version: 1.0.0, date: "2026-09-15", note: "从 ulog_checks.py 迁出，逻辑与阈值不变"}
  - {version: 1.1.0, date: "2026-09-15", note: "30 个节点收成一个复合算子 att_tracking_stats"}

firmware: any
airframe: any
# 原外层条件：两个 topic 齐备且存在 armed 段，否则记一条 skip
requires:
  all_of: [vehicle_attitude, vehicle_attitude_setpoint]
skip_reason: vehicle_attitude(_setpoint) 或 armed 段缺失
not_applicable: {when: "not has_armed", skip_reason: vehicle_attitude(_setpoint) 或 armed 段缺失}
# 原实现把 ran() 放在“机动段样本足够”之后
ran_when: "seg_ok"

compute:
  # 复合算子：姿态/指令对齐 → armed 且非悬停掩码 → 跟踪误差 p99 与过零频率
  - out: [p99, osc_hz, seg_n]
    in:
      - vehicle_attitude.q
      - vehicle_attitude_setpoint.q_d
      - vehicle_attitude_setpoint.roll_body
      - vehicle_attitude_setpoint.pitch_body
      - vehicle_attitude.timestamp
      - vehicle_attitude_setpoint.timestamp
      - armed_intervals
      - fw_minor
    op: att_tracking_stats
    optional: true
    tilt_min_deg: 10.0
    min_samples: 50
    sample_rate: 50
  - {out: seg_ok, in: [seg_n, 50], op: gt, optional: true}
  # 样本不足就不出结论：统计量与 finding 都由这个开关把住
  - {out: p99_stat, in: [seg_ok, p99], op: value_if, optional: true}
  - {out: osc_stat, in: [seg_ok, osc_hz], op: value_if, optional: true}

triggers:
  - expr: "p99_stat >= 40.0 and is_fixed_wing"
    severity: critical
    tag: attitude_overshoot
    threshold: 25.0
    value: p99_stat
    round: 1
    unit: "°"
    field: "vehicle_attitude vs vehicle_attitude_setpoint（机动段）"
    title: "姿态跟踪误差过大（p99 {p99_stat:.1f}°）"
    suggestion: "结合故障库 F006：检查姿态环增益、机架共振；避免直接大幅降 PID。"
  - expr: "p99_stat >= 25.0 and is_fixed_wing"
    severity: warning
    tag: attitude_overshoot
    threshold: 25.0
    value: p99_stat
    round: 1
    unit: "°"
    field: "vehicle_attitude vs vehicle_attitude_setpoint（机动段）"
    title: "姿态跟踪误差偏大（p99 {p99_stat:.1f}°）"
    suggestion: "结合故障库 F006 排查；大风环境下优先归因环境扰动。"
  - expr: "p99_stat >= 30.0 and not is_fixed_wing"
    severity: critical
    tag: attitude_overshoot
    threshold: 15.0
    value: p99_stat
    round: 1
    unit: "°"
    field: "vehicle_attitude vs vehicle_attitude_setpoint（机动段）"
    title: "姿态跟踪误差过大（p99 {p99_stat:.1f}°）"
    suggestion: "结合故障库 F006：检查姿态环增益、机架共振；避免直接大幅降 PID。"
  - expr: "p99_stat >= 15.0 and not is_fixed_wing"
    severity: warning
    tag: attitude_overshoot
    threshold: 15.0
    value: p99_stat
    round: 1
    unit: "°"
    field: "vehicle_attitude vs vehicle_attitude_setpoint（机动段）"
    title: "姿态跟踪误差偏大（p99 {p99_stat:.1f}°）"
    suggestion: "结合故障库 F006 排查；大风环境下优先归因环境扰动。"

emit:
  check: attitude_tracking
  tag: attitude_overshoot
  doc: https://docs.px4.io/main/en/log/flight_log_analysis.html
  stats:
    attitudeErrDegP99: {var: p99_stat, round: 1}
    attitudeOscHz: {var: osc_stat, round: 2}
