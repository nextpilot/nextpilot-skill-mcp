# 飞行中单电芯持续压降（robotto）：armed 段剔除起飞冲击前 5s，头段中位 − 尾段中位。
# 时序切窗是通用能力：rows_aggregate 把数组字段归约成时间序列，head_tail_median_drop
# 对任意 (序列, 时间戳, 区间) 计算头/尾中位数落差。

id: px4-power-sag
name: 飞行中持续压降
group: battery
order: 2

firmware: "True"
airframe: "True"
skip:
  - {when: "not has_topic('battery_status')", reason: battery_status not in log}

compute:
  # 每个时刻各电芯最低电压（0 是未接占位 → NaN）
  - cell_min_t = rows_aggregate(battery_status.voltage_cell_v, agg="min", gt=0)
  # 第一个 armed 区间、跳过前 5s；段长 <=20 或数据不足时算子返回 None（不默认段）
  - >-
      drop, tail = head_tail_median_drop(cell_min_t, battery_status.timestamp,
      armed_intervals, skip_first_s=5, min_seg=20)

outputs:
  tag: battery_voltage_drop
  stats:
    batteryCellSagFlight: {var: drop, round: 3}

# 阈值 [暂定]：drop >= 0.30 V 且尾段中位已低于单电芯告警线 3.70 V
triggers:
  - when: "drop >= 0.30 and tail < 3.70"
    severity: warning
    threshold: 0.30
    value: f"{drop:.3f}"
    unit: V
    field: "battery_status.voltage_cell_v[] armed 段趋势"
    title: "飞行中单电芯持续压降 {drop:.2f} V（尾段中位 {tail:.2f} V）"
    suggestion: "持续压降区别于大机动瞬时压降：排查电芯老化内阻、插头虚接、线缆线径与负载匹配。"
