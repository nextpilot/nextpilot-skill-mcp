# GPS 卫星数（F002 相关）：全程最小值。阈值 [暂定] px4-thresholds.toml [gps]：sats_crit=6。
# 注意：证据里的 threshold 用 sats_warn（8）——这是迁移前就有的写法，为保持等价按原样保留。

id: px4-gps-sats
name: GPS 卫星数
group: gps_health
order: 2

conditions:
  message:
    - vehicle_gps_position

compute:
  - s_min = min(vehicle_gps_position.satellites_used)

outputs:
  - name: gpsSatellitesMin
    value: s_min

triggers:
  - when: "s_min <= 6"
    severity: warning
    suggestion: "卫星数不足时定位易跳变；排查遮挡与天线。"
    description: GPS 卫星数最少仅 {s_min} 颗
    evidence:
      source: vehicle_gps_position.satellites_used(min)
      value: s_min
      threshold: 8
      unit: 颗
    label: gps_eph_high
tag: gps_eph_high
