# 电池剩余电量（robotto）：armed 全程最低值，-1 表示未知需过滤

id: px4-power-remaining

name: 电池剩余电量

group: battery

order: 3                 # battery group 内的次序：cell-voltage=1, sag=2, remaining=3

firmware: "True"

airframe: "True"

skip:
  - {when: "not has_topic('battery_status')", reason: battery_status not in log}

compute:
  - rem = min_ge(battery_status.remaining, ge=0)      # remaining ∈ [0,1]，-1 = 未知，滤掉
  - rem_pct = rem * 100

outputs:
  tag: battery_voltage_drop
  stats:
    batteryRemainingMin: {var: rem, round: 3}

triggers:
  - when: "rem <= 0.10"
    severity: critical
    threshold: 0.10
    value: f"{rem:.3f}"
    field: "battery_status.remaining(min)"
    title: "电池剩余电量极低（{rem_pct:.0f}%）"
    suggestion: "剩余电量低于 10%，应立即返航；检查电量估算与电池健康。"
  - when: "rem <= 0.20"
    severity: warning
    threshold: 0.20
    value: f"{rem:.3f}"
    field: "battery_status.remaining(min)"
    title: "电池剩余电量偏低（{rem_pct:.0f}%）"
    suggestion: "剩余电量低于 20%，注意返航裕度。"
