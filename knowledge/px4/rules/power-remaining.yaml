# 电池剩余电量（robotto）：armed 全程最低值，-1 表示未知需过滤

id: px4-power-remaining
name: 电池剩余电量
group: battery
order: 3 # battery group 内的次序：cell-voltage=1, sag=2, remaining=3

conditions:
  message:
    - battery_status

compute:
  # remaining ∈ [0,1]，-1 = 未知，滤掉。**只看第 0 块电池**（见 power-cell-voltage 的说明）
  - rem = min_ge(battery_status.remaining, ge=0)
  - rem_pct = rem * 100

outputs:
  - name: batteryRemainingMin
    value: rem
    round: 3

triggers:
  - when: "rem <= 0.10"
    severity: critical
    suggestion: "剩余电量低于 10%，应立即返航；检查电量估算与电池健康。"
    description: 电池剩余电量极低（{rem_pct:.0f}%）
    evidence:
      source: battery_status.remaining(min)
      value: f"{rem:.3f}"
      threshold: 0.1
  - when: "rem <= 0.20"
    severity: warning
    suggestion: "剩余电量低于 20%，注意返航裕度。"
    description: 电池剩余电量偏低（{rem_pct:.0f}%）
    evidence:
      source: battery_status.remaining(min)
      value: f"{rem:.3f}"
      threshold: 0.2
tag: battery_voltage_drop
