# GPS 水平位置误差（F002 相关）：eph 单位 mm（PX4 vehicle_gps_position.eph），先转 m 再取 p95。
# 阈值 [暂定] px4-thresholds.toml [gps]：eph_warn=5.0 / eph_crit=10.0（m）。

id: px4-gps-eph
name: GPS 水平位置误差
group: gps_health
order: 1                 # gps_health group 内次序：eph=1, sats=2, jump=3

conditions:
  topics:
    - vehicle_gps_position

compute:
  # 数据缺失/全为 0 时整条规则中止（不写 stats、不发 finding），与原过程式一致
  - eph_pos = keep_gt(vehicle_gps_position.eph, gt=0)
  - eph_m = eph_pos * 0.001        # mm → m
  - e_p95 = percentile(eph_m, p=95)
  - e_max = max(eph_m)

outputs:
  tag: gps_eph_high
  stats:
    gpsEphP95M: {var: e_p95, round: 2}
    gpsEphMaxM: {var: e_max, round: 2}

triggers:
  - when: "e_p95 >= 10.0"
    severity: warning
    tag: gps_eph_high
    threshold: 10.0
    value: f"{e_p95:.2f}"
    unit: m
    field: "vehicle_gps_position.eph(armed p95)"
    title: "GPS 水平位置误差持续偏大（p95 {e_p95:.1f} m）"
    suggestion: "结合故障库 F002：排查天线电磁干扰/遮挡/馈线虚接/多路径。"
  - when: "e_p95 >= 5.0"
    severity: info
    tag: gps_eph_high
    threshold: 5.0
    value: f"{e_p95:.2f}"
    unit: m
    field: "vehicle_gps_position.eph(armed p95)"
    title: "GPS 水平位置误差偶发偏大（p95 {e_p95:.1f} m）"
    suggestion: "关注天线安装位置与遮挡。"
