# GPS 水平位置误差（F002 相关）：eph 单位 mm（PX4 vehicle_gps_position.eph），先转 m 再取 p95。
# 阈值 [暂定] px4-thresholds.toml [gps]：eph_warn=5.0 / eph_crit=10.0（m）。

id: px4-gps-eph
name: GPS 水平位置误差
group: gps_health
order: 1 # gps_health group 内次序：eph=1, sats=2, jump=3
tag: gps_eph_high

condition:
  message:
    - vehicle_gps_position

compute:
  # 数据缺失/全为 0 时整条规则中止（不写 stats、不发 finding），与原过程式一致
  - eph_pos = vehicle_gps_position.eph[vehicle_gps_position.eph > 0]
  - eph_m = eph_pos * 0.001 # mm → m
  - e_p95 = percentile(eph_m, p=95)
  - e_max = max(eph_m)

output:
  - name: gpsEphP95M
    value: e_p95
    round: 2
  - name: gpsEphMaxM
    value: e_max
    round: 2

trigger:
  - when: "e_p95 >= 10.0"
    label: gps_eph_high
    severity: warning
    suggestion: "结合故障库 F002：排查天线电磁干扰/遮挡/馈线虚接/多路径。"
    description: GPS 水平位置误差持续偏大（p95 {e_p95:.1f} m）
    evidence:
      source: vehicle_gps_position.eph(armed p95)
      value: f"{e_p95:.2f}"
      threshold: 10
      unit: m
  - when: "e_p95 >= 5.0"
    label: gps_eph_high
    severity: info
    suggestion: "关注天线安装位置与遮挡。"
    description: GPS 水平位置误差偶发偏大（p95 {e_p95:.1f} m）
    evidence:
      source: vehicle_gps_position.eph(armed p95)
      value: f"{e_p95:.2f}"
      threshold: 5
      unit: m
