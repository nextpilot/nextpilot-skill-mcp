# 风扰估计（F010）：北/东风分量合成风速取 p95。1.15 起 topic 改名 estimator_wind，
# 旧固件为 wind_estimate —— 两者用 coalesce 取先有的那个（新 topic 在旧固件本就不存在）。
# 阈值 [暂定] px4-thresholds.toml [wind]：speed_warn=8.0 / speed_crit=12.0（m/s）。
# 命中即打 guard 标签 wind_strong：解释姿态类异常时优先归因环境扰动。

# 来源：本仓检查设计（对应 fault-kb F010 风扰关联标签）。
# 与上游差异：上游无对应检查；1.15 topic 改名（wind_estimate → estimator_wind）用 coalesce 兼容为本仓处理，8/12 m/s [暂定]。
id: px4-wind-estimate
name: 风扰估计
group: wind_estimate
order: 1
tag: wind_disturb

condition:
  message:
    - estimator_wind || wind_estimate

compute:
  # 1.15 起这个量在日志里的 topic 叫 estimator_wind，之前叫 wind_estimate——**候选组**
  # 按存在性取（实测两者从不同时出现，所以"有谁用谁"就是原来的版本分流）。
  # 上游另有一个叫 wind 的 topic：字典按 .msg 文件名收录，与日志 topic 名不是一一对应，
  # 别按名字猜。缺任一路（两个 topic 都没有）时 hypot 得 None、w_p95 也是 None → 不出结论。
  # **只看第 0 个估计器实例**：不写下标也是第 0 个，这里写明是为了跟"跨实例取最差"区分开。
  - >-
    w_p95 = percentile(
      np.hypot(coalesce(estimator_wind.windspeed_north,
                     wind_estimate.windspeed_north),
            coalesce(estimator_wind.windspeed_east,
                     wind_estimate.windspeed_east)),
      p=95)

output:
  - name: windSpeedP95M
    value: w_p95
    round: 1

trigger:
  - when: "w_p95 >= 12.0"
    label: wind_disturb
    severity: warning
    suggestion: "结合故障库 F010：强风属环境扰动，姿态超调/转换越限优先归因风，不要直接改 PID。"
    description: 估计风速较大（p95 {w_p95:.1f} m/s）
    evidence:
      source: estimator_wind.windspeed_north/east
      value: f"{w_p95:.1f}"
      threshold: 8
      unit: m/s
  - when: "w_p95 >= 8.0"
    label: wind_disturb
    severity: info
    suggestion: "解释姿态类异常时需考虑风扰因素。"
    description: 估计风速偏大（p95 {w_p95:.1f} m/s）
    evidence:
      source: estimator_wind.windspeed_north/east
      value: f"{w_p95:.1f}"
      threshold: 8
      unit: m/s
  - when: w_p95 >= 8.0
    label: wind_strong
    severity: guard
    description: "Data quality: wind_strong"
    evidence:
      source: ""
