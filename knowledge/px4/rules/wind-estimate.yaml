# 风扰估计（F010）：北/东风分量合成风速取 p95。Wind.msg 官方声明**双 TOPICS**
# （文件尾 `# TOPICS wind estimator_wind`，v1.12.3 与 main 一致）——日志里实际出现哪个名
# 随固件与 EKF2 配置：实测 v1.6 日志是 wind_estimate，estimator_wind 名义上同源。
# 两者用 coalesce 取先有的那个（谁在日志里用谁）。
# 阈值 [暂定] px4-thresholds.toml [wind]：speed_warn=8.0 / speed_crit=12.0（m/s）。
# 命中即打 guard 标签 wind_strong：解释姿态类异常时优先归因环境扰动。

# 来源：本仓检查设计（对应 fault-kb F010 风扰关联标签）。
# 与上游差异：上游无对应检查；Wind.msg 双 TOPICS 名（wind/estimator_wind）与老日志的
# wind_estimate 用 coalesce 兼容为本仓处理，8/12 m/s [暂定]。
id: px4-wind-estimate
name: 风扰估计
group: wind_estimate
order: 1
tag: wind_disturb

condition:
  message:
    - estimator_wind || wind_estimate

compute:
  # Wind.msg 双 TOPICS（wind / estimator_wind）加老日志的 wind_estimate——**候选组**
  # 按存在性取（实测不会同时出现，"有谁用谁"就是原来的版本分流）。
  # 字典按 .msg 文件名收录（键是 wind），校验侧经 topic-map.yaml 把 estimator_wind 映射过去；
  # 缺任一路（所有候选都没有）时 hypot 得 None、w_p95 也是 None → 不出结论。
  # **只看第 0 个估计器实例**：不写下标也是第 0 个，这里写明是为了跟"跨实例取最差"区分开。
  - >-
    w_p95 = percentile(
      np.hypot(coalesce(estimator_wind.windspeed_north,
                     wind_estimate.windspeed_north),
            coalesce(estimator_wind.windspeed_east,
                     wind_estimate.windspeed_east)),
      p=95)

output:
  - name: windSpeedP95M
    value: w_p95
    round: 1

trigger:
  - when: "w_p95 >= 12.0"
    label: wind_disturb
    severity: warning
    suggestion: "结合故障库 F010：强风属环境扰动，姿态超调/转换越限优先归因风，不要直接改 PID。"
    description: 估计风速较大（p95 {w_p95:.1f} m/s）
    evidence:
      source: estimator_wind.windspeed_north/east
      value: f"{w_p95:.1f}"
      threshold: 8
      unit: m/s
  - when: "w_p95 >= 8.0"
    label: wind_disturb
    severity: info
    suggestion: "解释姿态类异常时需考虑风扰因素。"
    description: 估计风速偏大（p95 {w_p95:.1f} m/s）
    evidence:
      source: estimator_wind.windspeed_north/east
      value: f"{w_p95:.1f}"
      threshold: 8
      unit: m/s
  - when: w_p95 >= 8.0
    label: wind_strong
    severity: guard
    description: "Data quality: wind_strong"
    evidence:
      source: ""
