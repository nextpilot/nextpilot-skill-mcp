# 单电芯最低电压（robotto）：优先实测电芯电压；日志没有电芯数组时回退 总压/电芯数；
# 两者都没有但有总压时给 info。取数与回退链收在 cell_voltage_min 一个算子里；
# 字段名、阈值与文案仍由本文件给出。

id: px4-power-cell-voltage
name: 单电芯电压
group: battery
order: 1 # battery group 内次序：cell-voltage=1, sag=2, remaining=3
version: 1.1.0

conditions:
  message:
    - battery_status

compute:
  # 总压最小值 / 实测单芯最低值 / 回退值 / 芯数 / 两条分支标志 —— 一个算子一次算齐。
  # **只看第 0 块电池**：不写下标也是第 0 个，但这里写明——"跨电池取最差"是另一件事，
  # 要显式写 `[:]` 交给会分组的算子，别让人以为漏了；
  # 要跨电池取最差得让算子吃 `[−1]` 的分组输入（见 CLAUDE.md 的已知缺口）。
  - >-
    vmin, cell_min, cells, have_measured, have_fallback, no_cell = _try(cell_voltage_min( battery_status.voltage_cell_v, battery_status.voltage_v, battery_status.voltage_filtered_v, battery_status.cell_count))

outputs:
  - name: batteryVoltageMin
    value: vmin
    round: 2
  - name: batteryCellCount
    value: cells
  - name: batteryCellVoltageMin
    value: cell_min
    round: 3

# 阈值 [暂定]：单电芯最低电压 V（crit 3.55 / warn 3.70）
triggers:
  - when: "have_measured and cell_min < 3.55"
    severity: critical
    suggestion: "存在过放风险，检查电池老化、放电倍率匹配与低压告警阈值。"
    description: 电芯电压严重过低
    evidence:
      source: battery_status.voltage_cell_v[](实测最小值)
      value: f"{cell_min:.3f}"
      threshold: 3.55
      unit: V/cell
  - when: "have_fallback and not have_measured and cell_min < 3.55"
    severity: critical
    suggestion: "存在过放风险，检查电池老化、放电倍率匹配与低压告警阈值。"
    description: 电芯电压严重过低
    evidence:
      source: battery_status.voltage_v(min)/cell_count
      value: f"{cell_min:.3f}"
      threshold: 3.55
      unit: V/cell
  - when: "have_measured and cell_min < 3.70"
    severity: warning
    suggestion: "建议核对剩余容量估计与返航电压裕度。"
    description: 电芯电压偏低
    evidence:
      source: battery_status.voltage_cell_v[](实测最小值)
      value: f"{cell_min:.3f}"
      threshold: 3.7
      unit: V/cell
  - when: "have_fallback and not have_measured and cell_min < 3.70"
    severity: warning
    suggestion: "建议核对剩余容量估计与返航电压裕度。"
    description: 电芯电压偏低
    evidence:
      source: battery_status.voltage_v(min)/cell_count
      value: f"{cell_min:.3f}"
      threshold: 3.7
      unit: V/cell
  - when: "no_cell"
    severity: info
    description: 日志缺少电芯电压与 cell_count，未做单电芯判断
    evidence:
      source: battery_status.voltage_cell_v / cell_count
      value: f"missing"
    label: null
tag: battery_voltage_drop
