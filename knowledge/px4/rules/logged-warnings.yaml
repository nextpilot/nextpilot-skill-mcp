# 日志警告消息：WARNING（log_level = ASCII '4'）的消息聚合为一条 warning，证据附最多 5 条原文。
# 级别判定用 level_name，理由见 logged-errors.yaml 的说明（迁移前 == 4 永不命中）。
# 阈值 px4-thresholds.toml [messages]：max_examples=5 / clip=200。

id: px4-log-warnings
slot: logged_messages
order: 2
name: 日志警告消息
version: 1.0.1
category: messages
status: stable
author: {name: NextPilot 内置}
license: CC-BY-4.0
changelog:
  - {version: 1.0.0, date: "2026-09-15", note: 从 ulog_checks.py 迁出，逻辑与阈值不变}
  - {version: 1.0.1, date: "2026-09-15", note: "修正级别判据：按 pyulog 语义用 ASCII 级别名（原 ==4 永不命中）"}

firmware: any
airframe: any

compute:
  - out: n
    in: [messages]
    op: count_items
    key: level_name
    eq: WARNING
  - out: samples
    in: [messages]
    op: take_items
    key: level_name
    eq: WARNING
    limit: 5
    clip: {message: 200}      # 单条原文截断长度（原 thresholds.toml message_clip_len）
    drop: [level, level_name]

triggers:
  - expr: "n > 0"
    severity: warning
    tag: null
    threshold: 0
    value: n
    unit: 条
    field: "ulog.logged_messages(log_level=4)"
    title: "日志中出现 {n} 条 WARNING 消息"
    evidence_extra: {samples: samples}

emit:
  check: logged_messages
  doc: https://docs.px4.io/main/en/log/flight_log_analysis.html
