# 日志警告消息：WARNING（log_level = ASCII '4'）的消息聚合为一条 warning，证据附最多 5 条原文。
# 级别判定用 level_name，理由见 logged-errors.yaml 的说明（迁移前 == 4 永不命中）。
# 阈值 px4-thresholds.toml [messages]：max_examples=5 / clip=200。

id: px4-log-warnings
name: 日志警告消息
group: logged_messages
order: 2
version: 1.0.1

compute:
  - n = count_items(MESSAGES, key="level_name", eq="WARNING")
  - >-
    samples = take_items(MESSAGES, key="level_name", eq="WARNING", limit=5, clip={"message": 200}, drop=["level", "level_name"])

trigger:
  - when: "n > 0"
    label: null
    severity: warning
    evidence_extra: { samples: samples }
    description: 日志中出现 {n} 条 WARNING 消息
    evidence:
      source: ulog.logged_messages(log_level=4)
      value: n
      threshold: 0
      unit: 条
