# 数据质量 guard：关键 topic 缺失（vehicle_status / battery_status / estimator_status）。
# 只打 guard 标签，不产 finding；顺序与原实现一致（数组顺序参与比对）。

id: px4-guard-topic-missing
slot: guards
order: 2
name: 数据质量-关键 topic 缺失
version: 1.0.0
category: guard
status: stable
author: {name: NextPilot 内置}
license: CC-BY-4.0
changelog:
  - {version: 1.0.0, date: "2026-09-15", note: "从 ulog_checks.py 迁出，逻辑不变"}

firmware: any
airframe: any

emit:
  guard_tags:
    - {when: "'vehicle_status' not in topics", tag: "topic_missing:vehicle_status"}
    - {when: "'battery_status' not in topics", tag: "topic_missing:battery_status"}
    - {when: "'estimator_status' not in topics", tag: "topic_missing:estimator_status"}
