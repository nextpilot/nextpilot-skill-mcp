# 日志消息聚合（robotto：ERR+ 冒烟的枪）：ERROR 及以上的消息聚合为一条 critical，
# 证据里附最多 5 条原文（含相对时间），用于直接定位根因。
#
# 级别判定用 level_name（PX4 在 log_level 里填 ASCII 数字 '3'=ERROR、'4'=WARNING，
# 与 pyulog Message.log_level_str() 一致）——迁移前写成 `log_level <= 3` / `== 4`，
# 拿 51/52 去比 3/4，导致本条经验在真实日志上从不命中，已按 pyulog 语义修正。
# 阈值 px4-thresholds.toml [messages]：max_examples=5 / clip=200。

id: px4-log-errors
slot: logged_messages
order: 1
name: 日志错误消息
version: 1.0.1
category: messages
status: stable
author: {name: NextPilot 内置}
license: CC-BY-4.0
changelog:
  - {version: 1.0.0, date: "2026-09-15", note: 从 ulog_checks.py 迁出，逻辑与阈值不变}
  - {version: 1.0.1, date: "2026-09-15", note: "修正级别判据：按 pyulog 语义用 ASCII 级别名（原 <=3 永不命中）"}

firmware: any
airframe: any

compute:
  - out: n
    in: [messages]
    op: count_items
    key: level_name
    in_list: [EMERGENCY, ALERT, CRITICAL, ERROR]
  - out: samples
    in: [messages]
    op: take_items
    key: level_name
    in_list: [EMERGENCY, ALERT, CRITICAL, ERROR]
    limit: 5
    clip: {message: 200}      # 单条原文截断长度（原 thresholds.toml message_clip_len）
    drop: [level, level_name]

triggers:
  - expr: "n > 0"
    severity: critical
    tag: null
    threshold: 0
    value: n
    unit: 条
    field: "ulog.logged_messages(log_level<=3)"
    title: "日志中出现 {n} 条 ERROR 及以上消息"
    suggestion: "按时间顺序核对错误原文，这通常是定位根因最直接的证据。"
    evidence_extra: {samples: samples}

emit:
  check: logged_messages
  doc: https://docs.px4.io/main/en/log/flight_log_analysis.html
