# 运行中参数修改（U7 FlightMD「确切参数改动」的做法；上游 Flight Review 的
# changed_parameters 只有按钮占位，这里补成检查）：changed_parameters 记录飞行中
# 被改写的参数。计数走 timestamp_us（数值列，稳定存在），绕开字符串列 name 的
# 取数差异。缺 topic（老固件没记）时整条自动 skip。
# 注：AUTOTUNE/参数保存工具的批量写也在这里出现，所以只给 info 不给更高严重级。

id: px4-param-changed
name: 运行中参数修改
group: param_changes
order: 1
tag: null

condition:
  message:
    - changed_parameters

compute:
  - n_changed = _try(len(changed_parameters.timestamp_us))

trigger:
  - when: "n_changed is not None and n_changed > 0"
    label: null
    severity: info
    suggestion: "核对本次飞行中的参数改动是否有意为之（改完记得在地面固化保存）；
      若非本人操作，检查自动调参/板载脚本与遥控器参数写入开关。"
    description: 本次飞行中修改了 {n_changed} 个参数
    evidence:
      source: changed_parameters
      value: n_changed
      threshold: 0
