# 空速健康（F009，固定翼/垂直起降巡航段）：airspeed_sensor_measurement_valid == 0 的样本占比。
# 只在「armed 且 nav_state ∈ 固定翼巡航{3 Mission, 8 AltitudeCruise}」时才判，否则中止。
# 阈值 [暂定] px4-thresholds.toml [airspeed]：invalid_ratio_warn=0.10 / crit=0.50。

# 来源：本仓检查设计（robotto ai-drone-toolkit 的 8 项对表之外，对应本仓 fault-kb 的 F009 空速健康关联标签）；字段语义按 PX4 uORB vehicle_air_speed。
# 与上游差异：上游无对应检查；「armed 且固定翼巡航段」的窗口过滤为本仓加严，阈值 [暂定]。
id: px4-airspeed-invalid
name: 空速健康
group: airspeed
order: 1
tag: low_airspeed

# 原实现只对固定翼判空速；旋翼/Rover 既不 ran 也不 skipped（静默）。
# 机型未知过去靠机架轴放行 + 一条 skip 记录留痕，现在 skip 已退役——未知直接被轴挡在门外。
# 原外层条件还要求存在 vehicle_attitude_setpoint（本经验并不读它），该条件一并去掉。

condition:
  vehicle: fixed_wing
  message:
    - airspeed_validated

compute:
  # 固定翼巡航段：armed 区间内 nav_state 出现过 3/8；不成立则整条中止（原 require_true 门控）
  - >-
    cruise_ok = require_true(masked_any_in(vehicle_status.nav_state, vehicle_status.timestamp, ARMED_INTERVALS, codes=[3, 8]))
  # 无效样本占比；字段缺失时保持可选（此时只用下面 tas 的统计，与原实现一致）
  - >-
    invalid_frac = _try(np.mean( _ref("airspeed_validated.airspeed_sensor_measurement_valid") == 0))
  - has_invalid = invalid_frac is not None
  - tas_min = _try(min(airspeed_validated.true_airspeed_m_s))

output:
  - name: airspeedInvalidRatio
    value: invalid_frac
    round: 3
  - name: airspeedMinM
    value: tas_min
    round: 1

trigger:
  - when: "has_invalid and invalid_frac >= 0.50"
    label: low_airspeed
    severity: critical
    suggestion: "结合故障库 F009：空速失效极易引发失速，检查空速管堵塞/积水、管路漏气与校准。"
    description: 空速传感器在固定翼段大部分时间无效（{invalid_frac:.0%} 样本）
    evidence:
      source: airspeed_validated.airspeed_sensor_measurement_valid
      value: f"{invalid_frac:.3f}"
      threshold: 0.5
  - when: "has_invalid and invalid_frac >= 0.10"
    label: low_airspeed
    severity: warning
    suggestion: "结合故障库 F009 检查空速管与管路密封。"
    description: 空速传感器间歇无效（{invalid_frac:.0%} 样本）
    evidence:
      source: airspeed_validated.airspeed_sensor_measurement_valid
      value: f"{invalid_frac:.3f}"
      threshold: 0.1
