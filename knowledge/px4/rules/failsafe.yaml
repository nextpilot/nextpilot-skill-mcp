# 失效保护 / 失联边沿（robotto + F007）：只报 armed 段内的事件，每次事件一条 finding。
# 5 个布尔字段的形态完全相同（只是字段/标签/严重度/文案不同），按“一个 YAML 可装多条经验”
# 合并在这里；每条仍是自包含经验，id 即 finding.ruleId（与原实现一致）。
# 事件列表由 rising_edge_events / step_into_events 产出，框架按 foreach 展开。

- id: px4-failsafe-failsafe
  name: 失效保护触发
  group: failsafe
  order: 1                 # failsafe group 内次序与原过程式 bool_fields 列表一致

  firmware: "True"
  airframe: "True"

  compute:
    - >-
        events = rising_edge_events(vehicle_status.failsafe, vehicle_status.timestamp,
        armed_intervals, t0_us)

  foreach: {var: events, keys: [t_s]}
  triggers:
    - when: "True"
      severity: critical
      tag: failsafe
      value: f"set at {t_s:.1f}s"
      field: "vehicle_status.failsafe"
      title: "触发失效保护（飞行中，t={t_s:.1f}s）"
      suggestion: "结合故障库与失效保护配置确认返航/降落行为；RC 丢失见 F007。"

