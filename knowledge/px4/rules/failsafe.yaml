# 失效保护 / 失联边沿（robotto + F007）：只报 armed 段内的事件，每次事件一条 finding。
# 5 个布尔字段的形态完全相同（只是字段/标签/严重度/文案不同），按“一个 YAML 可装多条经验”
# 合并在这里；每条仍是自包含经验，id 即 finding.ruleId（与原实现一致）。
# 事件列表由 rising_edge_events / step_into_events 产出，框架按 foreach 展开。

- id: px4-failsafe-failsafe
  slot: failsafe
  order: 1                 # failsafe slot 内次序与原过程式 bool_fields 列表一致
  name: 失效保护触发
  version: 1.0.0
  category: failsafe
  status: stable
  author: {name: NextPilot 内置}
  license: CC-BY-4.0
  changelog:
    - {version: 1.0.0, date: "2026-09-15", note: 从 ulog_checks.py 迁出，逻辑与阈值不变}

  firmware: any
  airframe: any

  requires:
    any_of: [vehicle_status]
  skip_reason: vehicle_status not in log

  compute:
    - out: events
      in: [vehicle_status.failsafe, vehicle_status.timestamp, armed_intervals, t0_us]
      op: rising_edge_events

  foreach: {var: events, keys: [t_s]}

  triggers:
    - expr: "True"
      severity: critical
      tag: failsafe
      value_text: "set at {t_s:.1f}s"
      field: "vehicle_status.failsafe"
      title: "触发失效保护（飞行中，t={t_s:.1f}s）"
      suggestion: "结合故障库与失效保护配置确认返航/降落行为；RC 丢失见 F007。"

  emit:
    check: failsafe
    doc: https://docs.px4.io/main/en/config/safety.html

