- id: px4-failsafe-nav
  name: 失效保护导航状态
  group: failsafe
  order: 6                 # 原实现里 nav 分支在 5 个布尔字段之后

  firmware: "True"
  airframe: "True"
  skip:
    - {when: "not has_topic('vehicle_status')", reason: vehicle_status not in log}

  compute:
    - >-
        events = step_into_events(vehicle_status.nav_state, vehicle_status.timestamp,
        armed_intervals, t0_us, codes={5: "AUTO_RTL", 12: "DESCEND", 13: "TERMINATION", 18: "LAND"})

  foreach: {var: events, keys: [t_s, code, name]}
  triggers:
    - when: "True"
      severity: critical
      tag: failsafe
      value: name
      field: "vehicle_status.nav_state"
      title: "飞行中导航状态切换为 {name}（t={t_s:.1f}s）"
      suggestion: "说明飞控进入失效保护状态，需结合前文事件定位触发原因。"
