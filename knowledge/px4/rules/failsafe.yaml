- id: px4-failsafe-nav
  slot: failsafe
  order: 6                 # 原实现里 nav 分支在 5 个布尔字段之后
  name: 失效保护导航状态
  version: 1.0.0
  category: failsafe
  status: stable
  author: {name: NextPilot 内置}
  license: CC-BY-4.0
  changelog:
    - {version: 1.0.0, date: "2026-09-15", note: 从 ulog_checks.py 迁出，逻辑与阈值不变}

  firmware: any
  airframe: any

  requires:
    any_of: [vehicle_status]
  skip_reason: vehicle_status not in log

  compute:
    - out: events
      in: [vehicle_status.nav_state, vehicle_status.timestamp, armed_intervals, t0_us]
      op: step_into_events
      codes: {5: AUTO_RTL, 12: DESCEND, 13: TERMINATION, 18: LAND}

  foreach: {var: events, keys: [t_s, code, name]}

  triggers:
    - expr: "True"
      severity: critical
      tag: failsafe
      value: name
      field: "vehicle_status.nav_state"
      title: "飞行中导航状态切换为 {name}（t={t_s:.1f}s）"
      suggestion: "说明飞控进入失效保护状态，需结合前文事件定位触发原因。"

  emit:
    check: failsafe
    doc: https://docs.px4.io/main/en/config/safety.html
