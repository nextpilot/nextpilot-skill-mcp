- id: px4-failsafe-nav
  name: 失效保护导航状态
  group: failsafe
  order: 6 # 原实现里 nav 分支在 5 个布尔字段之后

  condition:
    message:
      - vehicle_status

  compute:
    - >-
      events = step_into_events(vehicle_status.nav_state, vehicle_status.timestamp, ARMED_INTERVALS, T0_US, codes={5: "AUTO_RTL", 12: "DESCEND", 13: "TERMINATION", 18: "LAND"})

  foreach: { var: events, keys: [ t_s, code, name ] }

  trigger:
    - when: "True"
      label: failsafe
      severity: critical
      suggestion: "说明飞控进入失效保护状态，需结合前文事件定位触发原因。"
      description: 飞行中导航状态切换为 {name}（t={t_s:.1f}s）
      evidence:
        source: vehicle_status.nav_state
        value: name
