# VTOL 转换阶段姿态越限（F003）：在 vtol_in_trans_mode 为真的时段内，取 |roll|/|pitch| 的最大值。
# 转换段标志从 vtol_vehicle_status 时间轴向前保持到姿态时间轴；样本过少（<=5）不出结论。
# 阈值 [暂定] px4-thresholds.toml [vtol]：transition_tilt_deg=8.0。

id: px4-vtol-transition-attitude
name: VTOL 转换姿态越限
group: vtol_transition
order: 1
tag: vtol_convert_attitude_over

# 原实现的外层条件是「有 vehicle_status 且有 armed 段」，不成立时静默（既不 ran 也不 skipped）

condition:
  message:
    - vtol_vehicle_status

compute:
  # 转换段样本数（判"这段日志里到底有没有转换"）
  - trans_n = _try(np.sum(vtol_vehicle_status.vtol_in_trans_mode > 0))
  # 转换标志按"向前保持"采样到姿态时间轴，作为掩码
  - >-
    trans_mask = _try(fill_to(_ref("vtol_vehicle_status.vtol_in_trans_mode"), _ref("vtol_vehicle_status.timestamp"), _ref("vehicle_attitude.timestamp")))
  # 姿态四元数 → 欧拉角；取横滚/俯仰里较大的倾角
  # （q 是"每元素一列"的数组字段，裸写就取到四列，quat_to_euler 收这一组即可）
  - >-
    roll, pitch, yaw = _try(quat_to_euler(_ref("vehicle_attitude.q")))
  - tilt_max = _try(masked_absmax(np.maximum(abs(roll), abs(pitch)), trans_mask))
  - trans_cnt = _try(sum(trans_mask))
  # 样本 > 5 才算数；enough / has_tilt 被 trigger 引用，所以必须是具名变量
  - enough = _try(trans_cnt > 5)
  - has_tilt = tilt_max is not None
  - tilt_stat = _try(tilt_max if enough else None)

output:
  - name: vtolTransitionSamples
    value: trans_n
  - name: vtolTransitionMaxTiltDeg
    value: tilt_stat
    round: 1

trigger:
  - when: "has_tilt and enough and tilt_max > 8.0"
    label: vtol_convert_attitude_over
    severity: warning
    suggestion: "结合故障库 F003：复盘转换时序与推力匹配，强风环境优先归因环境扰动。"
    description: VTOL 转换阶段姿态越限（最大 {tilt_max:.1f}°，限值 8°）
    evidence:
      source: vehicle_attitude（vtol_in_trans_mode 段）
      value: f"{tilt_max:.1f}"
      threshold: 8
      unit: °
