# 一条经验 = 一个自包含单元：身份 / 适用范围 / 计算 / 触发 / 输出
# 结构说明见 ../rule-schema-design.md；改动后跑 tools/calibrate/compare-baseline.py 验等价

id: px4-cpu-load
# group：决定这条规则在引擎里的执行位置。finding.id（F01、F02…）按发射顺序生成，
# 所以 group 必须与它所替换的原过程式检查位置一致（执行顺序见 ../facts.yaml 的 slot_order）。
group: cpu

name: CPU 负载
# ── 适用范围（三个轴，不限也必须显式写 any）──
firmware: "True"

airframe: "True"

# ── 数据依赖：缺 topic 则 skipped，不误报 ──
skip:
  - {when: "not has_topic('cpuload')", reason: cpuload not in log}

# ── 计算：算子节点数据流（输出命名进环境，供表达式引用）──
compute:
  # 实测里 cpuload 通常只有一个实例，默认合并后统计（与原 max over instances 等价）
  - cpu_max = max(cpuload.load)

# ── 输出：溯源与副作用 ──
outputs:
  check: cpu_load                                   # checksRun / checksSkipped 里的名字
  stats:
    cpuLoadMax: {var: cpu_max, round: 3}             # 写入 stats 的键

# ── 触发：自上而下，命中第一条 ──
triggers:
  - when: "cpu_max >= 0.95"
    severity: critical
    threshold: 0.95          # 写进 evidence.threshold（显式声明，不从表达式猜）
    value: f"{cpu_max:.3f}"
    field: "cpuload.load(max)"
    title: "CPU 负载峰值 {cpu_max:.0%} 超阈值"
    suggestion: "CPU 长期接近满载会导致控制环丢步；检查高耗率模块与日志流配置。"
  - when: "cpu_max >= 0.90"
    severity: warning
    threshold: 0.90
    value: f"{cpu_max:.3f}"
    field: "cpuload.load(max)"
    title: "CPU 负载峰值 {cpu_max:.0%} 偏高"
    suggestion: "关注 CPU 余量，必要时降低消息发布率。"
