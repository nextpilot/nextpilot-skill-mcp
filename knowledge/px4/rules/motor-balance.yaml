# 电机输出不平衡（F008）：只在 armed 且悬停/定点段比较各电机通道均值极差；
# 要求 >= 4 个活跃通道（均值 > 0.01，排除未接/未用通道），否则不出结论。
# 掩码与逐通道均值都收在复合算子里；阈值 [暂定]：spread_warn=0.08 / spread_crit=0.15。

id: px4-motor-unbalance

name: 电机输出不平衡

group: motor_balance

order: 1

version: 1.1.0

firmware: "True"

airframe: "True"

skip:
  - {when: "no_data", reason: active motor channels < 4 (非多旋翼或未记录全部电机)}
  - {when: "not has_topic('actuator_motors')", reason: actuator_motors not in log}
# 原实现把 ran() 放在“活跃通道 >= 4”之后：不成立时只算 skipped，不算跑过
ran_on_success: true

compute:
  - mts = actuator_motors.timestamp
  - cols = actuator_motors.control
  - >-
      seg = active_window_mask(mts, armed_intervals, vehicle_status.nav_state,
      vehicle_status.timestamp, codes=[2, 4, 6, 14, 21], min_active=20)
  - >-
      spread, busiest, idlest, n_active = column_spread_stats(
      cols, seg, min_mean=0.01, min_channels=4)

triggers:
  - when: "spread >= 0.15"
    severity: critical
    tag: motor_output_unbalance
    threshold: 0.15
    value: f"{spread:.3f}"
    field: "actuator_motors.control[](悬停段均值极差)"
    title: "电机输出不平衡（悬停段通道 {busiest} 与 {idlest} 差 {spread:.3f}）"
    suggestion: "结合故障库 F008：检查桨叶型号/正反桨是否一致、单电机效率、机架形变。"
  - when: "spread >= 0.08"
    severity: warning
    tag: motor_output_unbalance
    threshold: 0.08
    value: f"{spread:.3f}"
    field: "actuator_motors.control[](悬停段均值极差)"
    title: "电机输出差异偏大（通道 {busiest} 与 {idlest} 差 {spread:.3f}）"
    suggestion: "结合故障库 F008 排查动力一致性；偶发差异可先观察。"

emit:
  tag: motor_output_unbalance
  stats:
    motorControlSpread: {var: spread, round: 3}
    motorCountActive: {var: n_active}
