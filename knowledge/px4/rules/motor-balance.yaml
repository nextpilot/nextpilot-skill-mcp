# 电机输出不平衡（F008）：只在 armed 且悬停/定点段比较各电机通道均值极差；
# 要求 >= 4 个活跃通道（均值 > 0.01，排除未接/未用通道），否则不出结论。
# 掩码与逐通道均值都收在复合算子里；阈值 [暂定]：spread_warn=0.08 / spread_crit=0.15。

id: px4-motor-unbalance
name: 电机输出不平衡
group: motor_balance
order: 1
version: 1.1.0
tag: motor_output_unbalance

condition:
  message:
    - actuator_motors
# 活跃通道 >= 4 才算跑过：通道不足由算子的 min_channels=4 兜住，算不出来就记一条
# 「数据不足」，不会算作跑过（ran() 现在统一在 compute 成功之后记）

compute:
  - mts = actuator_motors.timestamp
  - cols = actuator_motors.control
  - >-
    seg = active_window_mask(mts, ARMED_INTERVALS, vehicle_status.nav_state, vehicle_status.timestamp, codes=[2, 4, 6, 14, 21], min_active=20)
  - >-
    spread, busiest, idlest, n_active = column_spread_stats( cols, seg, min_mean=0.01, min_channels=4)

output:
  - name: motorControlSpread
    value: spread
    round: 3
  - name: motorCountActive
    value: n_active

trigger:
  - when: "spread >= 0.15"
    label: motor_output_unbalance
    severity: critical
    suggestion: "结合故障库 F008：检查桨叶型号/正反桨是否一致、单电机效率、机架形变。"
    description: 电机输出不平衡（悬停段通道 {busiest} 与 {idlest} 差 {spread:.3f}）
    evidence:
      source: actuator_motors.control[](悬停段均值极差)
      value: f"{spread:.3f}"
      threshold: 0.15
  - when: "spread >= 0.08"
    label: motor_output_unbalance
    severity: warning
    suggestion: "结合故障库 F008 排查动力一致性；偶发差异可先观察。"
    description: 电机输出差异偏大（通道 {busiest} 与 {idlest} 差 {spread:.3f}）
    evidence:
      source: actuator_motors.control[](悬停段均值极差)
      value: f"{spread:.3f}"
      threshold: 0.08
