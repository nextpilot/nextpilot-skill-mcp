# EKF 硬故障位（robotto）：filter_fault_flags 是位掩码，不能“任一非零即严重”。
# bit 0-5 为核心融合故障（速度/水平位置/垂直位置/磁罗盘 XYZ）→ critical；
# bit 10（视觉速度融合拒绝）在未用 VIO 的飞机上属正常 → 只报 info，避免误报。

id: px4-ekf-fault
slot: ekf_faults
order: 1
name: EKF 融合硬故障
version: 1.0.0
category: ekf
status: stable
author: {name: NextPilot 内置}
license: CC-BY-4.0
changelog:
  - {version: 1.0.0, date: "2026-09-15", note: 从 ulog_checks.py 迁出，逻辑与阈值不变}

firmware: any
airframe: any

requires:
  any_of: [estimator_status]
skip_reason: estimator_status not in log

compute:
  # 跨实例合并：每个实例取该实例内的最大置位，再按位或
  - {out: fault_raw, from: estimator_status.filter_fault_flags, op: bit_or_max,
     per_instance: true, optional: true}
  - {out: nan_raw, from: estimator_status.nan_flags, op: max_of_max,
     per_instance: true, optional: true}
  # 字段缺失时按 0 处理：两条分支条件自然都不成立（与迁移前 have_fault 的语义一致）
  - {out: fault_union, in: [fault_raw, 0], op: coalesce, optional: true}
  - {out: nan_v, in: [nan_raw, 0], op: coalesce, optional: true}
  - {out: nan_max, in: [nan_v], op: to_int, optional: true}
  - {out: crit_bits, in: [fault_union, 63], op: has_bits, optional: true}   # 63 = bit0..bit5

triggers:
  - expr: "nan_max > 0 or crit_bits"
    severity: critical
    threshold: 0
    value_text: "fault={fault_union},nan={nan_max}"
    field: "estimator_status.filter_fault_flags/nan_flags"
    title: "EKF 报告核心融合硬故障（filter_fault_flags={fault_union}, nan_flags={nan_max}）"
    suggestion: "估计器出现硬故障/NaN，建议停飞排查传感器与振动后重新标定。"
  # 仅非核心位（如未启用视觉）且无 NaN：给 info 提示，不当作故障
  - expr: "fault_union > 0 and not crit_bits and nan_max == 0"
    severity: info
    tag: null
    threshold: 0
    value: fault_union
    field: "estimator_status.filter_fault_flags"
    title: "EKF 报告非核心辅助传感器融合拒绝（filter_fault_flags={fault_union}，常见为未使用视觉/光流）"
    suggestion: "若该机确实未启用视觉/光流定位，此位可忽略；否则检查对应传感器。"

emit:
  check: ekf_faults
  tag: ekf_innovation_failure
  doc: https://docs.px4.io/main/en/advanced_config/tuning_the_ecl_ekf.html
