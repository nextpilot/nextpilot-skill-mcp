# 模式抖动（robotto）：nav_state 变化次数 > 12 视为抖动。
# 阈值 [来源] px4-thresholds.toml [mode] thrash_changes=12。

id: px4-mode-thrash
name: 飞行模式抖动
group: mode_thrash
order: 1

firmware: "True"
airframe: "True"
skip:
  - {when: "not has_topic('vehicle_status')", reason: vehicle_status not in log}

compute:
  - n_changes_raw = edges_count(vehicle_status.nav_state)
  - n_changes = to_int(n_changes_raw)

outputs:
  stats:
    navStateChanges: {var: n_changes}

triggers:
  - when: "n_changes > 12"
    severity: warning
    tag: null
    threshold: 12
    value: n_changes
    unit: 次
    field: "vehicle_status.nav_state 变化次数"
    title: "飞行模式切换 {n_changes} 次（>12），可能存在模式抖动"
    suggestion: "频繁切模式易诱发操纵混乱；检查遥控器开关与失效保护反复触发。"
