# 模式抖动（robotto）：nav_state 变化次数 > 12 视为抖动。
# 阈值 [来源] px4-thresholds.toml [mode] thrash_changes=12。

id: px4-mode-thrash
name: 飞行模式抖动
group: mode_thrash
order: 1

conditions:
  message:
    - vehicle_status

compute:
  - n_changes = edges_count(vehicle_status.nav_state)

outputs:
  - name: navStateChanges
    value: n_changes

triggers:
  - when: "n_changes > 12"
    severity: warning
    suggestion: "频繁切模式易诱发操纵混乱；检查遥控器开关与失效保护反复触发。"
    description: 飞行模式切换 {n_changes} 次（>12），可能存在模式抖动
    evidence:
      source: vehicle_status.nav_state 变化次数
      value: n_changes
      threshold: 12
      unit: 次
    label: null
