# IMU 加速度标准差 RSS 回退（旧固件无 accel_vibration_metric 时的主要指标）：
# 每个实例三轴 stddev 序列 → mean(sqrt(x²+y²+z²))，取最大实例。
# 阈值 [暂定]（px4-thresholds.toml [vibration] stddev_warn/stddev_crit）。

id: px4-vibration-stddev

name: IMU 加速度标准差

group: vibration

order: 2

firmware: "True"

airframe: "True"

skip:
  - {when: "not has_topic('vehicle_imu_status')", reason: vehicle_imu_status not in log}

compute:
  # 三轴各自按实例分组；alias 覆盖旧固件字段改名（stddev_accel_x[_m_s2]）
  - >-
      stddev_rss, stddev_idx = worst_rss_mean(
      ref("vehicle_imu_status.stddev_accel_x_m_s2", per_instance=True, alias="stddev_accel_x"),
      ref("vehicle_imu_status.stddev_accel_y_m_s2", per_instance=True, alias="stddev_accel_y"),
      ref("vehicle_imu_status.stddev_accel_z_m_s2", per_instance=True, alias="stddev_accel_z"),
      min_mean=0)

outputs:
  tag: high_vibration
  stats:
    imuStddevAccelRssMax: {var: stddev_rss, round: 3}

triggers:
  - when: "stddev_rss >= 1.0"
    severity: critical
    threshold: 1.0
    value: f"{stddev_rss:.3f}"
    unit: m/s^2
    field: "vehicle_imu_status.stddev_accel_*_m_s2(RSS 均值)"
    title: "IMU 加速度标准差严重超标（IMU #{stddev_idx}）"
    suggestion: "结合故障库条目排查桨叶/电机轴承/机架紧固/减震。"
  - when: "stddev_rss >= 0.5"
    severity: warning
    threshold: 0.5
    value: f"{stddev_rss:.3f}"
    unit: m/s^2
    field: "vehicle_imu_status.stddev_accel_*_m_s2(RSS 均值)"
    title: "IMU 加速度标准差偏大（IMU #{stddev_idx}）"
    suggestion: "关注桨叶损伤、电机动平衡与 IMU 减震。"
