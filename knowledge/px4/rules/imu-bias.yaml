# 陀螺零偏漂移（F005）：跨固件版本取源——1.15+ 直读 estimator_sensor_bias.gyro_bias[]，
# 旧固件取 estimator_states/estimator_status.states[10..12]。只看 armed 段，逐轴取
# |最大零偏| 与漂移（max-min），取最差轴；温度跨度作背景（跨度大优先按温度漂移解释）。
# 取源、掩码、逐轴归约都收在复合算子里。
# 阈值 [暂定]：abs/drift warn=0.02、crit=0.05、温度跨度 guard=15。

id: px4-imu-bias-drift

name: 陀螺零偏漂移

group: imu_bias

order: 1

version: 1.1.0

firmware: "True"

airframe: "True"

skip:
  - {when: "not has_armed", reason: 无 armed 段，不做零偏判定}
  - {when: "no_data", reason: 无陀螺零偏数据（无 estimator_sensor_bias / estimator_status.states）}
# 原实现外层是 `if armed_intervals:`，无 armed 段时留一条 skip 记录
# 1.15 之前零偏藏在 estimator_status.states[10..12]（该字段在新固件已不存在），
# 属于已知遗留：lint-rules.py 据此不再把它列为可疑引用
known_legacy: [estimator_status.states]

compute:
  # 取源（新/旧固件自动选，附带 evidence 用的来源说明）；主数据缺失返回 None。
  # sources 就是 evidence.field 里的那句"这条结论读的是哪儿"——文案留在经验里，算子不认识字段名
  - >-
      bx, by, bz, bts, src_text = _try(gyro_bias_series(
      ref("estimator_sensor_bias.gyro_bias", instance=0),
      ref("estimator_sensor_bias.timestamp", instance=0),
      ref("estimator_states.states", instance=0),
      ref("estimator_states.timestamp", instance=0),
      ref("estimator_status.states", instance=0),
      ref("estimator_status.timestamp", instance=0), fw_minor, slot=10,
      sources=["estimator_sensor_bias.gyro_bias[]",
               "estimator_states.states[10..12]",
               "estimator_status.states[10..12]"]))
  # armed 段内逐轴 |最大零偏| 与漂移，各取最差轴
  - >-
      worst_abs, worst_axis, worst_drift, drift_axis = _try(gyro_bias_worst(
      bx, by, bz, bts, armed_intervals, labels=["X", "Y", "Z"], min_count=10))
  # 至少一个轴有效，否则整条中止
  - abs_gate = require_true(worst_axis is not None)
  # 温度跨度：两个来源取较大者（样本 < 2 的来源忽略）
  - >-
      temp_range = _try(max_temp_range(ref("vehicle_imu_status.temperature_gyro", instance=0),
      ref("vehicle_air_data.ambient_temperature", instance=0)))
  - bias_stat = _try(larger(worst_abs, worst_drift))

triggers:
  - when: "worst_abs >= 0.05 or worst_drift >= 0.05"
    severity: critical
    tag: imu_bias_drift
    threshold: 0.02
    value: f"{bias_stat:.4f}"
    unit: rad/s
    field: "{src_text}"
    title: "陀螺零偏异常（轴 {worst_axis}：绝对值 {worst_abs:.4f} rad/s，漂移 {worst_drift:.4f} rad/s）"
    suggestion: "结合故障库 F005：检查 IMU 安装紧固、执行陀螺/加计标定；若温度跨度大，优先按温度漂移解释。"
  - when: "worst_abs >= 0.02 or worst_drift >= 0.02"
    severity: warning
    tag: imu_bias_drift
    threshold: 0.02
    value: f"{bias_stat:.4f}"
    unit: rad/s
    field: "{src_text}"
    title: "陀螺零偏异常（轴 {worst_axis}：绝对值 {worst_abs:.4f} rad/s，漂移 {worst_drift:.4f} rad/s）"
    suggestion: "结合故障库 F005：检查 IMU 安装紧固、执行陀螺/加计标定；若温度跨度大，优先按温度漂移解释。"

emit:
  tag: imu_bias_drift
  stats:
    gyroBiasMaxRadS: {var: worst_abs, round: 4}
    gyroBiasDriftRadS: {var: worst_drift, round: 4}
    gyroBiasSource: {var: src_text}
    imuTempRangeC: {var: temp_range, round: 1}
  # 温度跨度大：作为背景信息打 guard 标签（与原过程式一致，不依赖是否发 finding）
  guard_tags:
    - {when: "temp_range >= 15", tag: temperature_change_large}
