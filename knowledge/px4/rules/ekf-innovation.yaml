# EKF 创新检验（robotto）：两种固件形态共用一条经验，取全局最大「拒绝占比」。
#  - 旧固件：innovation_check_flags 位掩码非零样本占比（bits 见 primary_names，顺序即位号）
#  - 新固件：各路 *_test_ratio 中 ratio >= 1.0 的样本占比
# 迁移前语义：某实例有主信号就只用主信号（不足 primary_min 个样本则该实例不产出候选）。
# 阈值 [暂定] px4-thresholds.toml [ekf]：reject_ratio_warn=0.01 / crit=0.05，证据里换算成 %。

id: px4-ekf-innovation
name: EKF 创新检验
group: ekf_innovations
order: 1

conditions:
  topics:
    - estimator_status

compute:
  # 每个 estimator 实例一组；主信号（位掩码）非空时用它，否则逐一比对各路 *_test_ratio。
  # 字段名、位名、通道名全部由本文件给出（算子不认识任何具体 topic/字段）。
  - >-
    frac, names, inst = worst_reject_ratio(
      ref("estimator_status[:].innovation_check_flags"),
      ref("estimator_status[:].vel_test_ratio"),
      ref("estimator_status[:].pos_test_ratio"),
      ref("estimator_status[:].hgt_test_ratio"),
      ref("estimator_status[:].hdg_test_ratio"),
      ref("estimator_status[:].mag_test_ratio"),
      ref("estimator_status[:].tas_test_ratio"),
      ref("estimator_status[:].hagl_test_ratio"),
      ref("estimator_status[:].beta_test_ratio"),
      primary_min=3,
      primary_names=["速度", "水平位置", "垂直位置", "磁罗盘 X", "磁罗盘 Y", "磁罗盘 Z",
                     "航向", "空速", "侧滑", "离地高度", "光流 X", "光流 Y"],
      ge=1.0,                    # 通道判拒阈值：ratio >= 1 即该路观测被 EKF 拒绝
      channel_min=3,             # 通道最少被拒样本数，去偶发尖峰毛刺
      channel_labels=["速度", "水平位置", "垂直高度", "航向", "磁罗盘", "空速", "离地高度", "侧滑"],
      fallback_label="未知通道")
  - pct = frac * 100           # 证据里换算成 %

outputs:
  tag: ekf_innovation_failure
  stats:
    ekfRejectRatioPct: {var: pct, round: 2}

triggers:
  - when: "pct >= 5.0"
    severity: critical
    threshold: 5.0
    value: f"{pct:.2f}"
    unit: "%"
    field: "estimator_status 创新检验拒绝样本占比"
    title: "EKF 创新检验持续失败（estimator #{inst}：{names}）"
    suggestion: "涉及：{names}。检查对应传感器健康度、安装与校准。"
  - when: "pct >= 1.0"
    severity: warning
    threshold: 1.0
    value: f"{pct:.2f}"
    unit: "%"
    field: "estimator_status 创新检验拒绝样本占比"
    title: "EKF 创新检验偶发失败（estimator #{inst}：{names}）"
    suggestion: "涉及：{names}。关注 GPS 卫星数、磁罗盘干扰、振动与气压计异常。"
