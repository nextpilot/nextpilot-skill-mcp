# GPS 位置跳变（F002 相关）：经纬度相邻差分速度 > 50 m/s 的次数，累计 >= 3 次告警。
# 取 vehicle_gps_position（融合/处理后的位置，即飞控实际用的），不是 sensor_gps（原始 GPS 数据）：
# 跳变判定要看“飞到哪儿去了”，原始数据的野值由 GPS 模块自己负责过滤。
# 阈值 [暂定] px4-thresholds.toml [gps]：jump_speed_mps=50 / jump_min_count=3。

id: px4-gps-jump
name: GPS 位置跳变
group: gps_health
order: 3

conditions:
  message:
    - vehicle_gps_position

compute:
  # 经纬度字段跨固件改名**且**改了单位：旧固件 lat/lon（1e7 度）、1.15+ latitude_deg/longitude_deg（度）。
  # 候选组负责"有谁用谁"，unit= 负责"取到谁都换算成度"——所以不再需要两条 when_fw 分支。
  - >-
    step = _try(adjacent_speed_mps( ref("vehicle_gps_position.latitude_deg", "vehicle_gps_position.lat", unit="deg"), ref("vehicle_gps_position.longitude_deg", "vehicle_gps_position.lon", unit="deg"), ref("vehicle_gps_position.timestamp")))
  - njump = _try(np.sum(step > 50.0))

outputs:
  - name: gpsJumpCount
    value: njump

triggers:
  - when: "njump >= 3"
    severity: warning
    suggestion: "结合故障库 F002：排查多路径、馈线与电磁干扰；室内跳变为正常现象。"
    description: GPS 位置出现 {njump} 次异常跳变（>50 m/s）
    evidence:
      source: vehicle_gps_position lat/lon 相邻差分
      value: njump
      threshold: 3
      unit: 次
    label: gps_jump
tag: gps_jump
