# 生成物，勿手改。由 tools/topics/sync-px4-msg.py 从 FixedWingLateralSetpoint.msg 生成
topic: fixed_wing_lateral_setpoint
msg: FixedWingLateralSetpoint.msg
fields:
  timestamp:
    type: uint64
    unit: us
  course:
    type: float32
    note: "[rad] [@range -pi, pi] Desired direction of travel over ground w.r.t (true) North. NAN if not controlled directly."
  airspeed_direction:
    type: float32
    note: "[rad] [@range -pi, pi] Desired horizontal angle of airspeed vector w.r.t. (true) North. Same as vehicle heading if in the absence of sideslip. NAN if not controlled directly, takes precedence over course if finite."
  lateral_acceleration:
    type: float32
    note: "[m/s^2] [@frame FRD] Lateral acceleration setpoint. NAN if not controlled directly, used as feedforward if either course setpoint or airspeed_direction is finite."
