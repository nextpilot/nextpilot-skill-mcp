# 生成物，勿手改。由 tools/topics/sync-px4-msg.py 从 RaptorStatus.msg 生成
topic: raptor_status
msg: RaptorStatus.msg
fields:
  timestamp:
    type: uint64
    unit: us
  timestamp_sample:
    type: uint64
    unit: us
  subscription_update_angular_velocity:
    type: bool
    note: "[bool] Flag signalling if the vehicle_angular_velocity was updated"
  subscription_update_local_position:
    type: bool
    note: "[bool] Flag signalling if the vehicle_local_position was updated"
  subscription_update_attitude:
    type: bool
    note: "[bool] Flag signalling if the vehicle_attitude was updated"
  subscription_update_trajectory_setpoint:
    type: bool
    note: "[bool] Flag signalling if the trajectory_setpoint was updated"
  subscription_update_vehicle_status:
    type: bool
    note: "[bool] Flag signalling if the vehicle_status was updated"
  exit_reason:
    type: uint8
    note: "[enum] Exit reason identifier. Representing conditions that lead to the Raptor policy not being executed"
    values:
      0: NONE
      1: UPDATE
      2: SET
      3: STALE
      4: STALE
      5: STALE
      6: CONTROL
    kind: enum
  timestamp_last_vehicle_angular_velocity:
    type: uint32
    note: "[us] Timestamp of the last received vehicle_angular_velocity message"
  timestamp_last_vehicle_local_position:
    type: uint32
    note: "[us] Timestamp of the last received vehicle_local_position message"
  timestamp_last_vehicle_attitude:
    type: uint32
    note: "[us] Timestamp of the last received vehicle_attitude message"
  timestamp_last_trajectory_setpoint:
    type: uint32
    note: "[us] Timestamp of the last received trajectory_setpoint message"
  vehicle_angular_velocity_stale:
    type: bool
    unit: exceeded timeout
    note: "[bool] True if vehicle_angular_velocity data is considered stale (exceeded timeout)"
  vehicle_local_position_stale:
    type: bool
    unit: exceeded timeout
    note: "[bool] True if vehicle_local_position data is considered stale (exceeded timeout)"
  vehicle_attitude_stale:
    type: bool
    unit: exceeded timeout
    note: "[bool] True if vehicle_attitude data is considered stale (exceeded timeout)"
  trajectory_setpoint_stale:
    type: bool
    unit: exceeded timeout
    note: "[bool] True if trajectory_setpoint data is considered stale (exceeded timeout)"
  active:
    type: bool
    note: "[bool] True if the Raptor policy is currently active (publishing actuator_motors)"
  substep:
    type: uint8
    note: "[-] The policy is trained at a fixed frequency (e.g. 100 Hz) but we might want to use it for control at higher frequencies (e.g. 400 Hz), which leads to a number of intermediate steps before the actual policy state is advanced (in this case 4 = 400 Hz / 100 Hz). This field provides the current substep (e.g. 0-3)."
  control_interval:
    type: float32
    note: "[s] Time interval between control updates"
  trajectory_setpoint_dt_mean:
    type: float32
    note: "[us] The average trajectory setpoint arrival time interval (since Raptor mode activation within NUM_TRAJECTORY_SETPOINT_DTS received trajectory_setpoint messages)"
  trajectory_setpoint_dt_max:
    type: float32
    note: "[us] The max trajectory setpoint arrival time interval (since Raptor mode activation and within NUM_TRAJECTORY_SETPOINT_DTS received trajectory_setpoint messages)"
  trajectory_setpoint_dt_max_since_activation:
    type: float32
    unit: since Raptor mode activation
    note: "[us] The max trajectory setpoint arrival time interval (since Raptor mode activation)"
