# 生成物，勿手改。由 tools/topics/sync-px4-msg.py 从 VehicleLandDetected.msg 生成
topic: vehicle_land_detected
msg: VehicleLandDetected.msg
fields:
  timestamp:
    type: uint64
    unit: us
  freefall:
    type: bool
    note: true if vehicle is currently in free-fall
  ground_contact:
    type: bool
    unit: 1. stage
    note: true if vehicle has ground contact but is not landed (1. stage)
  maybe_landed:
    type: bool
    unit: 2. stage
    note: true if the vehicle might have landed (2. stage)
  landed:
    type: bool
    unit: 3. stage
    note: true if vehicle is currently landed on the ground (3. stage)
  in_ground_effect:
    type: bool
    note: indicates if from the perspective of the landing detector the vehicle might be in ground effect (baro). This flag will become true if the vehicle is not moving horizontally and is descending (crude assumption that user is landing).
  in_descend:
    type: bool
    note: true only if commanded to descend faster than 1.1 * LNDMC_Z_VEL_MAX for every update since the previous publication
  has_low_throttle:
    type: bool
    note: true only if throttle was at or below the low-throttle threshold for every update since the previous publication
  vertical_movement:
    type: bool
    note: false only if vertical velocity stayed below LNDMC_Z_VEL_MAX for every update since the previous publication
  horizontal_movement:
    type: bool
    note: false only if horizontal velocity stayed below LNDMC_XY_VEL_MAX for every update since the previous publication
  rotational_movement:
    type: bool
    note: false only if roll/pitch rate stayed below LNDMC_ROT_MAX for every update since the previous publication
  close_to_ground_or_skipped_check:
    type: bool
    note: true only if close to the ground, or the check was skipped (no distance sensor), for every update since the previous publication
  at_rest:
    type: bool
