# 生成物，勿手改。由 tools/topics/sync-px4-msg.py 从 EstimatorEventFlags.msg 生成
topic: estimator_event_flags
msg: EstimatorEventFlags.msg
fields:
  timestamp:
    type: uint64
    unit: us
  timestamp_sample:
    type: uint64
    unit: us
  information_event_changes:
    type: uint32
    note: number of information event changes
  gps_checks_passed:
    type: bool
    note: 0 - true when gps quality checks are passing passed
  reset_vel_to_gps:
    type: bool
    note: 1 - true when the velocity states are reset to the gps measurement
  reset_vel_to_flow:
    type: bool
    note: 2 - true when the velocity states are reset using the optical flow measurement
  reset_vel_to_vision:
    type: bool
    note: 3 - true when the velocity states are reset to the vision system measurement
  reset_vel_to_zero:
    type: bool
    note: 4 - true when the velocity states are reset to zero
  reset_pos_to_last_known:
    type: bool
    note: 5 - true when the position states are reset to the last known position
  reset_pos_to_gps:
    type: bool
    note: 6 - true when the position states are reset to the gps measurement
  reset_pos_to_vision:
    type: bool
    note: 7 - true when the position states are reset to the vision system measurement
  starting_gps_fusion:
    type: bool
    note: 8 - true when the filter starts using gps measurements to correct the state estimates
  starting_vision_pos_fusion:
    type: bool
    note: 9 - true when the filter starts using vision system position measurements to correct the state estimates
  starting_vision_vel_fusion:
    type: bool
    note: 10 - true when the filter starts using vision system velocity measurements to correct the state estimates
  starting_vision_yaw_fusion:
    type: bool
    note: 11 - true when the filter starts using vision system yaw  measurements to correct the state estimates
  yaw_aligned_to_imu_gps:
    type: bool
    note: 12 - true when the filter resets the yaw to an estimate derived from IMU and GPS data
  reset_hgt_to_baro:
    type: bool
    note: 13 - true when the vertical position state is reset to the baro measurement
  reset_hgt_to_gps:
    type: bool
    note: 14 - true when the vertical position state is reset to the gps measurement
  reset_hgt_to_rng:
    type: bool
    note: 15 - true when the vertical position state is reset to the rng measurement
  reset_hgt_to_ev:
    type: bool
    note: 16 - true when the vertical position state is reset to the ev measurement
