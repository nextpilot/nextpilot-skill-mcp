# 生成物，勿手改。由 tools/topics/sync-px4-msg.py 从 Wind.msg 生成
topic: wind
msg: Wind.msg
fields:
  timestamp:
    type: uint64
    unit: us
  timestamp_sample:
    type: uint64
    unit: us
  windspeed_north:
    type: float32
    note: "[m/s] Wind component in north / X direction"
  windspeed_east:
    type: float32
    note: "[m/s] Wind component in east / Y direction"
  variance_north:
    type: float32
    note: "[(m/s)^2] [@invalid 0 if not estimated] Wind estimate error variance in north / X direction"
  variance_east:
    type: float32
    note: "[(m/s)^2] [@invalid 0 if not estimated] Wind estimate error variance in east / Y direction"
  tas_innov:
    type: float32
    note: "[m/s] True airspeed innovation"
  tas_innov_var:
    type: float32
    note: "[(m/s)^2] True airspeed innovation variance"
  beta_innov:
    type: float32
    note: "[rad] Sideslip measurement innovation"
  beta_innov_var:
    type: float32
    note: "[rad^2] Sideslip measurement innovation variance"
