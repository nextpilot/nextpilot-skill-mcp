# 生成物，勿手改。由 tools/topics/sync-px4-msg.py 从 TecsStatus.msg 生成
topic: tecs_status
msg: TecsStatus.msg
fields:
  timestamp:
    type: uint64
    unit: us
  altitude_sp:
    type: float32
    note: Altitude setpoint AMSL [m]
  altitude_reference:
    type: float32
    note: Altitude setpoint reference AMSL [m]
  altitude_time_constant:
    type: float32
    note: Time constant of the altitude tracker [s]
  height_rate_reference:
    type: float32
    note: Height rate setpoint reference [m/s]
  height_rate_direct:
    type: float32
    note: Direct height rate setpoint from velocity reference generator [m/s]
  height_rate_setpoint:
    type: float32
    note: Height rate setpoint [m/s]
  height_rate:
    type: float32
    note: Height rate [m/s]
  equivalent_airspeed_sp:
    type: float32
    note: Equivalent airspeed setpoint [m/s]
  true_airspeed_sp:
    type: float32
    note: True airspeed setpoint [m/s]
  true_airspeed_filtered:
    type: float32
    note: True airspeed filtered [m/s]
  true_airspeed_derivative_sp:
    type: float32
    note: True airspeed derivative setpoint [m/s^2]
  true_airspeed_derivative:
    type: float32
    note: True airspeed derivative [m/s^2]
  true_airspeed_derivative_raw:
    type: float32
    note: True airspeed derivative raw [m/s^2]
  total_energy_rate_sp:
    type: float32
    note: Total energy rate setpoint [m^2/s^3]
  total_energy_rate:
    type: float32
    note: Total energy rate estimate [m^2/s^3]
  total_energy_balance_rate_sp:
    type: float32
    note: Energy balance rate setpoint [m^2/s^3]
  total_energy_balance_rate:
    type: float32
    note: Energy balance rate estimate [m^2/s^3]
  throttle_integ:
    type: float32
    note: Throttle integrator value [-]
  pitch_integ:
    type: float32
    note: Pitch integrator value [rad]
  throttle_sp:
    type: float32
    note: Current throttle setpoint [-]
  pitch_sp_rad:
    type: float32
    note: Current pitch setpoint [rad]
  throttle_trim:
    type: float32
    note: estimated throttle value [0,1] required to fly level at equivalent_airspeed_sp in the current atmospheric conditions
  underspeed_ratio:
    type: float32
    note: "0: no underspeed, 1: maximal underspeed. Controller takes measures to avoid stall proportional to ratio if >0."
  fast_descend_ratio:
    type: float32
    note: value indicating if fast descend mode is enabled with ramp up and ramp down [0-1]
  weight_ratio:
    type: float32
    note: "[-] Ratio of estimated vehicle weight to WEIGHT_BASE. Accounts for burned fuel if fuel-based weight compensation is enabled."
