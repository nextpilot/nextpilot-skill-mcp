# 生成物，勿手改。由 tools/topics/sync-px4-msg.py 从 Mission.msg 生成
topic: mission
msg: Mission.msg
fields:
  timestamp:
    type: uint64
    unit: us
  mission_dataman_id:
    type: uint8
    note: "default 0, there are two offboard storage places in the dataman: 0 or 1"
  fence_dataman_id:
    type: uint8
    note: "default 0, there are two offboard storage places in the dataman: 0 or 1"
  safepoint_dataman_id:
    type: uint8
    note: "default 0, there are two offboard storage places in the dataman: 0 or 1"
  count:
    type: uint16
    note: count of the missions stored in the dataman
  current_seq:
    type: int32
    note: default -1, start at the one changed latest
  land_start_index:
    type: int32
    note: Index of the land start marker, if unavailable index of the land item, -1 otherwise
  land_index:
    type: int32
    note: Index of the land item, -1 otherwise
  mission_id:
    type: uint32
    note: indicates updates to the mission, reload from dataman if changed
  geofence_id:
    type: uint32
    note: indicates updates to the geofence, reload from dataman if changed
  safe_points_id:
    type: uint32
    note: indicates updates to the safe points, reload from dataman if changed
