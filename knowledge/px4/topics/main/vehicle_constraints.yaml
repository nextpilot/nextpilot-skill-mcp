# 生成物，勿手改。由 tools/topics/sync-px4-msg.py 从 VehicleConstraints.msg 生成
topic: vehicle_constraints
msg: VehicleConstraints.msg
fields:
  timestamp:
    type: uint64
    unit: us
  speed_up:
    type: float32
    note: in meters/sec
  speed_down:
    type: float32
    note: in meters/sec
  want_takeoff:
    type: bool
    unit: ignored during flight
    note: tell the controller to initiate takeoff when idling (ignored during flight)
