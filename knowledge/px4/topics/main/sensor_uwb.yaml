    type: uint16
    note: "[-] Ranging status code passed through from the UWB module's measurement result"
  nlos:
    type: uint8
    unit: y/n
    note: "[-] Non-line-of-sight condition (y/n)"
  distance:
    type: float32
    note: "[m] Distance to the UWB receiver"
  aoa_azimuth_dev:
    type: float32
    note: "[deg] Angle of arrival of first incoming RX msg"
  aoa_elevation_dev:
    type: float32
    note: "[deg] Angle of arrival of first incoming RX msg"
  aoa_azimuth_resp:
    type: float32
    note: "[deg] Angle of arrival of first incoming RX msg at the responder"
  aoa_elevation_resp:
    type: float32
    note: "[deg] Angle of arrival of first incoming RX msg at the responder"
  aoa_azimuth_fom:
    type: uint8
    unit: FOM
    note: AOA Azimuth Figure of Merit (FOM)
  aoa_elevation_fom:
    type: uint8
