# 生成物，勿手改。由 tools/topics/sync-px4-msg.py 从 GotoSetpoint.msg 生成
topic: goto_setpoint
msg: GotoSetpoint.msg
fields:
  timestamp:
    type: uint64
    unit: us
  flag_control_heading:
    type: bool
    note: true if heading is to be controlled
  heading:
    type: float32
    note: (optional) [rad] [-pi,pi] from North
  flag_set_max_horizontal_speed:
    type: bool
    note: true if setting a non-default horizontal speed limit
  max_horizontal_speed:
    type: float32
    note: "[m/s] (optional) Maximum speed (absolute) in the NE-plane"
  flag_set_max_vertical_speed:
    type: bool
    note: true if setting a non-default vertical speed limit
  max_vertical_speed:
    type: float32
    note: "[m/s] (optional) Maximum speed (absolute) in the D-axis"
  flag_set_max_heading_rate:
    type: bool
    note: true if setting a non-default heading rate limit
  max_heading_rate:
    type: float32
    unit: absolute
    note: "[rad/s] (optional) Maximum heading rate (absolute)"
