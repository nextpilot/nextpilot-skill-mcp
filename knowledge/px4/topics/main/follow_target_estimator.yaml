# 生成物，勿手改。由 tools/topics/sync-px4-msg.py 从 FollowTargetEstimator.msg 生成
topic: follow_target_estimator
msg: FollowTargetEstimator.msg
fields:
  timestamp:
    type: uint64
    unit: us
  last_filter_reset_timestamp:
    type: uint64
    unit: microseconds
    note: time of last filter reset (microseconds)
  valid:
    type: bool
    note: True if estimator states are okay to be used
  stale:
    type: bool
    note: True if estimator stopped receiving follow_target messages for some time. The estimate can still be valid, though it might be inaccurate.
  lat_est:
    type: float64
    note: Estimated target latitude
  lon_est:
    type: float64
    note: Estimated target longitude
  alt_est:
    type: float32
    note: Estimated target altitude
  prediction_count:
    type: uint64
  fusion_count:
    type: uint64
