topic: register_ext_component_request_v0
msg: RegisterExtComponentRequestV0.msg
fields:
  timestamp:
    type: uint64
    unit: us
  request_id:
    type: uint64
    note: ID, set this to a random value
  px4_ros2_api_version:
    type: uint16
    note: Set to LATEST_PX4_ROS2_API_VERSION
  register_arming_check:
    type: bool
  register_mode:
    type: bool
    note: registering a mode also requires arming_check to be set
  register_mode_executor:
    type: bool
    unit: which is the owned mode by the executor
    note: registering an executor also requires a mode to be registered (which is the owned mode by the executor)
  enable_replace_internal_mode:
    type: bool
    note: set to true if an internal mode should be replaced
  replace_internal_mode:
    type: uint8
    note: "vehicle_status::NAVIGATION_STATE_*"
  activate_mode_immediately:
    type: bool
    unit: can only be set in combination with an executor
    note: switch to the registered mode (can only be set in combination with an executor)
