# 生成物，勿手改。由 tools/topics/sync-px4-msg.py 从 SensorMag.msg 生成
topic: sensor_mag
msg: SensorMag.msg
fields:
  timestamp:
    type: uint64
    unit: us
  timestamp_sample:
    type: uint64
    unit: us
  device_id:
    type: uint32
    note: unique device ID for the sensor that does not change between power cycles
  is_external:
    type: bool
    note: true if the sensor is not mounted on the flight controller board itself
  x:
    type: float32
    note: "[Gauss] magnetic field in the FRD board frame X-axis"
  y:
    type: float32
    note: "[Gauss] magnetic field in the FRD board frame Y-axis"
  z:
    type: float32
    note: "[Gauss] magnetic field in the FRD board frame Z-axis"
  temperature:
    type: float32
    note: "[°C] Temperature."
  range:
    type: float32
    note: "[Gauss] full-scale measurement range, 0 if unknown"
  error_count:
    type: uint32
