# 生成物，勿手改。由 tools/topics/sync-px4-msg.py 从 PositionSetpoint.msg 生成
topic: position_setpoint
msg: PositionSetpoint.msg
fields:
  timestamp:
    type: uint64
    unit: us
  valid:
    type: bool
    note: true if setpoint is valid
  type:
    type: uint8
    note: setpoint type to adjust behavior of position controller
  vx:
    type: float32
    note: local velocity setpoint in m/s in NED
  vy:
    type: float32
    note: local velocity setpoint in m/s in NED
  vz:
    type: float32
    note: local velocity setpoint in m/s in NED
  lat:
    type: float64
    note: latitude, in deg
  lon:
    type: float64
    note: longitude, in deg
  alt:
    type: float32
    note: altitude AMSL, in m
  yaw:
    type: float32
    note: yaw (only in hover), in rad [-PI..PI), NaN = leave to flight task
  loiter_radius:
    type: float32
    note: "[m] [@range 0, INF] loiter major axis radius"
  loiter_minor_radius:
    type: float32
    unit: used for non-circular loiter shapes
    note: "[m] [@range 0, INF] loiter minor axis radius (used for non-circular loiter shapes)"
  loiter_direction_counter_clockwise:
    type: bool
    note: loiter direction is clockwise by default and can be changed using this field
  loiter_orientation:
    type: float32
    note: "[rad] [@range -pi, pi] orientation of the major axis with respect to true north"
  loiter_pattern:
    type: uint8
    note: loitern pattern to follow
  acceptance_radius:
    type: float32
    unit: meters
    note: horizontal acceptance_radius (meters)
  alt_acceptance_radius:
    type: float32
    unit: meters
    note: vertical acceptance radius, only used for fixed wing guidance, NAN = let guidance choose (meters)
  course:
    type: float32
    note: "[rad] desired course (bearing) over ground, NaN = unused"
  cruising_speed:
    type: float32
    unit: not a hard constraint
    note: the generally desired cruising speed (not a hard constraint)
  gliding_enabled:
    type: bool
    unit: fixed wing only
    note: commands the vehicle to glide if the capability is available (fixed wing only)
  cruising_throttle:
    type: float32
    note: the generally desired cruising throttle (not a hard constraint), only has an effect for rover
