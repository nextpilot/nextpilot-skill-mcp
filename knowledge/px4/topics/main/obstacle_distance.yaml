# 生成物，勿手改。由 tools/topics/sync-px4-msg.py 从 ObstacleDistance.msg 生成
topic: obstacle_distance
msg: ObstacleDistance.msg
fields:
  timestamp:
    type: uint64
    unit: us
  frame:
    type: uint8
    note: Coordinate frame of reference for the yaw rotation and offset of the sensor data. Defaults to MAV_FRAME_GLOBAL, which is North aligned. For body-mounted sensors use MAV_FRAME_BODY_FRD, which is vehicle front aligned.
  sensor_type:
    type: uint8
    note: Type from MAV_DISTANCE_SENSOR enum.
  increment:
    type: float32
    note: Angular width in degrees of each array element.
  min_distance:
    type: uint16
    note: Minimum distance the sensor can measure in centimeters.
  max_distance:
    type: uint16
    note: Maximum distance the sensor can measure in centimeters.
  angle_offset:
    type: float32
    note: Relative angle offset of the 0-index element in the distances array. Value of 0 corresponds to forward. Positive is clockwise direction, negative is counter-clockwise.
