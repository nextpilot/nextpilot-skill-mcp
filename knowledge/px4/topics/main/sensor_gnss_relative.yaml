# 生成物，勿手改。由 tools/topics/sync-px4-msg.py 从 SensorGnssRelative.msg 生成
topic: sensor_gnss_relative
msg: SensorGnssRelative.msg
fields:
  timestamp:
    type: uint64
    unit: us
  timestamp_sample:
    type: uint64
    unit: us
  device_id:
    type: uint32
    note: unique device ID for the sensor that does not change between power cycles
  time_utc_usec:
    type: uint64
    note: Timestamp (microseconds, UTC), this is the timestamp which comes from the gps module. It might be unavailable right after cold start, indicated by a value of 0
  reference_station_id:
    type: uint16
    note: Reference Station ID
  heading:
    type: float32
    unit: radians
    note: Heading of the relative position vector (radians)
  heading_accuracy:
    type: float32
    unit: radians
    note: Accuracy of heading of the relative position vector (radians)
  position_length:
    type: float32
    unit: m
    note: Length of the position vector (m)
  accuracy_length:
    type: float32
    unit: m
    note: Accuracy of the position length (m)
  gnss_fix_ok:
    type: bool
    note: GNSS valid fix (i.e within DOP & accuracy masks)
  differential_solution:
    type: bool
    note: differential corrections were applied
  relative_position_valid:
    type: bool
  carrier_solution_floating:
    type: bool
    note: carrier phase range solution with floating ambiguities
  carrier_solution_fixed:
    type: bool
    note: carrier phase range solution with fixed ambiguities
  moving_base_mode:
    type: bool
    note: if the receiver is operating in moving base mode
  reference_position_miss:
    type: bool
    note: extrapolated reference position was used to compute moving base solution this epoch
  reference_observations_miss:
    type: bool
    note: extrapolated reference observations were used to compute moving base solution this epoch
  heading_valid:
    type: bool
  relative_position_normalized:
    type: bool
    note: the components of the relative position vector (including the high-precision parts) are normalized
