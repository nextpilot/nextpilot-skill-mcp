# 生成物，勿手改。由 tools/topics/sync-px4-msg.py 从 BatteryStatus.msg 生成
topic: battery_status
msg: BatteryStatus.msg
fields:
  timestamp:
    type: uint64
    unit: us
  connected:
    type: bool
    note: Whether or not a battery is connected. For power modules this is based on a voltage threshold.
  voltage_v:
    type: float32
    note: "[V] [@invalid 0] Battery voltage"
  current_a:
    type: float32
    note: "[A] [@invalid -1] Battery current"
  current_average_a:
    type: float32
    unit: for FW average in level flight
    note: "[A] [@invalid -1] Battery current average (for FW average in level flight)"
  discharged_mah:
    type: float32
    note: "[mAh] [@invalid -1] Discharged amount"
  remaining:
    type: float32
    note: "[@range 0,1] [@invalid -1] Remaining capacity"
  scale:
    type: float32
    note: "[-] [@range 1,] [@invalid -1] Scaling factor to compensate for lower actuation power caused by voltage sag"
  time_remaining_s:
    type: float32
    note: "[s] [@invalid NaN] Predicted time remaining until battery is empty under previous averaged load"
  temperature:
    type: float32
    note: "[degC] [@invalid NaN] Temperature of the battery"
  cell_count:
    type: uint8
    note: "[-] [@invalid 0] Number of cells"
  source:
    type: uint8
    note: "[@enum SOURCE] Battery source"
    values:
      0: MODULE
      1: EXTERNAL
      2: ESCS
    kind: enum
  priority:
    type: uint8
    note: "[-] Zero based priority is the connection on the Power Controller V1..Vn AKA BrickN-1"
  capacity:
    type: uint16
    note: "[mAh] Capacity of the battery when fully charged"
  cycle_count:
    type: uint16
    note: "[-] Number of discharge cycles the battery has experienced"
  average_time_to_empty:
    type: uint16
    note: "[minutes] Predicted remaining battery capacity based on the average rate of discharge"
  manufacture_date:
    type: uint16
    note: "[-] Manufacture date, part of serial number of the battery pack. Formatted as: Day + Month×32 + (Year–1980)×512"
  state_of_health:
    type: uint16
    note: "[%] [@range 0, 100] State of health. FullChargeCapacity/DesignCapacity"
  max_error:
    type: uint16
    note: "[%] [@range 1, 100] Max error, expected margin of error in the state-of-charge calculation"
  id:
    type: uint8
    note: "[-] ID number of a battery. Should be unique and consistent for the lifetime of a vehicle. 1-indexed"
  interface_error:
    type: uint16
    note: "[-] Interface error counter"
  max_cell_voltage_delta:
    type: float32
    note: "[V] Max difference between individual cell voltages"
  is_powering_off:
    type: bool
    note: Power off event imminent indication, false if unknown
  is_required:
    type: bool
    note: Set if the battery is explicitly required before arming
  warning:
    type: uint8
    note: "[@enum WARNING] Current battery warning"
    values:
      0: NONE
      1: LOW
      2: CRITICAL
      3: EMERGENCY
      4: FAILED
      6: UNHEALTHY
      7: CHARGING
    kind: enum
  faults:
    type: uint16
    note: "[@enum FAULT] Smart battery supply status/fault flags (bitmask) for health indication"
    kind: bitmask
  full_charge_capacity_wh:
    type: float32
    note: "[Wh] Compensated battery capacity"
  remaining_capacity_wh:
    type: float32
    note: "[Wh] [@invalid NaN] Compensated battery capacity remaining"
  over_discharge_count:
    type: uint16
    note: "[-] Number of battery overdischarge"
  nominal_voltage:
    type: float32
    note: "[V] [@invalid NaN] Nominal voltage of the battery pack"
  internal_resistance_estimate:
    type: float32
    note: "[Ohm] Internal resistance per cell estimate"
  ocv_estimate:
    type: float32
    note: "[V] Open circuit voltage estimate"
  ocv_estimate_filtered:
    type: float32
    note: "[V] Filtered open circuit voltage estimate"
  volt_based_soc_estimate:
    type: float32
    note: "[-] [@range 0, 1] Normalized volt based state of charge estimate"
  voltage_prediction:
    type: float32
    note: "[V] Predicted voltage"
  prediction_error:
    type: float32
    note: "[V] Prediction error"
  estimation_covariance_norm:
    type: float32
    note: "[-] Norm of the covariance matrix"
