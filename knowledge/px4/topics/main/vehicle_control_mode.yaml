  flag_control_attitude_enabled:
    type: bool
    note: true if attitude stabilization is mixed in
  flag_control_rates_enabled:
    type: bool
    note: true if rates are stabilized
  flag_control_allocation_enabled:
    type: bool
    note: true if control allocation is enabled
