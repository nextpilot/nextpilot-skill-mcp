# 生成物，勿手改。由 tools/topics/sync-px4-msg.py 从 BatteryStatus.msg 生成
topic: battery_status
msg: BatteryStatus.msg
fields:
  timestamp:
    type: uint64
    unit: us
  connected:
    type: bool
    note: Whether or not a battery is connected, based on a voltage threshold
  voltage_v:
    type: float32
    note: Battery voltage in volts, 0 if unknown
  current_a:
    type: float32
    note: Battery current in amperes, -1 if unknown
  current_average_a:
    type: float32
    note: Battery current average in amperes (for FW average in level flight), -1 if unknown
  discharged_mah:
    type: float32
    note: Discharged amount in mAh, -1 if unknown
  remaining:
    type: float32
    note: From 1 to 0, -1 if unknown
  scale:
    type: float32
    note: Power scaling factor, >= 1, or -1 if unknown
  time_remaining_s:
    type: float32
    note: predicted time in seconds remaining until battery is empty under previous averaged load, NAN if unknown
  temperature:
    type: float32
    note: Temperature of the battery in degrees Celcius, NaN if unknown
  cell_count:
    type: uint8
    note: Number of cells, 0 if unknown
  source:
    type: uint8
    note: Battery source
    values:
      0: MODULE
      1: EXTERNAL
      2: ESCS
    kind: enum
  priority:
    type: uint8
    note: Zero based priority is the connection on the Power Controller V1..Vn AKA BrickN-1
  capacity:
    type: uint16
    note: actual capacity of the battery
  cycle_count:
    type: uint16
    note: number of discharge cycles the battery has experienced
  average_time_to_empty:
    type: uint16
    note: predicted remaining battery capacity based on the average rate of discharge in min
  serial_number:
    type: uint16
    note: serial number of the battery pack
  manufacture_date:
    type: uint16
    note: "manufacture date, part of serial number of the battery pack. Formatted as: Day + Month×32 + (Year–1980)×512"
  state_of_health:
    type: uint16
    note: state of health. FullChargeCapacity/DesignCapacity, 0-100%.
  max_error:
    type: uint16
    note: max error, expected margin of error in % in the state-of-charge calculation with a range of 1 to 100%
  id:
    type: uint8
    note: ID number of a battery. Should be unique and consistent for the lifetime of a vehicle. 1-indexed.
  interface_error:
    type: uint16
    note: interface error counter
  max_cell_voltage_delta:
    type: float32
    note: Max difference between individual cell voltages
  is_powering_off:
    type: bool
    note: Power off event imminent indication, false if unknown
  is_required:
    type: bool
    note: Set if the battery is explicitly required before arming
  faults:
    type: uint16
    note: Smart battery supply status/fault flags (bitmask) for health indication.
    kind: bitmask
  warning:
    type: uint8
    note: Current battery warning
    values:
      0: NONE
      1: LOW
      2: CRITICAL
      3: EMERGENCY
      4: FAILED
    kind: enum
  full_charge_capacity_wh:
    type: float32
    note: The compensated battery capacity
  remaining_capacity_wh:
    type: float32
    note: The compensated battery capacity remaining
  over_discharge_count:
    type: uint16
    note: Number of battery overdischarge
  nominal_voltage:
    type: float32
    note: Nominal voltage of the battery pack
  internal_resistance_estimate:
    type: float32
    note: "[Ohm] Internal resistance per cell estimate"
  ocv_estimate:
    type: float32
    note: "[V] Open circuit voltage estimate"
  ocv_estimate_filtered:
    type: float32
    note: "[V] Filtered open circuit voltage estimate"
  volt_based_soc_estimate:
    type: float32
    note: "[0, 1] Normalized volt based state of charge estimate"
  voltage_prediction:
    type: float32
    note: "[V] Predicted voltage"
  prediction_error:
    type: float32
    note: "[V] Prediction error"
  estimation_covariance_norm:
    type: float32
    note: Norm of the covariance matrix
