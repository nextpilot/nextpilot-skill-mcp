# 生成物，勿手改。由 tools/topics/sync-px4-msg.py 从 RoverSteeringSetpoint.msg 生成
topic: rover_steering_setpoint
msg: RoverSteeringSetpoint.msg
fields:
  timestamp:
    type: uint64
    unit: us
  normalized_steering_angle:
    type: float32
    note: "[-1, 1] Normalized steering angle (Ackermann only, Positiv: Steer right, Negativ: Steer left)"
  normalized_speed_diff:
    type: float32
    note: "[-1, 1] Normalized speed difference between the left and right wheels of the rover (Differential/Mecanum only, Positiv = Turn right, Negativ: Turn left)"
