# 生成物，勿手改。由 tools/topics/sync-px4-msg.py 从 SensorMag.msg 生成
topic: sensor_mag
msg: SensorMag.msg
fields:
  timestamp:
    type: uint64
    unit: us
  timestamp_sample:
    type: uint64
    unit: us
  device_id:
    type: uint32
    note: unique device ID for the sensor that does not change between power cycles
  x:
    type: float32
    note: magnetic field in the FRD board frame X-axis in Gauss
  y:
    type: float32
    note: magnetic field in the FRD board frame Y-axis in Gauss
  z:
    type: float32
    note: magnetic field in the FRD board frame Z-axis in Gauss
  temperature:
    type: float32
    note: temperature in degrees Celsius
  error_count:
    type: uint32
