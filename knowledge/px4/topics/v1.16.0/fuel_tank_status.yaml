# 生成物，勿手改。由 tools/topics/sync-px4-msg.py 从 FuelTankStatus.msg 生成
topic: fuel_tank_status
msg: FuelTankStatus.msg
fields:
  timestamp:
    type: uint64
    unit: us
  maximum_fuel_capacity:
    type: float32
    note: maximum fuel capacity. Must always be provided, either from the driver or a parameter
  consumed_fuel:
    type: float32
    note: consumed fuel, NaN if not measured. Should not be inferred from the max fuel capacity
  fuel_consumption_rate:
    type: float32
    note: fuel consumption rate, NaN if not measured
  percent_remaining:
    type: uint8
    note: percentage of remaining fuel, UINT8_MAX if not provided
  remaining_fuel:
    type: float32
    note: remaining fuel, NaN if not measured. Should not be inferred from the max fuel capacity
  fuel_tank_id:
    type: uint8
    note: identifier for the fuel tank. Must match ID of other messages for same fuel system. 0 by default when only a single tank exists
  fuel_type:
    type: uint32
    note: type of fuel based on MAV_FUEL_TYPE enum. Set to MAV_FUEL_TYPE_UNKNOWN if unknown or it does not fit the provided types
  temperature:
    type: float32
    note: fuel temperature in Kelvin, NaN if not measured
