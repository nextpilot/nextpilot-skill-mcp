topic: trajectory_setpoint
msg: TrajectorySetpoint.msg
fields:
  timestamp:
    type: uint64
    unit: us
  yaw:
    type: float32
    note: euler angle of desired attitude in radians -PI..+PI
  yawspeed:
    type: float32
    note: angular velocity around NED frame z-axis in radians/second
