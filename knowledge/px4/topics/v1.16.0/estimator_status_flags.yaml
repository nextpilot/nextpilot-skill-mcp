# 生成物，勿手改。由 tools/topics/sync-px4-msg.py 从 EstimatorStatusFlags.msg 生成
topic: estimator_status_flags
msg: EstimatorStatusFlags.msg
fields:
  timestamp:
    type: uint64
    unit: us
  timestamp_sample:
    type: uint64
    unit: us
  control_status_changes:
    type: uint32
    note: number of filter control status (cs) changes
  cs_tilt_align:
    type: bool
    note: 0 - true if the filter tilt alignment is complete
  cs_yaw_align:
    type: bool
    note: 1 - true if the filter yaw alignment is complete
  cs_gnss_pos:
    type: bool
    note: 2 - true if GNSS position measurement fusion is intended
  cs_opt_flow:
    type: bool
    note: 3 - true if optical flow measurements fusion is intended
  cs_mag_hdg:
    type: bool
    note: 4 - true if a simple magnetic yaw heading fusion is intended
  cs_mag_3d:
    type: bool
    note: 5 - true if 3-axis magnetometer measurement fusion is intended
  cs_mag_dec:
    type: bool
    note: 6 - true if synthetic magnetic declination measurements fusion is intended
  cs_in_air:
    type: bool
    note: 7 - true when the vehicle is airborne
  cs_wind:
    type: bool
    note: 8 - true when wind velocity is being estimated
  cs_baro_hgt:
    type: bool
    note: 9 - true when baro data is being fused
  cs_rng_hgt:
    type: bool
    note: 10 - true when range finder data is being fused for height aiding
  cs_gps_hgt:
    type: bool
    note: 11 - true when GPS altitude is being fused
  cs_ev_pos:
    type: bool
    note: 12 - true when local position data fusion from external vision is intended
  cs_ev_yaw:
    type: bool
    note: 13 - true when yaw data from external vision measurements fusion is intended
  cs_ev_hgt:
    type: bool
    note: 14 - true when height data from external vision measurements is being fused
  cs_fuse_beta:
    type: bool
    note: 15 - true when synthetic sideslip measurements are being fused
  cs_mag_field_disturbed:
    type: bool
    note: 16 - true when the mag field does not match the expected strength
  cs_fixed_wing:
    type: bool
    note: 17 - true when the vehicle is operating as a fixed wing vehicle
  cs_mag_fault:
    type: bool
    note: 18 - true when the magnetometer has been declared faulty and is no longer being used
  cs_fuse_aspd:
    type: bool
    note: 19 - true when airspeed measurements are being fused
  cs_gnd_effect:
    type: bool
    note: 20 - true when protection from ground effect induced static pressure rise is active
  cs_rng_stuck:
    type: bool
    note: 21 - true when rng data wasn't ready for more than 10s and new rng values haven't changed enough
  cs_gnss_yaw:
    type: bool
    note: 22 - true when yaw (not ground course) data fusion from a GPS receiver is intended
  cs_mag_aligned_in_flight:
    type: bool
    note: 23 - true when the in-flight mag field alignment has been completed
  cs_ev_vel:
    type: bool
    note: 24 - true when local frame velocity data fusion from external vision measurements is intended
  cs_synthetic_mag_z:
    type: bool
    note: 25 - true when we are using a synthesized measurement for the magnetometer Z component
  cs_vehicle_at_rest:
    type: bool
    note: 26 - true when the vehicle is at rest
  cs_gnss_yaw_fault:
    type: bool
    note: 27 - true when the GNSS heading has been declared faulty and is no longer being used
  cs_rng_fault:
    type: bool
    note: 28 - true when the range finder has been declared faulty and is no longer being used
  cs_inertial_dead_reckoning:
    type: bool
    note: 29 - true if we are no longer fusing measurements that constrain horizontal velocity drift
  cs_wind_dead_reckoning:
    type: bool
    note: 30 - true if we are navigationg reliant on wind relative measurements
  cs_rng_kin_consistent:
    type: bool
    note: 31 - true when the range finder kinematic consistency check is passing
  cs_fake_pos:
    type: bool
    note: 32 - true when fake position measurements are being fused
  cs_fake_hgt:
    type: bool
    note: 33 - true when fake height measurements are being fused
  cs_gravity_vector:
    type: bool
    note: 34 - true when gravity vector measurements are being fused
  cs_mag:
    type: bool
    note: 35 - true if 3-axis magnetometer measurement fusion (mag states only) is intended
  cs_ev_yaw_fault:
    type: bool
    note: 36 - true when the EV heading has been declared faulty and is no longer being used
  cs_mag_heading_consistent:
    type: bool
    note: 37 - true when the heading obtained from mag data is declared consistent with the filter
  cs_aux_gpos:
    type: bool
    note: 38 - true if auxiliary global position measurement fusion is intended
  cs_rng_terrain:
    type: bool
    note: 39 - true if we are fusing range finder data for terrain
  cs_opt_flow_terrain:
    type: bool
    note: 40 - true if we are fusing flow data for terrain
  cs_valid_fake_pos:
    type: bool
    note: 41 - true if a valid constant position is being fused
  cs_constant_pos:
    type: bool
    note: 42 - true if the vehicle is at a constant position
  cs_baro_fault:
    type: bool
    note: 43 - true when the current baro has been declared faulty and is no longer being used
  cs_gnss_vel:
    type: bool
    note: 44 - true if GNSS velocity measurement fusion is intended
  fault_status_changes:
    type: uint32
    note: number of filter fault status (fs) changes
  fs_bad_mag_x:
    type: bool
    note: 0 - true if the fusion of the magnetometer X-axis has encountered a numerical error
  fs_bad_mag_y:
    type: bool
    note: 1 - true if the fusion of the magnetometer Y-axis has encountered a numerical error
  fs_bad_mag_z:
    type: bool
    note: 2 - true if the fusion of the magnetometer Z-axis has encountered a numerical error
  fs_bad_hdg:
    type: bool
    note: 3 - true if the fusion of the heading angle has encountered a numerical error
  fs_bad_mag_decl:
    type: bool
    note: 4 - true if the fusion of the magnetic declination has encountered a numerical error
  fs_bad_airspeed:
    type: bool
    note: 5 - true if fusion of the airspeed has encountered a numerical error
  fs_bad_sideslip:
    type: bool
    note: 6 - true if fusion of the synthetic sideslip constraint has encountered a numerical error
  fs_bad_optflow_x:
    type: bool
    note: 7 - true if fusion of the optical flow X axis has encountered a numerical error
  fs_bad_optflow_y:
    type: bool
    note: 8 - true if fusion of the optical flow Y axis has encountered a numerical error
  fs_bad_acc_vertical:
    type: bool
    note: 10 - true if bad vertical accelerometer data has been detected
  fs_bad_acc_clipping:
    type: bool
    unit: asymmetric railing
    note: 11 - true if delta velocity data contains clipping (asymmetric railing)
  innovation_fault_status_changes:
    type: uint32
    note: number of innovation fault status (reject) changes
  reject_hor_vel:
    type: bool
    note: 0 - true if horizontal velocity observations have been rejected
  reject_ver_vel:
    type: bool
    note: 1 - true if vertical velocity observations have been rejected
  reject_hor_pos:
    type: bool
    note: 2 - true if horizontal position observations have been rejected
  reject_ver_pos:
    type: bool
    note: 3 - true if vertical position observations have been rejected
  reject_yaw:
    type: bool
    note: 7 - true if the yaw observation has been rejected
  reject_airspeed:
    type: bool
    note: 8 - true if the airspeed observation has been rejected
  reject_sideslip:
    type: bool
    note: 9 - true if the synthetic sideslip observation has been rejected
  reject_hagl:
    type: bool
    note: 10 - true if the height above ground observation has been rejected
  reject_optflow_x:
    type: bool
    note: 11 - true if the X optical flow observation has been rejected
  reject_optflow_y:
    type: bool
    note: 12 - true if the Y optical flow observation has been rejected
