# 生成物，勿手改。由 tools/topics/sync-px4-msg.py 从 EscStatus.msg 生成
topic: esc_status
msg: EscStatus.msg
fields:
  timestamp:
    type: uint64
    unit: us
  counter:
    type: uint16
    note: incremented by the writing thread everytime new data is stored
  esc_count:
    type: uint8
    note: number of connected ESCs
  esc_connectiontype:
    type: uint8
    note: how ESCs connected to the system
  esc_online_flags:
    type: uint8
    note: Bitmask indicating which ESC is online/offline
    kind: bitmask
  esc_armed_flags:
    type: uint8
    note: Bitmask indicating which ESC is armed. For ESC's where the arming state is not known (returned by the ESC), the arming bits should always be set.
    kind: bitmask
