# 生成物，勿手改。由 tools/topics/sync-px4-msg.py 从 AirspeedValidated.msg 生成
topic: airspeed_validated
msg: AirspeedValidated.msg
fields:
  timestamp:
    type: uint64
    unit: us
  indicated_airspeed_m_s:
    type: float32
    note: indicated airspeed in m/s (IAS), set to NAN if invalid
  calibrated_airspeed_m_s:
    type: float32
    note: calibrated airspeed in m/s (CAS, accounts for instrumentation errors), set to NAN if invalid
  true_airspeed_m_s:
    type: float32
    note: true filtered airspeed in m/s (TAS), set to NAN if invalid
  calibrated_ground_minus_wind_m_s:
    type: float32
    note: CAS calculated from groundspeed - windspeed, where windspeed is estimated based on a zero-sideslip assumption, set to NAN if invalid
  true_ground_minus_wind_m_s:
    type: float32
    note: TAS calculated from groundspeed - windspeed, where windspeed is estimated based on a zero-sideslip assumption, set to NAN if invalid
  airspeed_sensor_measurement_valid:
    type: bool
    note: True if data from at least one airspeed sensor is declared valid.
  selected_airspeed_index:
    type: int8
    note: "1-3: airspeed sensor index, 0: groundspeed-windspeed, -1: airspeed invalid"
