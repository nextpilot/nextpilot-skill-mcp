# 生成物，勿手改。由 tools/topics/sync-px4-msg.py 从 EstimatorEventFlags.msg 生成
topic: estimator_event_flags
msg: EstimatorEventFlags.msg
fields:
  timestamp:
    type: uint64
    unit: us
  timestamp_sample:
    type: uint64
    unit: us
  information_event_changes:
    type: uint32
    note: number of information event changes
  gps_checks_passed:
    type: bool
    note: 0 - true when gps quality checks are passing passed
  reset_vel_to_gps:
    type: bool
    note: 1 - true when the velocity states are reset to the gps measurement
  reset_vel_to_flow:
    type: bool
    note: 2 - true when the velocity states are reset using the optical flow measurement
  reset_vel_to_vision:
    type: bool
    note: 3 - true when the velocity states are reset to the vision system measurement
  reset_vel_to_zero:
    type: bool
    note: 4 - true when the velocity states are reset to zero
  reset_pos_to_last_known:
    type: bool
    note: 5 - true when the position states are reset to the last known position
  reset_pos_to_gps:
    type: bool
    note: 6 - true when the position states are reset to the gps measurement
  reset_pos_to_vision:
    type: bool
    note: 7 - true when the position states are reset to the vision system measurement
  starting_gps_fusion:
    type: bool
    note: 8 - true when the filter starts using gps measurements to correct the state estimates
  starting_vision_pos_fusion:
    type: bool
    note: 9 - true when the filter starts using vision system position measurements to correct the state estimates
  starting_vision_vel_fusion:
    type: bool
    note: 10 - true when the filter starts using vision system velocity measurements to correct the state estimates
  starting_vision_yaw_fusion:
    type: bool
    note: 11 - true when the filter starts using vision system yaw  measurements to correct the state estimates
  yaw_aligned_to_imu_gps:
    type: bool
    note: 12 - true when the filter resets the yaw to an estimate derived from IMU and GPS data
  reset_hgt_to_baro:
    type: bool
    note: 13 - true when the vertical position state is reset to the baro measurement
  reset_hgt_to_gps:
    type: bool
    note: 14 - true when the vertical position state is reset to the gps measurement
  reset_hgt_to_rng:
    type: bool
    note: 15 - true when the vertical position state is reset to the rng measurement
  reset_hgt_to_ev:
    type: bool
    note: 16 - true when the vertical position state is reset to the ev measurement
  warning_event_changes:
    type: uint32
    note: number of warning event changes
  gps_quality_poor:
    type: bool
    note: 0 - true when the gps is failing quality checks
  gps_fusion_timout:
    type: bool
    note: 1 - true when the gps data has not been used to correct the state estimates for a significant time period
  gps_data_stopped:
    type: bool
    note: 2 - true when the gps data has stopped for a significant time period
  gps_data_stopped_using_alternate:
    type: bool
    note: 3 - true when the gps data has stopped for a significant time period but the filter is able to use other sources of data to maintain navigation
  height_sensor_timeout:
    type: bool
    note: 4 - true when the height sensor has not been used to correct the state estimates for a significant time period
  stopping_navigation:
    type: bool
    note: 5 - true when the filter has insufficient data to estimate velocity and position and is falling back to an attitude, height and height rate mode of operation
  invalid_accel_bias_cov_reset:
    type: bool
    note: 6 - true when the filter has detected bad acceerometer bias state esitmstes and has reset the corresponding covariance matrix elements
  bad_yaw_using_gps_course:
    type: bool
    note: 7 - true when the filter has detected an invalid yaw estimate and has reset the yaw angle to the GPS ground course
  stopping_mag_use:
    type: bool
    note: 8 - true when the filter has detected bad magnetometer data and is stopping further use of the magnetometer data
  vision_data_stopped:
    type: bool
    note: 9 - true when the vision system data has stopped for a significant time period
  emergency_yaw_reset_mag_stopped:
    type: bool
    note: 10 - true when the filter has detected bad magnetometer data, has reset the yaw to anothter source of data and has stopped further use of the magnetometer data
  emergency_yaw_reset_gps_yaw_stopped:
    type: bool
    note: 11 - true when the filter has detected bad GNSS yaw data, has reset the yaw to anothter source of data and has stopped further use of the GNSS yaw data
