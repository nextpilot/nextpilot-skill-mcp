# 生成物，勿手改。由 tools/topics/sync-px4-msg.py 从 OrbitStatus.msg 生成
topic: orbit_status
msg: OrbitStatus.msg
fields:
  timestamp:
    type: uint64
    unit: us
  radius:
    type: float32
    note: Radius of the orbit circle. Positive values orbit clockwise, negative values orbit counter-clockwise. [m]
  frame:
    type: uint8
    note: "The coordinate system of the fields: x, y, z."
  x:
    type: float64
    note: "X coordinate of center point. Coordinate system depends on frame field: local = x position in meters * 1e4, global = latitude in degrees * 1e7."
  y:
    type: float64
    note: "Y coordinate of center point. Coordinate system depends on frame field: local = y position in meters * 1e4, global = latitude in degrees * 1e7."
  z:
    type: float32
    note: Altitude of center point. Coordinate system depends on frame field.
  yaw_behaviour:
    type: uint8
