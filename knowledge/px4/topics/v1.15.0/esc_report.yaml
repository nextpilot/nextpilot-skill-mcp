# 生成物，勿手改。由 tools/topics/sync-px4-msg.py 从 EscReport.msg 生成
topic: esc_report
msg: EscReport.msg
fields:
  timestamp:
    type: uint64
    unit: us
  esc_errorcount:
    type: uint32
    note: Number of reported errors by ESC - if supported
  esc_rpm:
    type: int32
    note: Motor RPM, negative for reverse rotation [RPM] - if supported
  esc_voltage:
    type: float32
    note: Voltage measured from current ESC [V] - if supported
  esc_current:
    type: float32
    note: Current measured from current ESC [A] - if supported
  esc_temperature:
    type: float32
    note: Temperature measured from current ESC [degC] - if supported
  esc_address:
    type: uint8
    unit: in most cases 1-8 / must be set by driver
    note: Address of current ESC (in most cases 1-8 / must be set by driver)
  esc_cmdcount:
    type: uint8
    note: Counter of number of commands
  esc_state:
    type: uint8
    note: State of ESC - depend on Vendor
  actuator_function:
    type: uint8
    unit: one of Motor1...MotorN
    note: actuator output function (one of Motor1...MotorN)
  failures:
    type: uint16
    note: Bitmask to indicate the internal ESC faults
    kind: bitmask
  esc_power:
    type: int8
    unit: negative values reserved
    note: Applied power 0-100 in % (negative values reserved)
