topic: iridiumsbd_status
msg: IridiumsbdStatus.msg
fields:
  timestamp:
    type: uint64
    unit: us
  last_heartbeat:
    type: uint64
    note: timestamp of the last successful sbd session
  tx_buf_write_index:
    type: uint16
    note: current size of the tx buffer
  rx_buf_read_index:
    type: uint16
    note: the rx buffer is parsed up to that index
  rx_buf_end_index:
    type: uint16
    note: current size of the rx buffer
  failed_sbd_sessions:
    type: uint16
    note: number of failed sbd sessions
  successful_sbd_sessions:
    type: uint16
    note: number of successful sbd sessions
  num_tx_buf_reset:
    type: uint16
    note: number of times the tx buffer was reset
  signal_quality:
    type: uint8
    note: current signal quality, 0 is no signal, 5 the best
  state:
    type: uint8
    note: current state of the driver, see the satcom_state of IridiumSBD.h for the definition
  ring_pending:
    type: bool
    note: indicates if a ring call is pending
  tx_buf_write_pending:
    type: bool
    note: indicates if a tx buffer write is pending
  tx_session_pending:
    type: bool
    note: indicates if a tx session is pending
  rx_read_pending:
    type: bool
    note: indicates if a rx read is pending
  rx_session_pending:
    type: bool
    note: indicates if a rx session is pending
