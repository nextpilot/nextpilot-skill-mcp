# 生成物，勿手改。由 tools/topics/sync-px4-msg.py 从 HoverThrustEstimate.msg 生成
topic: hover_thrust_estimate
msg: HoverThrustEstimate.msg
fields:
  timestamp:
    type: uint64
    unit: us
  timestamp_sample:
    type: uint64
    unit: us
  hover_thrust:
    type: float32
    note: estimated hover thrust [0.1, 0.9]
  hover_thrust_var:
    type: float32
    note: estimated hover thrust variance
  accel_innov:
    type: float32
    note: innovation of the last acceleration fusion
  accel_innov_var:
    type: float32
    note: innovation variance of the last acceleration fusion
  accel_innov_test_ratio:
    type: float32
    note: normalized innovation squared test ratio
  accel_noise_var:
    type: float32
    note: vertical acceleration noise variance estimated form innovation residual
  valid:
    type: bool
