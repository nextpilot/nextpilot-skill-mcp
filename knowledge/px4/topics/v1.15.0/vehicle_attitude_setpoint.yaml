topic: vehicle_attitude_setpoint
msg: VehicleAttitudeSetpoint.msg
fields:
  timestamp:
    type: uint64
    unit: us
  roll_body:
    type: float32
    unit: can be NaN for FW
    note: body angle in NED frame (can be NaN for FW)
  pitch_body:
    type: float32
    unit: can be NaN for FW
    note: body angle in NED frame (can be NaN for FW)
  yaw_body:
    type: float32
    unit: can be NaN for FW
    note: body angle in NED frame (can be NaN for FW)
  yaw_sp_move_rate:
    type: float32
    unit: commanded by user
    note: rad/s (commanded by user)
  reset_integral:
    type: bool
    unit: navigation logic change
    note: Reset roll/pitch/yaw integrals (navigation logic change)
  fw_control_yaw_wheel:
    type: bool
    unit: used for auto takeoff on runway
    note: control heading with steering wheel (used for auto takeoff on runway)
