# 生成物，勿手改。由 tools/topics/sync-px4-msg.py 从 AirspeedWind.msg 生成
topic: airspeed_wind
msg: AirspeedWind.msg
fields:
  timestamp:
    type: uint64
    unit: us
  timestamp_sample:
    type: uint64
    unit: us
  windspeed_north:
    type: float32
    unit: m/sec
    note: Wind component in north / X direction (m/sec)
  windspeed_east:
    type: float32
    unit: m/sec
    note: Wind component in east / Y direction (m/sec)
  variance_north:
    type: float32
    note: Wind estimate error variance in north / X direction (m/sec)**2 - set to zero (no uncertainty) if not estimated
  variance_east:
    type: float32
    note: Wind estimate error variance in east / Y direction (m/sec)**2 - set to zero (no uncertainty) if not estimated
  tas_innov:
    type: float32
    note: True airspeed innovation
  tas_innov_var:
    type: float32
    note: True airspeed innovation variance
  tas_scale_raw:
    type: float32
    unit: not validated
    note: Estimated true airspeed scale factor (not validated)
  tas_scale_raw_var:
    type: float32
    note: True airspeed scale factor variance
  tas_scale_validated:
    type: float32
    note: Estimated true airspeed scale factor after validation
  beta_innov:
    type: float32
    note: Sideslip measurement innovation
  beta_innov_var:
    type: float32
    note: Sideslip measurement innovation variance
  source:
    type: uint8
    note: source of wind estimate
    values:
      0: ONLY
      1: "1"
      2: "2"
      3: "3"
    kind: enum
