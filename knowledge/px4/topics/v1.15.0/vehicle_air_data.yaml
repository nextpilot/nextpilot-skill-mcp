# 生成物，勿手改。由 tools/topics/sync-px4-msg.py 从 VehicleAirData.msg 生成
topic: vehicle_air_data
msg: VehicleAirData.msg
fields:
  timestamp:
    type: uint64
    unit: us
  timestamp_sample:
    type: uint64
    unit: us
  baro_device_id:
    type: uint32
    note: unique device ID for the selected barometer
  baro_alt_meter:
    type: float32
    note: Altitude above MSL calculated from temperature compensated baro sensor data using an ISA corrected for sea level pressure SENS_BARO_QNH.
  baro_temp_celcius:
    type: float32
    note: Temperature in degrees Celsius
  baro_pressure_pa:
    type: float32
    note: Absolute pressure in Pascals
  rho:
    type: float32
    note: air density
  eas2tas:
    type: float32
    note: equivalent airspeed to true airspeed conversion factor
  calibration_count:
    type: uint8
    note: Calibration changed counter. Monotonically increases whenever calibration changes.
