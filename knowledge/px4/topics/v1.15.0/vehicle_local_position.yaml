# 生成物，勿手改。由 tools/topics/sync-px4-msg.py 从 VehicleLocalPosition.msg 生成
topic: vehicle_local_position
msg: VehicleLocalPosition.msg
fields:
  timestamp:
    type: uint64
    unit: us
  timestamp_sample:
    type: uint64
    unit: us
  xy_valid:
    type: bool
    note: true if x and y are valid
  z_valid:
    type: bool
    note: true if z is valid
  v_xy_valid:
    type: bool
    note: true if vx and vy are valid
  v_z_valid:
    type: bool
    note: true if vz is valid
  x:
    type: float32
    unit: metres
    note: North position in NED earth-fixed frame, (metres)
  y:
    type: float32
    unit: metres
    note: East position in NED earth-fixed frame, (metres)
  z:
    type: float32
    unit: metres
    note: Down position (negative altitude) in NED earth-fixed frame, (metres)
  xy_reset_counter:
    type: uint8
    note: Index of latest lateral position estimate reset
  delta_z:
    type: float32
    note: Amount of vertical shift of position estimate in latest reset [m]
  z_reset_counter:
    type: uint8
    note: Index of latest vertical position estimate reset
  vx:
    type: float32
    unit: metres/sec
    note: North velocity in NED earth-fixed frame, (metres/sec)
  vy:
    type: float32
    unit: metres/sec
    note: East velocity in NED earth-fixed frame, (metres/sec)
  vz:
    type: float32
    unit: metres/sec
    note: Down velocity in NED earth-fixed frame, (metres/sec)
  z_deriv:
    type: float32
    unit: metres/sec
    note: Down position time derivative in NED earth-fixed frame, (metres/sec)
  vxy_reset_counter:
    type: uint8
    note: Index of latest vertical velocity estimate reset
  delta_vz:
    type: float32
    note: Amount of vertical shift of velocity estimate in latest reset [m/s]
  vz_reset_counter:
    type: uint8
    note: Index of latest vertical velocity estimate reset
  ax:
    type: float32
    unit: metres/sec^2
    note: North velocity derivative in NED earth-fixed frame, (metres/sec^2)
  ay:
    type: float32
    unit: metres/sec^2
    note: East velocity derivative in NED earth-fixed frame, (metres/sec^2)
  az:
    type: float32
    unit: metres/sec^2
    note: Down velocity derivative in NED earth-fixed frame, (metres/sec^2)
  heading:
    type: float32
    unit: radians
    note: Euler yaw angle transforming the tangent plane relative to NED earth-fixed frame, -PI..+PI,  (radians)
  heading_var:
    type: float32
  unaided_heading:
    type: float32
    note: Same as heading but generated by integrating corrected gyro data only
  delta_heading:
    type: float32
    note: Heading delta caused by latest heading reset [rad]
  heading_reset_counter:
    type: uint8
    note: Index of latest heading reset
  heading_good_for_control:
    type: bool
  tilt_var:
    type: float32
  xy_global:
    type: bool
    note: true if position (x, y) has a valid global reference (ref_lat, ref_lon)
  z_global:
    type: bool
    note: true if z has a valid global reference (ref_alt)
  ref_timestamp:
    type: uint64
    unit: microseconds
    note: Time when reference position was set since system start, (microseconds)
  ref_lat:
    type: float64
    unit: degrees
    note: Reference point latitude, (degrees)
  ref_lon:
    type: float64
    unit: degrees
    note: Reference point longitude, (degrees)
  ref_alt:
    type: float32
    unit: metres
    note: Reference altitude AMSL, (metres)
  dist_bottom:
    type: float32
    unit: metres
    note: Distance from from bottom surface to ground, (metres)
    values:
      0: NONE
      1: RANGE
      2: FLOW
    kind: enum
  dist_bottom_valid:
    type: bool
    note: true if distance to bottom surface is valid
  dist_bottom_sensor_bitfield:
    type: uint8
    note: bitfield indicating what type of sensor is used to estimate dist_bottom
  eph:
    type: float32
    unit: metres
    note: Standard deviation of horizontal position error, (metres)
  epv:
    type: float32
    unit: metres
    note: Standard deviation of vertical position error, (metres)
  evh:
    type: float32
    unit: metres/sec
    note: Standard deviation of horizontal velocity error, (metres/sec)
  evv:
    type: float32
    unit: metres/sec
    note: Standard deviation of vertical velocity error, (metres/sec)
  dead_reckoning:
    type: bool
    note: True if this position is estimated through dead-reckoning
  vxy_max:
    type: float32
    unit: meters/sec
    note: maximum horizontal speed - set to 0 when limiting not required (meters/sec)
  vz_max:
    type: float32
    unit: meters/sec
    note: maximum vertical speed - set to 0 when limiting not required (meters/sec)
  hagl_min:
    type: float32
    unit: meters
    note: minimum height above ground level - set to 0 when limiting not required (meters)
  hagl_max:
    type: float32
    unit: meters
    note: maximum height above ground level - set to 0 when limiting not required (meters)
