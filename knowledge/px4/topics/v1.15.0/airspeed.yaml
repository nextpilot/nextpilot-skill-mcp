# 生成物，勿手改。由 tools/topics/sync-px4-msg.py 从 Airspeed.msg 生成
topic: airspeed
msg: Airspeed.msg
fields:
  timestamp:
    type: uint64
    unit: us
  timestamp_sample:
    type: uint64
    unit: us
  indicated_airspeed_m_s:
    type: float32
    note: indicated airspeed in m/s
  true_airspeed_m_s:
    type: float32
    note: true filtered airspeed in m/s
  air_temperature_celsius:
    type: float32
    note: air temperature in degrees Celsius, -1000 if unknown
  confidence:
    type: float32
    note: confidence value from 0 to 1 for this sensor
