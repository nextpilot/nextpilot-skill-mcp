# 生成物，勿手改。由 tools/topics/sync-px4-msg.py 从 VehicleGlobalPosition.msg 生成
topic: vehicle_global_position
msg: VehicleGlobalPosition.msg
fields:
  timestamp:
    type: uint64
    unit: us
  timestamp_sample:
    type: uint64
    unit: us
  lat:
    type: float64
    unit: degrees
    note: Latitude, (degrees)
  lon:
    type: float64
    unit: degrees
    note: Longitude, (degrees)
  alt:
    type: float32
    unit: meters
    note: Altitude AMSL, (meters)
  alt_ellipsoid:
    type: float32
    unit: meters
    note: Altitude above ellipsoid, (meters)
  delta_alt:
    type: float32
    note: Reset delta for altitude
  lat_lon_reset_counter:
    type: uint8
    note: Counter for reset events on horizontal position coordinates
  alt_reset_counter:
    type: uint8
    note: Counter for reset events on altitude
  eph:
    type: float32
    unit: metres
    note: Standard deviation of horizontal position error, (metres)
  epv:
    type: float32
    unit: metres
    note: Standard deviation of vertical position error, (metres)
  terrain_alt:
    type: float32
    unit: metres
    note: Terrain altitude WGS84, (metres)
  terrain_alt_valid:
    type: bool
    note: Terrain altitude estimate is valid
  dead_reckoning:
    type: bool
    note: True if this position is estimated through dead-reckoning
