# 生成物，勿手改。由 tools/topics/sync-px4-msg.py 从 ActuatorArmed.msg 生成
topic: actuator_armed
msg: ActuatorArmed.msg
fields:
  timestamp:
    type: uint64
    unit: us
  armed:
    type: bool
    note: Set to true if system is armed
  prearmed:
    type: bool
    note: Set to true if the actuator safety is disabled but motors are not armed
  ready_to_arm:
    type: bool
    note: Set to true if system is ready to be armed
  lockdown:
    type: bool
    unit: due to emergency or HIL
    note: Set to true if actuators are forced to being disabled (due to emergency or HIL)
  manual_lockdown:
    type: bool
    note: Set to true if manual throttle kill switch is engaged
  force_failsafe:
    type: bool
    note: Set to true if the actuators are forced to the failsafe position
  in_esc_calibration_mode:
    type: bool
    note: IO/FMU should ignore messages from the actuator controls topics
