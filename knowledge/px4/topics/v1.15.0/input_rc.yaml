# 生成物，勿手改。由 tools/topics/sync-px4-msg.py 从 InputRc.msg 生成
topic: input_rc
msg: InputRc.msg
fields:
  timestamp:
    type: uint64
    unit: us
  timestamp_last_signal:
    type: uint64
    note: last valid reception time
  channel_count:
    type: uint8
    note: number of channels actually being seen
  rssi:
    type: int32
    note: "receive signal strength indicator (RSSI): < 0: Undefined, 0: no signal, 100: full reception"
    values:
      100: MAX
    kind: enum
  rc_failsafe:
    type: bool
    note: "explicit failsafe flag: true on TX failure or TX out of range , false otherwise. Only the true state is reliable, as there are some (PPM) receivers on the market going into failsafe without telling us explicitly."
  rc_lost:
    type: bool
    note: "RC receiver connection status: True,if no frame has arrived in the expected time, false otherwise. True usually means that the receiver has been disconnected, but can also indicate a radio link loss on \"stupid\" systems. Will remain false, if a RX with failsafe option continues to transmit frames after a link loss."
  rc_lost_frame_count:
    type: uint16
    note: "Number of lost RC frames. Note: intended purpose: observe the radio link quality if RSSI is not available. This value must not be used to trigger any failsafe-alike functionality."
  rc_total_frame_count:
    type: uint16
    note: "Number of total RC frames. Note: intended purpose: observe the radio link quality if RSSI is not available. This value must not be used to trigger any failsafe-alike functionality."
  rc_ppm_frame_length:
    type: uint16
    note: Length of a single PPM frame. Zero for non-PPM systems
  input_source:
    type: uint8
    note: Input source
  link_quality:
    type: int8
    note: link quality. Percentage 0-100%. -1 = invalid
  rssi_dbm:
    type: float32
    note: Actual rssi in units of dBm. NaN = invalid
