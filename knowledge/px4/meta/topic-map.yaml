# 日志 topic 名 → meta 字典键名
#
# 为什么需要这份映射：`meta/<tag>.json` 是按**上游 .msg 文件名**收录的，而日志里的 topic
# 名由固件发布决定，两边并不一一对应（PX4 改过名、也出现过只发布别名的情况）。
# 要把 meta 接进"构建期字段校验"（查规则/plot 引用的字段在不在这个固件版本里），
# 第一步就是先知道"这个日志 topic 该去哪一条字典里查"。
#
# 现状：**没有运行时消费者**——它只服务构建期校验（见下方"用在哪"）。
# 本文件**不进浏览器产物**（与 meta/ 一样是构建期的东西），所以不必内联进
# web/workers/pyodide-px4log-engine.ts。
#
# 用在哪：`tools/engine/check_rules_fields.py` 与将来的构建期字段校验。判据是先按它把
# 日志 topic 名换成字典键，再在那个键的 `fields` 里找字段（并按 tag 判版本错配）。
# 表里**没有**的日志 topic 表示"字典键与日志 topic 同名"，直接查即可。
#
# 怎么维护：上游改 uORB 名时补一行；拿不准就对着真实日志与 meta/<tag>.json 核。
# 只登记**确实对不上**的，别把同名映射也抄一遍（抄了就会漂移）。

topics:
    # PX4 1.15 起把 uORB `vehicle_gps_position` 改名为 `sensor_gps`（msg 文件 SensorGps.msg）。
    # 但实测 1.15 / 1.16 / 1.17 的日志里**两个 topic 都在**，规则沿用 `vehicle_gps_position`，
    # 而字典里只有 `sensor_gps` —— 校验时要走这一条。
    # 注意字段也换了：新字典是 latitude_deg/longitude_deg/altitude_msl_m，没有 lat/lon/alt
    # （旧固件那套在旧 tag 里，本项目目前只收了 v1.15.0 / v1.16.0 / main）。
    vehicle_gps_position: sensor_gps

    # 1.15+ 的估计器风。日志 topic 叫 estimator_wind，上游 msg 是 Wind.msg → 字典键 `wind`。
    # （日志里另有一个叫 `wind` 的 topic，与这条不是一回事，别按名字猜。）
    estimator_wind: wind

# 字典里查不到的（本项目收录的 tag 里没有对应 msg，无法校验——不是"字段不存在"）：
#   wind_estimate          旧固件的估计器风 topic，上游是 WindEstimate.msg；本项目没收旧 tag。
#                          要校验得先 `python tools/dev/fetch_px4_uorb_msg.py --tags v1.13.3,v1.14.4`
#   旧字段 lat / lon / alt  同上，旧 tag 才有
unknown:
    - wind_estimate