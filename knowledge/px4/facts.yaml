# 事实层的数据绑定与码表 —— 引擎（engine/*.py）只提供机制，具体数据全在这里。
# 改这个文件不用碰 Python：`cd web && pnpm build:kb` 之后，浏览器与本地回归同时生效。
#
# 谁读它：
#   engine/rule_engine.py   机型识别 / 飞行阶段判定 / 日志级别名 / 规则执行顺序
#   engine/report_data.py   报告页的飞行模式名 / 系统信息字段清单
# 怎么进去：构建期 web/scripts/build-knowledge.mjs 内联成 __FACTS__（与 __RULES__ 同一机制）。
#
# 下面这些**键名**是引擎约定的（改了要同步改 engine/）；**值**（字段名、码值、顺序）随 PX4 上游变。

# 规则执行顺序：引擎就按这个列表逐个 slot 执行，**顺序即报告里 finding 编号
# （F01、F02…）的生成顺序**，也决定 guard 标签的先后。
#   · 新增一条经验：把它的 slot 加进这里（或复用已有 slot），并让经验里的 slot 对上即可，
#     不用改任何 Python；构建期会校验"经验的 slot 是否都已登记"。
#   · guards_early 必须排第一（insufficient_data 要是第一个 guard 标签），guards 排最后。
slot_order:
  [guards_early,
   vibration, ekf_innovations, ekf_faults, battery, cpu, gps_health, failsafe,
   mode_thrash, motor_balance, imu_bias, attitude_tracking, airspeed,
   vtol_transition, wind_estimate, logged_messages,
   guards]

# 事实从哪个 topic 的哪个字段取（固件改了字段名就改这里；要按固件分支时见规则里的 when_fw）
bindings:
  vehicle_status:
    topic: vehicle_status
    timestamp: timestamp
    nav_state: nav_state
    arming_state: arming_state
    vehicle_type: vehicle_type
    is_rotary_wing: is_rotary_wing
    vtol_in_trans_mode: vtol_in_trans_mode
    armed_value: 2            # arming_state 等于这个值即视为已解锁

# ULog 日志级别：PX4 把 **ASCII 码**写进 log_level（'0'=48 … '7'=55），与 pyulog
# Message.log_level_str() 一致。经验里按 level_name 判定，别拿 3/4 去比 51/52。
log_levels: {48: EMERGENCY, 49: ALERT, 50: CRITICAL, 51: ERROR,
             52: WARNING, 53: NOTICE, 54: INFO, 55: DEBUG}

# 机型（vehicle_status.vehicle_type 的码值）
vehicle_types: {1: rotary_wing, 2: fixed_wing, 3: rover, 4: airship}

# 飞行模式的显示名（报告页用；码值同 PX4 commander，与 meta/<tag>.json 的 nav_state 枚举同源）
nav_state_names:
  {0: Manual, 1: Altitude, 2: Position, 3: Mission, 4: Hold, 5: Return, 6: Position Slow,
   7: Free5, 8: Free4, 10: Acro, 11: Free3, 12: Descend, 13: Termination, 14: Offboard,
   15: Stabilized, 16: Free2, 17: Takeoff, 18: Land, 19: Free1, 20: Follow, 21: Orbit,
   22: VTOL Takeoff}

# 飞行模式码 → 飞行阶段（故障库按 flight_phase 匹配时用；codes 是 nav_state 的取值）
nav_groups:
  - {phase: takeoff,   codes: [17, 22]}
  - {phase: hover,     codes: [2, 4, 6, 14, 21]}
  - {phase: maneuver,  codes: [0, 1, 10, 15]}
  - {phase: fw_cruise, codes: [3, 8]}
  - {phase: landing,   codes: [18, 20, 5, 12, 13]}

# 报告页「系统信息」展示哪些字段（按显示顺序）
sys_info_keys:
  [sys_name, ver_sw, ver_sw_release, ver_vendor_sw_release, ver_hw, ver_hw_subtype,
   sys_os_name, sys_os_ver, sys_toolchain, sys_toolchain_ver, sys_mcu, time_start_utc,
   duration, git_branch]

# ── 概览指标（结果页「关键数据」）──
# 说明：这些数字大多由规则顺带产出（rules/*.yaml 的 emit.stats），但**规则 skip 时数字就没了**
# （缺字段、机型不适用…），所以这里为重要的几项声明"兜底取数"：规则跑过就用规则的值（更贴合判定），
# 没跑就按这里的 topic/field/op 现算。label/unit/顺序只看这张表，改它不用碰 Python。
#   key   报告的键（与规则 emit.stats 的键一致才能合并；撞名时**规则值优先**）
#   op    兜底算子（必须已在 engine/operators.py 注册）；多输出的复合算子用 pick: <输出名>
#   scale 兜底值再乘的系数（单位换算，如 eph 是 mm → m 用 0.001）
metrics:
  - {key: imuAccelVibrationMax, label: 最大振动,        unit: m/s², topic: vehicle_imu_status, field: accel_vibration_metric, op: max, round: 2}
  - {key: batteryVoltageMin,   label: 最低电压,        unit: V,    topic: battery_status, field: voltage_v, op: min, round: 2}
  - {key: batteryCellVoltageMin, label: 最低电芯电压,  unit: V,    topic: battery_status,
     fields: [voltage_cell_v, voltage_v, voltage_filtered_v, cell_count], op: cell_voltage_min, pick: vmin, round: 3}
  - {key: currentMax,          label: 最大电流,        unit: A,    topic: battery_status, field: current_a, op: max, round: 2}
  - {key: batteryRemainingMin, label: 最低剩余电量,    unit: "0..1", topic: battery_status, field: remaining, op: min_ge, ge: 0, round: 3}
  - {key: gpsSatellitesMin,    label: 最少搜星,        unit: 颗,   topic: vehicle_gps_position, field: [satellites_used, satellites_visible], op: min, round: 0}
  - {key: gpsEphMaxM,          label: 最大定位误差,    unit: m,    topic: vehicle_gps_position, field: eph, op: max, scale: 0.001, round: 2}
  - {key: cpuLoadMax,          label: CPU 峰值,        unit: "0..1", topic: cpuload, field: load, op: max, round: 3}

  # 以下只声明展示名与顺序（取数依赖跨 topic 对齐或时序，交由规则产出；规则没跑则不显示）
  - {key: imuAccelClippingCountMax, label: 加速度计削波计数, unit: 次}
  - {key: imuTempRangeC,       label: IMU 温度跨度,    unit: °C}
  - {key: ekfRejectRatioPct,   label: EKF 拒绝占比,    unit: 比例}
  - {key: attitudeErrDegP99,   label: 姿态误差 p99,    unit: °}
  - {key: attitudeOscHz,       label: 姿态振荡频率,    unit: Hz}
  - {key: motorControlSpread,  label: 电机输出离散度}
  - {key: motorCountActive,    label: 活跃电机数,      unit: 个}
  - {key: gyroBiasMaxRadS,     label: 陀螺零偏最大,    unit: rad/s}
  - {key: gyroBiasDriftRadS,   label: 陀螺零偏漂移,    unit: rad/s}
  - {key: windSpeedP95M,       label: 风速 p95,        unit: m/s}
  - {key: airspeedMinM,        label: 最低空速,        unit: m/s}
  - {key: airspeedInvalidRatio, label: 空速无效占比,   unit: 比例}
  - {key: gpsJumpCount,        label: GPS 跳变次数,    unit: 次}
  - {key: navStateChanges,     label: 模式切换次数,    unit: 次}
  - {key: vtolTransitionSamples, label: VTOL 转换样本数, unit: 个}
  - {key: batteryCellCount,    label: 电芯数,          unit: 个}

# ── 地图轨迹 ──
# 取 GPS 的经纬高画轨迹。字段名与量纲都随固件改过（1.15 起 lat/lon/alt →
# latitude_deg/longitude_deg/altitude_msl_m，且 degE7→deg、mm→m），所以**每个字段给候选**，
# 按顺序取第一个存在的，并按各自的 scale 换算——这正是不把字段名写死在代码里的原因。
track:
  topic: vehicle_gps_position
  instance: 0
  lat:
    - {field: latitude_deg, scale: 1}       # 1.15+：直接是度
    - {field: lat,          scale: 1.0e-7}  # 旧固件：degE7
  lon:
    - {field: longitude_deg, scale: 1}
    - {field: lon,           scale: 1.0e-7}
  alt:
    - {field: altitude_msl_m, scale: 1}     # 1.15+：米
    - {field: alt,            scale: 0.001} # 旧固件：毫米
  max_points: 1500
