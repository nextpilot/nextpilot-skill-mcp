# 生成物，勿手改。由 tools/topics/sync-px4-msg.py 从 PX4 parameters.json 生成（main）
# 共 2656 个参数；构建期只注入被经验引用到的子集
tag: main
parameters:
  ctl_bw:
    type: int32
    default: 75
    min: 10
    max: 250
    group: UAVCAN Motor Parameters
    category: Standard
    description: Speed controller bandwidth
  ctl_dir:
    type: int32
    default: 1
    min: 0
    max: 1
    group: UAVCAN Motor Parameters
    category: Standard
    description: Reverse direction
  ctl_gain:
    type: float
    default: 1.0
    min: 0.0
    max: 1.0
    group: UAVCAN Motor Parameters
    category: Standard
    description: Speed (RPM) controller gain
  ctl_hz_idle:
    type: float
    default: 3.5
    min: 0.0
    max: 100.0
    group: UAVCAN Motor Parameters
    category: Standard
    description: Idle speed (e Hz)
  ctl_start_rate:
    type: int32
    default: 25
    min: 5
    max: 1000
    group: UAVCAN Motor Parameters
    category: Standard
    description: Spin-up rate (e Hz/s)
  esc_index:
    type: int32
    default: 0
    min: 0
    max: 15
    group: UAVCAN Motor Parameters
    category: Standard
    description: Index of this ESC in throttle command messages.
  id_ext_status:
    type: int32
    default: 20034
    min: 1
    max: 1000000
    group: UAVCAN Motor Parameters
    category: Standard
    description: Extended status ID
  int_ext_status:
    type: int32
    default: 50000
    min: 0
    max: 1000000
    group: UAVCAN Motor Parameters
    category: Standard
    description: Extended status interval (µs)
  int_status:
    type: int32
    default: 50000
    max: 1000000
    group: UAVCAN Motor Parameters
    category: Standard
    description: ESC status interval (µs)
  mot_i_max:
    type: float
    default: 12.0
    min: 1.0
    max: 80.0
    group: UAVCAN Motor Parameters
    category: Standard
    description: Motor current limit in amps
  mot_kv:
    type: int32
    default: 2300
    min: 0
    max: 4000
    group: UAVCAN Motor Parameters
    category: Standard
    description: Motor Kv in RPM per volt
  mot_ls:
    type: float
    default: 0.0
    group: UAVCAN Motor Parameters
    category: Standard
    description: "READ ONLY: Motor inductance in henries."
  mot_num_poles:
    type: int32
    default: 14
    min: 2
    max: 40
    group: UAVCAN Motor Parameters
    category: Standard
    description: Number of motor poles.
  mot_rs:
    type: float
    default: 0.0
    group: UAVCAN Motor Parameters
    category: Standard
    description: "READ ONLY: Motor resistance in ohms"
  mot_v_accel:
    type: float
    default: 0.5
    min: 0.01
    max: 1.0
    group: UAVCAN Motor Parameters
    category: Standard
    description: Acceleration limit (V)
  mot_v_max:
    type: float
    default: 14.8
    min: 0.0
    group: UAVCAN Motor Parameters
    category: Standard
    description: Motor voltage limit in volts
  gnss.dyn_model:
    type: int32
    default: 2
    min: 0
    max: 2
    group: UAVCAN GNSS
    category: Standard
    description: GNSS dynamic model
    values:
      0: Automotive
      1: Sea
      2: Airborne
  gnss.old_fix_msg:
    type: int32
    default: 1
    min: 0
    max: 1
    group: UAVCAN GNSS
    category: Standard
    description: Broadcast old GNSS fix message
    values:
      0: Fix2
      1: Fix and Fix2
  gnss.warn_dimens:
    type: int32
    default: 0
    min: 0
    max: 3
    group: UAVCAN GNSS
    category: Standard
    description: device health warning
    values:
      0: disables the feature
      1: time-only solution
      2: planar (2D) solution
      3: full (3D) solution
  gnss.warn_sats:
    type: int32
    default: 0
    group: UAVCAN GNSS
    category: Standard
    description: Set the device health to Warning if the number of satellites         used in the GNSS solution is below this threshold. Zero         disables the feature
  uavcan.pubp-pres:
    type: int32
    default: 0
    min: 0
    max: 1000000
    group: UAVCAN GNSS
    category: Standard
    description: Set the device health to Warning if the number of satellites         used in the GNSS solution is below this threshold. Zero         disables the feature
