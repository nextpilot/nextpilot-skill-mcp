# 仓库校验（CI 侧）。
#
# 校验命令**不写在这里**——只调 tools/ci/check_all.py，与本地、pre-push hook 共用同一份
# 清单。理由：命令抄成两份后必然漂移，然后"本地绿、CI 红"会变成常态，两边都开始被忽略。
# 要加一项校验，改 tools/ci/check_all.py 一处即可，CI 自动跟着变。
#
# ⚠ **CI 全绿 ≠ 回归过了**：需要真实 .ulg 的那组校验（6 条冻结基线逐字段比对、适配器契约
# 测试、数据层 probe）在这里必然被跳过——原始日志含 GPS 轨迹，按项目隐私规则不入库
# （见 .gitignore 的 tools/calibrate/logs/*.ulg），checkout 里根本没有这些文件。
# 那几项挂在 .githooks/pre-push 上，只在开发机跑。详情见 tools/ci/check_all.py 的文档。
name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 版本对齐开发机（node 22 / pnpm 12），本地过不了的这里也不该过
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      # ruff 版本钉死在这里（见 requirements-dev.txt）：风格约定只有所有人跑同一版才成立
      - name: 装 Python 校验工具
        run: python -m pip install -r requirements-dev.txt

      - name: 装 web 依赖
        working-directory: web
        run: pnpm install --frozen-lockfile

      # --with-build：CI 才跑 next build（真编译），本地默认跳过（太慢，已挂在 pre-push 的
      # 那套里没有它）。其余校验项见 tools/ci/check_all.py
      - name: 仓库校验
        run: python tools/ci/check_all.py --with-build
