# Repository validation — quality gate (build + lint + typecheck + guards).
# E2E is in e2e.yml, guard self-proof in mutate.yml — parallel, no mutual blocking.
#
# No check commands here — just calls tools/ci/check_all.py, same as local pre-push.
# To add a check: edit tools/ci/check_all.py; CI picks it up automatically.
name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # Version string embedded in filed issues (read by web/lib/issue-bridge.ts).
      # Without it, production errors cannot be traced to a specific commit.
      # The artifact itself is diagnostic only — does not affect build:kb --check parity.
      NEXT_PUBLIC_APP_VERSION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install deps (--ci mode: pip install + pnpm --frozen-lockfile + playwright)
        run: ./tools/setup/setup.sh

      - name: Validate
        run: python tools/ci/check_all.py --build --ci

      # Log-dependent steps always SKIP in CI. Show a reminder so "all green"
      # is not misinterpreted as a full regression pass.
      - name: "Reminder: log-dependent regressions not run"
        if: always()
        run: |
          echo "::notice::CI all-green != full regression passed — 4 log-dependent checks (frozen baseline diff / adapter contract / probe-data / lint_rules --strict) only run locally with real .ulg files: python tools/ci/check_all.py"