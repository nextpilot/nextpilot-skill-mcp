# Deploy to EdgeOne Pages (Next.js full-stack mode).
#
# Relationship with CI: CI only judges quality; this only handles publishing.
# Hooks into workflow_run to wait for CI to finish — deploy only if CI passed,
# avoiding "validation failed but already live". workflow_dispatch is for rollbacks
# and manual redeploys.
#
# Why not pass build artifacts from CI: this project is full-stack mode (edge
# functions in web/functions/, runtime reads package.json + functions/), not static
# export. EdgeOne CLI's recommended path is to deploy from source and let the CLI
# build — so no pnpm install or .next artifact passing here: less artifact assembly
# risk, no need to transfer node_modules. If switching to output: 'export' static
# export, change to build first then deploy ./out.
#
# Repository config (Settings → Secrets and variables → Actions):
#   Secrets:   EDGEONE_API_TOKEN   CI/CD token from EdgeOne console
#   Variables: EDGEONE_PROJECT     Project name (-n flag; wrong value auto-creates an empty project)
#              SMOKE_BASE_URL      Optional, production origin; skip post-deploy smoke if unset
#
# Environment variables (AUTH_SECRET / DEEPSEEK_API_KEY / SMTP_* / ISSUE_* etc.)
# are NOT injected here — configure them in EdgeOne console project env vars
# (see docs/operations/README.md section 3): secrets stay out of repo and CI logs.
name: Deploy

on:
  # Deploy only after CI passes. conclusion is checked in job if — workflow_run
  # cannot filter by result at the event level.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master]
  workflow_dispatch:
    inputs:
      env:
        description: Deployment target environment
        required: true
        default: production
        type: choice
        options: [production, preview]
  # Same-repo PR → preview environment. Fork PRs cannot access secrets;
  # explicitly skip via if rather than letting it fail.
  pull_request:
    branches: [master]

concurrency:
  # Production: serial; preview: per-PR isolation.
  # cancel-in-progress: false — cancelling mid-deploy leaves half-baked artifacts.
  group: deploy-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'production' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy (${{ github.event_name == 'pull_request' && 'preview' || github.event.inputs.env || 'production' }})
    # workflow_run: only proceed on CI success. workflow_dispatch: always allow (rollback / manual deploy path).
    if: >
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DEPLOY_ENV: ${{ github.event.inputs.env || 'production' }}
      # workflow_run checkout defaults to master, not the triggering commit.
      # Must explicitly use head_sha, otherwise we deploy code CI never validated.
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify deployment config
        env:
          TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
          PROJECT: ${{ vars.EDGEONE_PROJECT }}
        run: |
          set -euo pipefail
          [ -n "${TOKEN}" ] || {
            echo "::error::Missing secret EDGEONE_API_TOKEN (EdgeOne console → API Token)"
            exit 1
          }
          [ -n "${PROJECT}" ] || {
            echo "::error::Missing variable EDGEONE_PROJECT (EdgeOne Pages project name; wrong value auto-creates an empty project)"
            exit 1
          }
          echo "OK config ready, target project ${PROJECT}"

      # Not pinning version: EdgeOne CLI is still in rapid iteration.
      # **After first successful run, pin it** (check edgeone version in logs,
      # change to edgeone@x.y.z) — same reasoning as pinning ruff in requirements-dev.txt.
      - name: Deploy to EdgeOne Pages
        id: deploy
        working-directory: web
        env:
          TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
          PROJECT: ${{ vars.EDGEONE_PROJECT }}
        run: npx --yes edgeone pages deploy -n "$PROJECT" -t "$TOKEN" -e "$DEPLOY_ENV"

      # Full E2E after deploy: real Playwright hitting the live site SMOKE_BASE_URL.
      # Replaces the old weak curl /ping smoke test — validates the full pipeline
      # end-to-end: upload .ulg → Pyodide parse → render on the live build.
      # Only runs for production when SMOKE_BASE_URL is configured.
      # Failure means the live site is broken — deploy is considered failed.
      - name: Install pnpm + Playwright browsers
        if: vars.SMOKE_BASE_URL != '' && env.DEPLOY_ENV == 'production'
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.1

      - name: Post-deploy full E2E (real Playwright, live site)
        if: vars.SMOKE_BASE_URL != '' && env.DEPLOY_ENV == 'production'
        working-directory: web
        env:
          SMOKE_BASE_URL: ${{ vars.SMOKE_BASE_URL }}
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
          pnpm exec playwright test --config playwright.live.config.ts

      - name: Summary
        if: always()
        run: |
          echo "env=${DEPLOY_ENV} commit=${DEPLOY_SHA} trigger=${{ github.event_name }}"
          echo "Post-deploy self-check order: /issue-probe → /issue-probe?write=1 (requires ISSUE_DEBUG=1), see docs/operations/README.md section 7"

  preview:
    name: Preview (PR #${{ github.event.pull_request.number }})
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEPLOY_ENV: preview
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify deployment config
        env:
          TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
          PROJECT: ${{ vars.EDGEONE_PROJECT }}
        run: |
          set -euo pipefail
          [ -n "${TOKEN}" ] || { echo "::error::Missing secret EDGEONE_API_TOKEN"; exit 1; }
          [ -n "${PROJECT}" ] || { echo "::error::Missing variable EDGEONE_PROJECT"; exit 1; }

      - name: Deploy to preview environment
        working-directory: web
        env:
          TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
          PROJECT: ${{ vars.EDGEONE_PROJECT }}
        run: npx --yes edgeone pages deploy -n "$PROJECT" -t "$TOKEN" -e preview
